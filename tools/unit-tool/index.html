<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单位与进制转换 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/unit-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🛠️ 单位与进制转换</h1>
  <p>大数进制互转、日常单位换算、金额大写、罗马数字。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="un-layout" style="padding-top: 0;">
  <div class="un-grid">
    <!-- 1. 进制转换 -->
    <div class="un-card">
      <h2>💻 进制转换 (支持大数)</h2>
      <div class="un-row">
        <label>10 进制</label>
        <input type="text" id="base-10" class="un-input" placeholder="十进制数字">
      </div>
      <div class="un-row">
        <label>16 进制</label>
        <input type="text" id="base-16" class="un-input" placeholder="十六进制 (如 FF)">
      </div>
      <div class="un-row">
        <label>2 进制</label>
        <input type="text" id="base-2" class="un-input" placeholder="二进制">
      </div>
      <div class="un-row">
        <label>8 进制</label>
        <input type="text" id="base-8" class="un-input" placeholder="八进制">
      </div>
    </div>

    <!-- 2. 单位换算 -->
    <div class="un-card">
      <h2>📏 物理与存储单位</h2>
      <select id="unit-type" class="un-select">
        <option value="length">长度 (m, km, cm)</option>
        <option value="weight">重量 (kg, g, lb)</option>
        <option value="storage">存储 (B, KB, MB, GB)</option>
      </select>
      
      <div class="un-row">
        <input type="number" id="unit-input" class="un-input" value="1">
        <select id="unit-from" class="un-select-half"></select>
        <span>→</span>
        <select id="unit-to" class="un-select-half"></select>
      </div>
      <div class="un-result" id="unit-result">1</div>
    </div>

    <!-- 3. 中文大写金额 -->
    <div class="un-card">
      <h2>🧾 人民币大写金额</h2>
      <div class="un-row">
        <input type="number" id="rmb-input" class="un-input" placeholder="输入金额，如 1234.56" value="1234.56">
        <button id="btn-rmb" class="un-btn">转换</button>
      </div>
      <div class="un-result" id="rmb-result">壹仟贰佰叁拾肆元伍角陆分</div>
    </div>

    <!-- 4. 罗马数字 -->
    <div class="un-card">
      <h2>🏛️ 罗马数字转换</h2>
      <div class="un-row">
        <input type="number" id="roman-input" class="un-input" placeholder="1 - 3999" value="2024">
        <span>⇌</span>
        <input type="text" id="roman-output" class="un-input" readonly>
      </div>
    </div>
  </div>
</main>
<script src="../../js/unit-tool.js" defer></script>
</body>
</html>
