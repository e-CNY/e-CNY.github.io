<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单位与进制转换 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/unit-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🛠️ 单位与进制转换</h1>
  <p>万能进制、中文数字、开发单位、物理换算一网打尽。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="un-layout" style="padding-top: 0;">
  <div class="un-grid">
    <!-- 1. 进制转换 -->
    <div class="un-card">
      <h2>💻 万能进制转换</h2>
      <div class="un-row"><label>10 进制</label><input type="text" id="base-10" class="un-input" placeholder="十进制数字"></div>
      <div class="un-row"><label>16 进制</label><input type="text" id="base-16" class="un-input" placeholder="十六进制"></div>
      <div class="un-row"><label>2 进制</label><input type="text" id="base-2" class="un-input" placeholder="二进制"></div>
      <div class="un-row"><label>8 进制</label><input type="text" id="base-8" class="un-input" placeholder="八进制"></div>
      <div class="un-row">
        <label>其他 (2-36)</label>
        <input type="number" id="base-custom-n" class="un-input" style="max-width:60px;" placeholder="N" value="36">
        <input type="text" id="base-custom" class="un-input" placeholder="N进制数">
      </div>
    </div>

    <!-- 2. 单位换算 -->
    <div class="un-card">
      <h2>📏 物理与开发单位</h2>
      <select id="unit-type" class="un-select">
        <option value="length">长度 (m, km, cm)</option>
        <option value="weight">重量 (kg, g, lb)</option>
        <option value="storage">存储 (B, KB, MB, GB)</option>
        <option value="temperature">温度 (℃, ℉, K)</option>
        <option value="speed">速度 (km/h, m/s, mph)</option>
        <option value="area">面积 (m², 亩, 公顷)</option>
        <option value="dev">CSS 单位 (px, rem, em)</option>
      </select>
      
      <div class="un-row" id="unit-input-row">
        <input type="number" id="unit-input" class="un-input" value="1">
        <select id="unit-from" class="un-select-half"></select>
        <span>→</span>
        <select id="unit-to" class="un-select-half"></select>
      </div>
      
      <div class="un-row" id="dev-root-row" style="display:none;">
        <label>根字号 (px)</label>
        <input type="number" id="dev-root-size" class="un-input" value="16">
      </div>

      <div class="un-result" id="unit-result">1</div>
    </div>

    <!-- 3. 中文数字与金额 -->
    <div class="un-card">
      <h2>🧾 中文数字 / 大写金额</h2>
      <div class="un-row">
        <input type="text" id="cn-num-input" class="un-input" placeholder="阿拉伯数字，如 1234.56" value="1234.56">
        <button id="btn-cn-num" class="un-btn">转中文</button>
      </div>
      <div class="un-result" id="cn-num-result" style="font-size: 1rem;">壹仟贰佰叁拾肆元伍角陆分</div>
      
      <div class="un-row" style="margin-top: 16px;">
        <input type="text" id="cn-str-input" class="un-input" placeholder="中文数字，如 九万九千" value="九万九千">
        <button id="btn-cn-str" class="un-btn">转数字</button>
      </div>
      <div class="un-result" id="cn-str-result">99000</div>
    </div>

    <!-- 4. 罗马数字 -->
    <div class="un-card">
      <h2>🏛️ 罗马数字转换</h2>
      <div class="un-row">
        <input type="number" id="roman-input" class="un-input" placeholder="1 - 3999" value="2024">
        <span>⇌</span>
        <input type="text" id="roman-output" class="un-input" readonly>
      </div>
    </div>
  </div>
</main>
<script src="../../js/unit-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
