<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络与底层工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/net-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🌐 网络与底层工具</h1>
  <p>CIDR 子网划分计算、UA 浏览器解析、HTTP 状态码查询。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="nt-layout" style="padding-top: 0;">
  <div class="nt-tabs">
    <button class="nt-tab active" data-target="panel-cidr">CIDR 子网计算</button>
    <button class="nt-tab" data-target="panel-ua">UA 浏览器检测</button>
    <button class="nt-tab" data-target="panel-http">HTTP 状态码</button>
  </div>

  <div class="nt-content">
    <!-- 1. CIDR 计算 -->
    <div id="panel-cidr" class="nt-panel active">
      <div class="nt-row">
        <input type="text" id="cidr-input" class="nt-input" placeholder="输入 IPv4 / CIDR，如 192.168.1.0/24" value="192.168.1.0/24">
        <button id="btn-cidr" class="nt-btn primary">计算</button>
      </div>
      <div class="nt-result-box" id="cidr-result">
        <!-- 结果展示 -->
      </div>
    </div>

    <!-- 2. UA 检测 -->
    <div id="panel-ua" class="nt-panel">
      <div class="nt-row">
        <textarea id="ua-input" class="nt-textarea" rows="3"></textarea>
      </div>
      <button id="btn-ua" class="nt-btn primary">解析 UA</button>
      <div class="nt-result-box" id="ua-result"></div>
    </div>

    <!-- 3. HTTP 状态码 -->
    <div id="panel-http" class="nt-panel">
      <div class="nt-row">
        <input type="text" id="http-input" class="nt-input" placeholder="搜索状态码或关键字 (如 404, 重定向)">
      </div>
      <div class="nt-table-wrap">
        <table class="nt-table" id="http-table">
          <thead><tr><th>状态码</th><th>名称</th><th>说明</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="../../js/net-tool.js" defer></script>
</body>
</html>
