<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随机数据工具箱 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/mock-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="mk-layout">
  <div class="mk-topbar">
    <div class="mk-top-actions">
      <button class="mk-icon-btn" id="btn-history" type="button" title="历史记录">📜 历史 <span id="history-count">0</span></button>
</div>
  </div>

  <div class="mk-tabs" id="mk-tabs">
    <button class="mk-tab active" data-target="panel-mock" type="button">🆔 随机数据</button>
    <button class="mk-tab" data-target="panel-lottery" type="button">🎰 抽奖</button>
    <button class="mk-tab" data-target="panel-dice" type="button">🎲 骰子</button>
    <button class="mk-tab" data-target="panel-random" type="button">🔢 随机值</button>
  </div>

  <div class="mk-content">

    <!-- ============ 1. 随机数据 ============ -->
    <div id="panel-mock" class="mk-panel active">
      <div class="mk-mock-layout">
        <div class="mk-mock-left">
          <div class="mk-field">
            <label>生成数量</label>
            <div class="mk-inline">
              <input type="number" id="mock-count" class="mk-input" value="10" min="1" max="1000">
              <div class="mk-seg" id="mock-count-seg">
                <button data-n="5" type="button">5</button>
                <button data-n="10" class="active" type="button">10</button>
                <button data-n="50" type="button">50</button>
                <button data-n="100" type="button">100</button>
              </div>
            </div>
          </div>

          <div class="mk-field">
            <label>
              <span>包含字段</span>
              <span class="mk-field-actions">
                <button class="mk-mini-btn" id="btn-select-all" type="button">全选</button>
                <button class="mk-mini-btn" id="btn-select-none" type="button">清空</button>
                <button class="mk-mini-btn" id="btn-select-preset-cn" type="button">中国用户</button>
                <button class="mk-mini-btn" id="btn-select-preset-ecom" type="button">电商订单</button>
              </span>
            </label>
            <div class="mk-fields-grid" id="mock-fields"></div>
          </div>

          <div class="mk-field">
            <label>输出格式</label>
            <div class="mk-seg mk-seg-wide" id="mock-format-seg">
              <button data-format="json" class="active" type="button">JSON</button>
              <button data-format="csv" type="button">CSV</button>
              <button data-format="sql" type="button">SQL</button>
              <button data-format="ts" type="button">TypeScript</button>
              <button data-format="yaml" type="button">YAML</button>
              <button data-format="markdown" type="button">Markdown</button>
            </div>
          </div>

          <div class="mk-field">
            <label>表名（用于 SQL/TS）</label>
            <input type="text" id="mock-table-name" class="mk-input" value="users">
          </div>

          <button id="btn-gen-mock" class="mk-btn primary mk-btn-block" type="button">🎲 生成数据</button>
        </div>

        <div class="mk-mock-right">
          <div class="mk-output-head">
            <span id="mock-output-info">点击生成</span>
            <div class="mk-output-actions">
              <button class="mk-mini-btn" id="btn-mock-copy" type="button" hidden>📋 复制</button>
              <button class="mk-mini-btn" id="btn-mock-download" type="button" hidden>📥 下载</button>
            </div>
          </div>
          <textarea id="mock-output" class="mk-textarea" spellcheck="false" readonly
                    placeholder="生成的数据将显示在此"></textarea>
        </div>
      </div>
    </div>

    <!-- ============ 2. 抽奖 ============ -->
    <div id="panel-lottery" class="mk-panel">
      <div class="mk-lottery-layout">
        <div class="mk-lottery-left">
          <div class="mk-field">
            <label>
              <span>抽奖选项</span>
              <span class="mk-field-actions">
                <button class="mk-mini-btn" id="btn-lottery-demo" type="button">填充示例</button>
                <button class="mk-mini-btn" id="btn-lottery-clear" type="button">清空</button>
              </span>
            </label>
            <textarea id="lottery-input" class="mk-textarea" rows="8"
                      placeholder="每行一个名字&#10;支持权重：名字,权重（如：张三,5）&#10;&#10;张三&#10;李四&#10;王五,3"></textarea>
            <div class="mk-lottery-meta" id="lottery-meta">0 个选项</div>
          </div>

          <div class="mk-field">
            <label>抽取数量</label>
            <div class="mk-inline">
              <input type="number" id="lottery-count" class="mk-input" value="1" min="1" max="50">
              <label class="mk-checkbox">
                <input type="checkbox" id="lottery-unique" checked> 不重复
              </label>
              <label class="mk-checkbox">
                <input type="checkbox" id="lottery-animate" checked> 动画
              </label>
            </div>
          </div>

          <button id="btn-lottery" class="mk-btn primary mk-btn-block" type="button">🎰 开始抽取</button>
          <button id="btn-lottery-reset" class="mk-btn mk-btn-block" type="button" style="margin-top:8px;">🔄 重置所有选项</button>
        </div>

        <div class="mk-lottery-right">
          <div class="mk-winner-display" id="lottery-display">
            <div class="mk-winner-hint">🎯 点击「开始抽取」</div>
          </div>
          <div class="mk-lottery-history-head">本轮结果</div>
          <div class="mk-lottery-history" id="lottery-history"></div>
        </div>
      </div>
    </div>

    <!-- ============ 3. 骰子 ============ -->
    <div id="panel-dice" class="mk-panel">
      <div class="mk-dice-layout">
        <div class="mk-dice-left">
          <div class="mk-field">
            <label>快捷骰子</label>
            <div class="mk-dice-grid" id="dice-quick"></div>
          </div>

          <div class="mk-field">
            <label>自定义组合（格式 NdM，如 2d6 = 掷 2 个 6 面骰）</label>
            <div class="mk-inline">
              <input type="number" id="dice-n" class="mk-input mk-input-sm" value="2" min="1" max="20">
              <span class="mk-unit-text">d</span>
              <input type="number" id="dice-m" class="mk-input mk-input-sm" value="6" min="2" max="100">
              <button class="mk-btn primary" id="btn-roll-custom" type="button" style="margin-left:8px;">🎲 投掷</button>
            </div>
          </div>

          <div class="mk-field">
            <label>修正值（可选）</label>
            <div class="mk-inline">
              <input type="number" id="dice-modifier" class="mk-input" value="0" min="-100" max="100">
              <span class="mk-hint">最终结果 = 骰子总和 + 修正值</span>
            </div>
          </div>

          <button class="mk-btn mk-btn-block" id="btn-clear-dice" type="button">🗑 清空历史</button>
        </div>

        <div class="mk-dice-right">
          <div class="mk-dice-display" id="dice-display">
            <div class="mk-winner-hint">🎲 点击上方骰子开始投掷</div>
          </div>
          <div class="mk-dice-history-head">
            <span>投掷历史</span>
            <span id="dice-history-count"></span>
          </div>
          <div class="mk-dice-history" id="dice-history"></div>
        </div>
      </div>
    </div>

    <!-- ============ 4. 随机值 ============ -->
    <div id="panel-random" class="mk-panel">
      <div class="mk-random-grid">
        <div class="mk-card">
          <h3>🔢 随机整数</h3>
          <div class="mk-inline">
            <input type="number" id="rnd-int-min" class="mk-input" value="1">
            <span class="mk-unit-text">至</span>
            <input type="number" id="rnd-int-max" class="mk-input" value="100">
          </div>
          <div class="mk-inline">
            <input type="number" id="rnd-int-count" class="mk-input mk-input-sm" value="1" min="1" max="100">
            <span class="mk-unit-text">个</span>
            <button class="mk-btn primary" id="btn-rnd-int" type="button">生成</button>
          </div>
          <div class="mk-value-output" id="rnd-int-output">—</div>
        </div>

        <div class="mk-card">
          <h3>📊 随机小数</h3>
          <div class="mk-inline">
            <input type="number" id="rnd-float-min" class="mk-input" value="0" step="any">
            <span class="mk-unit-text">至</span>
            <input type="number" id="rnd-float-max" class="mk-input" value="1" step="any">
          </div>
          <div class="mk-inline">
            <input type="number" id="rnd-float-dec" class="mk-input mk-input-sm" value="2" min="0" max="10">
            <span class="mk-unit-text">位小数</span>
            <button class="mk-btn primary" id="btn-rnd-float" type="button">生成</button>
          </div>
          <div class="mk-value-output" id="rnd-float-output">—</div>
        </div>

        <div class="mk-card">
          <h3>🔤 随机字符串</h3>
          <div class="mk-inline">
            <input type="number" id="rnd-str-len" class="mk-input mk-input-sm" value="16" min="1" max="200">
            <span class="mk-unit-text">位</span>
            <select id="rnd-str-charset" class="mk-select">
              <option value="alnum">大小写+数字</option>
              <option value="lower">小写字母</option>
              <option value="upper">大写字母</option>
              <option value="num">纯数字</option>
              <option value="hex">十六进制</option>
              <option value="base58">Base58（无 0OIl）</option>
              <option value="emoji">Emoji 表情</option>
            </select>
            <button class="mk-btn primary" id="btn-rnd-str" type="button">生成</button>
          </div>
          <div class="mk-value-output mk-value-mono" id="rnd-str-output">—</div>
        </div>

        <div class="mk-card">
          <h3>🎨 随机颜色</h3>
          <div class="mk-inline">
            <button class="mk-btn primary" id="btn-rnd-color" type="button">生成随机色</button>
            <button class="mk-btn" id="btn-rnd-color-batch" type="button">一次 5 个</button>
          </div>
          <div class="mk-color-grid" id="rnd-color-output"></div>
        </div>

        <div class="mk-card">
          <h3>🆔 批量 UUID</h3>
          <div class="mk-inline">
            <input type="number" id="rnd-uuid-count" class="mk-input mk-input-sm" value="5" min="1" max="100">
            <span class="mk-unit-text">个</span>
            <button class="mk-btn primary" id="btn-rnd-uuid" type="button">生成</button>
          </div>
          <textarea id="rnd-uuid-output" class="mk-textarea mk-textarea-sm" readonly></textarea>
        </div>

        <div class="mk-card">
          <h3>🎯 硬币 & 骰子</h3>
          <div class="mk-inline">
            <button class="mk-btn" id="btn-coin" type="button">🪙 抛硬币</button>
            <button class="mk-btn" id="btn-die-6" type="button">🎲 D6</button>
            <button class="mk-btn" id="btn-die-20" type="button">🎲 D20</button>
          </div>
          <div class="mk-value-output" id="rnd-coin-output">—</div>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- 历史抽屉 -->
<div class="mk-drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="mk-drawer" id="drawer">
  <div class="mk-drawer-head">
    <h3>📜 操作历史</h3>
    <button class="mk-icon-btn" id="drawer-close" type="button">✕</button>
  </div>
  <div class="mk-drawer-list" id="drawer-list"></div>
  <div class="mk-drawer-actions">
    <button class="mk-btn mk-btn-danger" id="clear-history" type="button">🗑 清空历史</button>
  </div>
</aside>

<div class="mk-toast" id="mk-toast"></div>

<script src="../../js/mock-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
