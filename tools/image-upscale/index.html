<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片超分</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="tool-body">
<div class="tool-page">
  <a class="back" href="../../">← 返回首页</a>
  <h1>图片超分</h1>
  <p style="color:#666;font-size:.85rem;margin-bottom:1rem">
    使用 Real-ESRGAN x4plus 模型，首次使用需下载约 32MB。2x 和 3x 是在 4x 结果基础上缩小，画质优于直接放大原图。
  </p>

  <input type="file" id="sr-input" accept="image/*">

  <label style="display:block;margin:.75rem 0;font-size:.9rem">
    放大倍数：
    <select id="scale-factor" style="width:auto;display:inline-block;margin-left:.5rem">
      <option value="2">2x</option>
      <option value="3">3x</option>
      <option value="4" selected>4x</option>
    </select>
  </label>

  <button onclick="upscale()" id="sr-btn">开始放大</button>
  <div class="status" id="sr-status"></div>
  <div class="result" id="sr-result"></div>
</div>

<script src="../../assets/js/ort.min.js"></script>
<script>
ort.env.wasm.numThreads = 1;
ort.env.wasm.wasmPaths = '../../assets/js/';

const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB
let srSession = null;

async function loadSR() {
  if (srSession) return;
  document.getElementById('sr-status').textContent = '加载模型（约 32MB）...';
  srSession = await ort.InferenceSession.create('../../models/real-esrgan/model.onnx', {
    executionProviders: ['wasm']
  });
}

async function upscale() {
  const file = document.getElementById('sr-input').files[0];
  if (!file) { document.getElementById('sr-status').textContent = '请选择图片'; return; }
  if (file.size > MAX_FILE_SIZE) {
    document.getElementById('sr-status').textContent =
      `文件过大（${(file.size/1024/1024).toFixed(1)}MB），请上传小于 5MB 的图片。`;
    return;
  }

  const scaleFactor = parseInt(document.getElementById('scale-factor').value);

  document.getElementById('sr-btn').disabled = true;
  try {
    await loadSR();
    document.getElementById('sr-status').textContent = '处理中（可能需要几十秒）...';

    const img = new Image();
    img.src = URL.createObjectURL(file);
    await img.decode();

    // 统一限制模型输入最大边长 512，防止内存溢出
    const maxInput = 512;
    const scale = Math.min(1, maxInput / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const imageData = ctx.getImageData(0, 0, w, h);
    const { data } = imageData;
    const input = new Float32Array(3 * h * w);
    for (let i = 0; i < w * h; i++) {
      input[i] = data[i * 4] / 255;
      input[h * w + i] = data[i * 4 + 1] / 255;
      input[2 * h * w + i] = data[i * 4 + 2] / 255;
    }
    const tensor = new ort.Tensor('float32', input, [1, 3, h, w]);

    // 模型输出固定为 4x 尺寸
    const output = await srSession.run({ input: tensor });
    const out = output.output.data;
    const modelOutH = output.output.dims[2];
    const modelOutW = output.output.dims[3];

    // 先将 4x 结果绘制到中间画布
    const intermediateCanvas = document.createElement('canvas');
    intermediateCanvas.width = modelOutW;
    intermediateCanvas.height = modelOutH;
    const intermediateCtx = intermediateCanvas.getContext('2d');
    const outImage = intermediateCtx.createImageData(modelOutW, modelOutH);
    for (let i = 0; i < modelOutW * modelOutH; i++) {
      outImage.data[i * 4] = Math.min(255, Math.max(0, out[i] * 255));
      outImage.data[i * 4 + 1] = Math.min(255, Math.max(0, out[modelOutW * modelOutH + i] * 255));
      outImage.data[i * 4 + 2] = Math.min(255, Math.max(0, out[2 * modelOutW * modelOutH + i] * 255));
      outImage.data[i * 4 + 3] = 255;
    }
    intermediateCtx.putImageData(outImage, 0, 0);

    // 根据用户选择的倍数计算最终输出尺寸
    const targetW = w * scaleFactor;
    const targetH = h * scaleFactor;
    const outCanvas = document.createElement('canvas');
    outCanvas.width = targetW;
    outCanvas.height = targetH;
    const outCtx = outCanvas.getContext('2d');

    // 将 4x 中间画布缩放到目标尺寸（2x、3x 或 4x）
    outCtx.drawImage(intermediateCanvas, 0, 0, targetW, targetH);

    const url = outCanvas.toDataURL('image/png');
    document.getElementById('sr-status').textContent = `✓ 完成，输出 ${targetW}×${targetH}`;
    document.getElementById('sr-result').innerHTML =
      `<img src="${url}" alt="超分结果"><br><a href="${url}" download="upscaled_${scaleFactor}x.png">下载结果</a>`;
  } catch (e) {
    document.getElementById('sr-status').textContent = '✗ ' + e.message;
  } finally {
    document.getElementById('sr-btn').disabled = false;
  }
}
</script>
</body>
</html>
