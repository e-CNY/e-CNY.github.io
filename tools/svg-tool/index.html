<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG 工具箱 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/svg-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🖼️ SVG 工具箱</h1>
  <p>实时预览 SVG 代码、格式化压缩、转为高清 PNG。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="sv-layout" style="padding-top: 0;">
  <div class="sv-container">
    <div class="sv-col">
      <div class="sv-toolbar">
        <button id="btn-format" class="sv-btn">格式化</button>
        <button id="btn-minify" class="sv-btn">压缩 (Minify)</button>
        <button id="btn-download-svg" class="sv-btn primary">下载 SVG</button>
        <button id="btn-download-png" class="sv-btn primary">下载 PNG</button>
      </div>
      <textarea id="sv-input" class="sv-textarea" spellcheck="false" placeholder="在此粘贴 SVG 代码..."></textarea>
    </div>
    <div class="sv-col">
      <div class="sv-preview-wrap">
        <div id="sv-preview" class="sv-preview">
          <!-- 渲染区 -->
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../js/svg-tool.js" defer></script>
</body>
</html>
