<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon 生成器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/favicon-generator.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="fg-wrap">
  <div class="fg-layout">
    <!-- 左侧控制面板 -->
    <aside class="fg-sidebar">
      <!-- 模式切换 -->
      <div class="fg-tabs">
        <button data-mode="image" class="active">🖼️ 从图片生成</button>
        <button data-mode="text">🔤 从文字生成</button>
      </div>

      <!-- 图片模式控制 -->
      <div id="imagePanel" class="fg-panel">
        <div class="fg-upload" id="dropZone">
          <input type="file" id="fileInput" accept="image/*" hidden>
          <div class="upload-icon">📁</div>
          <p>点击 / 拖拽 / 粘贴图片</p>
          <small>支持 PNG / JPG / WebP / SVG，建议正方形</small>
        </div>
        
        <div class="fg-settings">
          <label class="fg-label">缩放模式</label>
          <select id="imgFitMode" class="fg-input">
            <option value="cover">裁剪铺满 (无留白)</option>
            <option value="contain">等比留白 (显示完整)</option>
            <option value="fill">拉伸变形</option>
          </select>

          <label class="fg-label" style="margin-top: 10px;">滤镜效果</label>
          <select id="imgFilter" class="fg-input">
            <option value="none">无滤镜</option>
            <option value="grayscale(100%)">黑白</option>
            <option value="sepia(100%)">复古</option>
            <option value="invert(100%)">反色</option>
            <option value="brightness(1.3)">提亮</option>
            <option value="contrast(1.5)">高对比</option>
          </select>
          
          <label class="fg-label" style="margin-top: 10px;">背景颜色</label>
          <div class="fg-color-row">
            <input type="color" id="imgBgColor" value="#ffffff" class="fg-color">
            <span id="imgBgColorVal" class="fg-color-val">#FFFFFF</span>
            <label class="fg-checkbox-label" style="margin-left:auto;">
              <input type="checkbox" id="imgBgTransparent"> 透明
            </label>
          </div>

          <label class="fg-label" style="margin-top: 10px;">整体圆角 (<span id="imgRadiusVal">0</span>%)</label>
          <input type="range" id="imgRadius" min="0" max="50" value="0" class="fg-range">
        </div>
      </div>

      <!-- 文字模式控制 -->
      <div id="textPanel" class="fg-panel" hidden>
        <div class="fg-settings">
          <label class="fg-label">文字 (1-2字)</label>
          <input id="textInput" type="text" maxlength="2" value="A" class="fg-input">

          <label class="fg-label" style="margin-top: 10px;">字体选择</label>
          <select id="fontFamily" class="fg-input">
            <option value="sans-serif">系统无衬线</option>
            <option value="serif">系统衬线</option>
            <option value="monospace">等宽字体</option>
            <option value="Impact, sans-serif">Impact (粗英)</option>
          </select>
          <div class="fg-row" style="margin-top:6px;">
            <label class="fg-upload-btn">📄 上传自定义字体<input type="file" id="fontInput" accept=".ttf,.otf" hidden></label>
            <span id="fontName" class="fg-file-name"></span>
          </div>

          <div class="fg-row" style="margin-top: 10px;">
            <div class="fg-col">
              <label class="fg-label">背景色</label>
              <input id="bgColor" type="color" value="#8a5a2b" class="fg-color" style="width:100%;">
            </div>
            <div class="fg-col">
              <label class="fg-label">文字色</label>
              <input id="fgColor" type="color" value="#fdf8ec" class="fg-color" style="width:100%;">
            </div>
          </div>

          <label class="fg-label" style="margin-top: 10px;">文字特效</label>
          <select id="textEffect" class="fg-input">
            <option value="none">无特效</option>
            <option value="shadow">柔和投影</option>
            <option value="stroke">内描边</option>
            <option value="both">描边+投影</option>
          </select>

          <label class="fg-label" style="margin-top: 10px;">字重</label>
          <select id="fontWeight" class="fg-input">
            <option value="normal">正常</option>
            <option value="bold" selected>粗体</option>
            <option value="900">极粗 (900)</option>
          </select>

          <label class="fg-label" style="margin-top: 10px;">背景圆角 (<span id="radiusVal">20</span>%)</label>
          <input type="range" id="radius" min="0" max="50" value="20" class="fg-range">
        </div>
      </div>

      <!-- 全局操作 -->
      <div class="fg-actions">
        <button id="downloadZip" class="fg-btn primary" disabled>📦 打包下载全部 (ZIP)</button>
        <button id="downloadSizes" class="fg-btn secondary" disabled>📥 逐个下载 PNG</button>
        <span id="status" class="fg-status"></span>
      </div>
    </aside>

    <!-- 右侧预览区 -->
    <div class="fg-main">
      <div class="fg-preview-header">
        <h2>👁️ 实时预览 </h2>
        <span class="fg-hint">点击下方图标可直接下载对应尺寸 PNG</span>
      </div>
      
      <div class="fg-preview-grid" id="previewGrid">
        <!-- 预览区生成 -->
        <div class="fg-empty-hint" id="emptyHint">请上传图片或输入文字</div>
      </div>

      <!-- 生成的 HTML 代码 -->
      <div id="codeSection" class="fg-code" hidden>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h3>HTML 引用代码</h3>
          <button id="copyCode" class="fg-btn-small">📋 复制</button>
        </div>
        <pre id="htmlCode"></pre>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<!-- 引入库 -->
<script src="../../js/libs/pica.min.js"></script>
<script src="../../js/libs/FileSaver.min.js"></script>
<script src="../../js/libs/jszip.min.js"></script>
<script src="../../js/favicon-generator.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
