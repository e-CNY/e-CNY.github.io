<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英汉词典查看器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/dictionary.css">
</head>
<body>
<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="dict-app">

<div class="dict-main">

    <!-- ============ 搜索区 ============ -->
    <section class="search-panel">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="输入英文单词…（本地词库，无需联网）"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="search-btns">
          <button id="btnClear" class="icon-btn" type="button" title="清空" aria-label="清空" hidden>✕</button>
        </div>
        <!-- 联想下拉 -->
        <div id="suggest" class="suggest" hidden></div>
      </div>

      <div class="search-meta">
        <div class="modes" id="modes" role="group" aria-label="搜索模式">
          <button type="button" class="mode active" data-mode="prefix">前缀</button>
          <button type="button" class="mode" data-mode="contains">包含</button>
          <button type="button" class="mode" data-mode="exact">精确</button>
        </div>
        <div class="quick-actions">
          <button id="btnRandom" class="mini-btn" type="button">🎲 随机词</button>
        </div>
      </div>

      <div class="alpha" id="alpha" aria-label="按字母浏览"></div>
      <div class="status" id="status">正在加载词库…</div>
    </section>

    <!-- ============ 详情区 ============ -->
    <section class="content-panel">
      <article id="entry" class="entry" hidden></article>

      <div id="placeholder" class="placeholder">
        <div class="ph-emoji">📚</div>
        <p>输入英文单词开始查询</p>
        <p class="ph-tip">快捷键 <kbd>/</kbd> 聚焦搜索框 · <kbd>Esc</kbd> 清空</p>
      </div>
    </section>

    <!-- ============ 侧栏：生词本 / 历史 ============ -->
    <aside class="side-panel">
      <div class="side-tabs" id="sideTabs">
        <button type="button" class="side-tab active" data-tab="fav">⭐ 生词本 <em id="favCount">0</em></button>
        <button type="button" class="side-tab" data-tab="hist">🕘 历史 <em id="histCount">0</em></button>
      </div>
      <div class="side-body" id="sideBody"></div>
      <div class="side-foot">
        <button id="btnImportFav" class="mini-btn" type="button">📥 导入</button>
        <button id="btnExportFav" class="mini-btn" type="button">📤 导出</button>
        <button id="btnClearFav" class="mini-btn danger" type="button">🗑️ 清空</button>
        <input type="file" id="fileInput" accept=".txt,.md" hidden>
      </div>
    </aside>

  </div>

  <div id="toast" class="toast" hidden></div>
</main>

<script src="../../js/dictionary.js"></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
