<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英汉词典 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/dictionary.css">
</head>
<body>
<main class="dict-app">

  <header class="tool-page-header">
    <h1>📖 英汉词典</h1>
    <p>离线词库 · 前缀/模糊/精确搜索 · 生词本</p>
    <a href="../../index.html">← 返回首页</a>
  </header>

  <div class="dict-main">

    <!-- ============ 搜索区 ============ -->
    <section class="search-panel">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="输入英文单词…（本地词库，无需联网）"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="search-btns">
          <button id="btnClear" class="icon-btn" type="button" title="清空" aria-label="清空" hidden>✕</button>
        </div>
        <!-- 联想下拉 -->
        <div id="suggest" class="suggest" hidden></div>
      </div>

      <div class="search-meta">
        <div class="modes" id="modes" role="group" aria-label="搜索模式">
          <button type="button" class="mode active" data-mode="prefix">前缀</button>
          <button type="button" class="mode" data-mode="contains">包含</button>
          <button type="button" class="mode" data-mode="exact">精确</button>
        </div>
        <div class="quick-actions">
          <button id="btnRandom" class="mini-btn" type="button">🎲 随机词</button>
          <button id="btnDaily" class="mini-btn" type="button">📅 每日一词</button>
        </div>
      </div>

      <div class="alpha" id="alpha" aria-label="按字母浏览"></div>
      <div class="status" id="status">正在加载词库…</div>
    </section>

    <!-- ============ 详情区 ============ -->
    <section class="content-panel">
      <article id="entry" class="entry" hidden></article>

      <div id="placeholder" class="placeholder">
        <div class="ph-emoji">📚</div>
        <p>输入英文单词开始查询</p>
        <p class="ph-tip">快捷键 <kbd>/</kbd> 聚焦搜索框 · <kbd>Esc</kbd> 清空</p>
      </div>
    </section>

    <!-- ============ 侧栏：生词本 / 历史 ============ -->
    <aside class="side-panel">
      <div class="side-tabs" id="sideTabs">
        <button type="button" class="side-tab active" data-tab="fav">⭐ 生词本 <em id="favCount">0</em></button>
        <button type="button" class="side-tab" data-tab="hist">🕘 历史 <em id="histCount">0</em></button>
      </div>
      <div class="side-body" id="sideBody"></div>
      <div class="side-foot">
        <button id="btnExportFav" class="mini-btn" type="button">导出 TXT</button>
        <button id="btnClearFav" class="mini-btn danger" type="button">清空当前</button>
      </div>
    </aside>

  </div>

  <div id="toast" class="toast" hidden></div>
</main>

<script src="../../js/dictionary.js"></script>
</body>
</html>
