<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lottie 动画预览 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/lottie-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎞️ Lottie 动画预览</h1>
  <p>上传 Lottie JSON 文件，实时预览动画并查看基础信息。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="lt-layout" style="padding-top: 0;">
  <div class="lt-container">
    <aside class="lt-sidebar">
      <div id="lt-drop-zone" class="lt-drop-zone">
        <span>📁 上传 .json 文件</span>
        <span class="lt-hint">Lottie / Bodymovin 导出的 JSON</span>
        <input id="lt-input" type="file" accept=".json" hidden>
      </div>

      <div class="lt-info" id="lt-info" style="display: none;">
        <h3>动画信息</h3>
        <p>尺寸: <b id="lt-w">0</b> x <b id="lt-h">0</b></p>
        <p>帧率: <b id="lt-fr">0</b> fps</p>
        <p>时长: <b id="lt-duration">0</b> s</p>
      </div>
    </aside>

    <div class="lt-main">
      <div id="lt-preview" class="lt-preview">
        <span class="lt-placeholder">等待上传动画...</span>
      </div>
    </div>
  </div>
</main>
<script src="../../js/libs/lottie.min.js"></script>
<script src="../../js/lottie-tool.js" defer></script>
</body>
</html>
