<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音频工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/audio-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎵 音频工具</h1>
  <p>波形预览、音量调节、裁剪并导出为 WAV 格式。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="au-layout" style="padding-top: 0;">
  <div class="au-card">
    <div id="au-drop-zone" class="au-drop-zone">
      <span>📁 点击或拖拽音频文件</span>
      <span class="au-hint">支持 mp3 / wav / ogg / m4a</span>
      <input id="au-input" type="file" accept="audio/*" hidden>
    </div>

    <div id="au-workspace" style="display: none;">
      <div class="au-wave-wrap">
        <canvas id="au-canvas"></canvas>
      </div>
      
      <div class="au-controls">
        <div class="au-row">
          <label>音量</label>
          <input type="range" id="au-volume" min="0" max="1" step="0.01" value="1">
          <span id="au-vol-val">100%</span>
        </div>
        <div class="au-row">
          <button id="au-play" class="au-btn primary">▶️ 播放</button>
          <button id="au-pause" class="au-btn" disabled>⏸️ 暂停</button>
          <span id="au-time" style="font-family: monospace; margin-left: auto;">00:00 / 00:00</span>
        </div>
        
        <div class="au-crop-box">
          <h3>✂️ 裁剪导出 (WAV)</h3>
          <div class="au-row">
            <label>起点 (秒)</label>
            <input type="number" id="au-start" min="0" step="0.1" value="0">
            <label>终点 (秒)</label>
            <input type="number" id="au-end" min="0" step="0.1" value="0">
          </div>
          <button id="au-export" class="au-btn primary" style="width: 100%; margin-top: 12px;">导出选中片段为 WAV</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../js/audio-tool.js" defer></script>
</body>
</html>
