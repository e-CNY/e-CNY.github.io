<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音频编辑处理器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/audio-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="au-layout">
  <div class="au-card">
    <!-- 上传区 -->
    <div id="au-drop-zone" class="au-drop-zone">
      <div style="font-size:3rem; margin-bottom:12px;">🎧</div>
      <span>点击、拖拽或粘贴音频文件</span>
      <span class="au-hint">支持 mp3 / wav / ogg / m4a / flac 等，纯本地解析</span>
      <input id="au-input" type="file" accept="audio/*" hidden>
    </div>

    <!-- 工作区 -->
    <div id="au-workspace" style="display: none;">
      <!-- 波形显示区 -->
      <div class="au-wave-wrap" id="wave-wrap">
        <canvas id="au-canvas"></canvas>
        <div class="au-playhead" id="au-playhead"></div>
      </div>
      
      <!-- 顶部信息与控制 -->
      <div class="au-header-bar">
        <div class="au-file-info">
          <span id="au-filename" style="font-weight:bold; color:#4b3f2f;">未命名音频</span>
          <span id="au-time" style="font-family:monospace; color:#8a5a2b;">00:00.0 / 00:00.0</span>
        </div>
        <div class="au-volume-wrap">
          <span>🔊</span>
          <input type="range" id="au-volume" min="0" max="1" step="0.01" value="1">
          <span id="au-vol-val" style="width:40px; text-align:right; font-family:monospace;">100%</span>
        </div>
      </div>

      <div class="au-controls">
        <!-- 播放控制 -->
        <div class="au-btn-row">
          <button id="au-play" class="au-btn primary" title="快捷键: 空格">
            <span style="font-size:1.2rem;">▶️</span> 播放
          </button>
          <button id="au-pause" class="au-btn" disabled>
            <span style="font-size:1.2rem;">⏸️</span> 暂停
          </button>
          <button id="au-reverse" class="au-btn" title="音频倒放">
            <span style="font-size:1.2rem;">⏪</span> 倒放
          </button>
          <button id="au-restore" class="au-btn" style="display:none;" title="恢复原始音频">
            <span style="font-size:1.2rem;">🔄</span> 恢复
          </button>
        </div>
        
        <!-- 裁剪与导出 -->
        <div class="au-crop-box">
          <div class="au-crop-header">
            <h3>✂️ 选区裁剪与导出</h3>
            <button class="au-mini-btn" id="btn-reset-trim">🔄 重置选区</button>
          </div>
          
          <div class="au-trim-inputs">
            <div class="au-input-group">
              <label>起点 (秒)</label>
              <input type="number" id="au-start" min="0" step="0.1" value="0">
            </div>
            <div class="au-input-group">
              <label>终点 (秒)</label>
              <input type="number" id="au-end" min="0" step="0.1" value="0">
            </div>
            <div class="au-input-group">
              <label>声道</label>
              <select id="au-channel" class="au-select">
                <option value="keep">保留原声道</option>
                <option value="mono">混合为单声道 (体积减半)</option>
              </select>
            </div>
          </div>
          
          <button id="au-export" class="au-btn primary" style="width: 100%; margin-top: 16px; padding: 12px; font-size: 1rem;">
            💾 导出选中片段为无损 WAV
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Loading 遮罩 -->
<div id="loading-overlay" class="au-loading-overlay" style="display: none;">
  <div class="spinner"></div>
  <div class="loading-text">正在处理音频，请稍候...</div>
</div>

<div id="toast" class="toast"></div>

<script src="../../js/audio-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
