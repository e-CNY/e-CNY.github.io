<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浏览器存储查看器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/storage-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🗄️ 浏览器存储查看器</h1>
  <p>查看、新增、删除当前域名下的 LocalStorage 与 SessionStorage。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="st-layout" style="padding-top: 0;">
  <div class="st-tabs">
    <button class="st-tab active" data-target="panel-local">LocalStorage</button>
    <button class="st-tab" data-target="panel-session">SessionStorage</button>
  </div>

  <div class="st-content">
    <div class="st-toolbar">
      <button id="btn-refresh" class="st-btn">🔄 刷新列表</button>
      <button id="btn-add" class="st-btn primary">➕ 新增键值对</button>
      <button id="btn-clear" class="st-btn danger">🗑️ 清空当前存储</button>
    </div>
    
    <div class="st-table-wrap">
      <table class="st-table">
        <thead>
          <tr>
            <th style="width: 30%;">键名 (Key)</th>
            <th style="width: 50%;">值 (Value)</th>
            <th style="width: 20%; text-align: center;">操作</th>
          </tr>
        </thead>
        <tbody id="st-tbody">
          <!-- JS 渲染 -->
        </tbody>
      </table>
      <div id="st-empty" class="st-empty" style="display: none;">当前存储为空</div>
    </div>
  </div>
</main>
<script src="../../js/storage-tool.js" defer></script>
</body>
</html>
