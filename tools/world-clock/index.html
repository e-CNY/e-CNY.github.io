<!-- tools/world-clock/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多城市时区转换 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/world-clock.css">
</head>
<body>
<main class="wc-page">
  <header class="tool-page-header theme-header">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions"><button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题"></button></div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->

    <h1>🌍 多城市时区转换</h1>
    <p>多城市实时时钟 / 时区转换 / 会议规划 / 夏令时自动处理 / 拖拽排序 / ICS 导出</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="wc-app">
    <!-- 顶部工具栏 -->
    <div class="app-toolbar">
      <button class="tool-btn" id="hour12Toggle" type="button" title="切换 12/24 小时制">🕐 24h</button>
      <button class="tool-btn" id="secondsToggle" type="button" title="显示秒">⏱ 显示秒</button>
      <button class="tool-btn" id="compactToggle" type="button" title="紧凑模式">📐 舒适</button>
      <button class="tool-btn" id="copyAllBtn" type="button" title="复制所有城市时间">📋 复制全部</button>
      <button class="tool-btn" id="historyBtn" type="button" title="历史记录">📜 历史 <span id="historyCount">(0)</span></button>
      <button class="tool-btn" id="shareBtn" type="button" title="分享当前状态">🔗 分享</button>
    </div>

    <!-- 模式切换 -->
    <div class="mode-bar">
      <div class="seg" id="modeSeg">
        <button data-value="clock" class="active" type="button">🕐 世界时钟</button>
        <button data-value="convert" type="button">🔄 时区转换</button>
        <button data-value="planner" type="button">📅 会议规划器</button>
      </div>
    </div>

    <!-- ========== 世界时钟模式 ========== -->
    <section class="mode-panel" id="clockPanel">
      <div class="clock-grid" id="clockGrid"></div>
      <div class="add-city-bar">
        <button class="add-city-btn" id="addCityBtn" type="button">＋ 添加城市</button>
      </div>
      <p class="clock-tip">💡 拖拽城市卡片可调整顺序；点击时间即可复制；时间每秒自动刷新，夏令时由浏览器 IANA tzdata 自动处理。</p>
    </section>

    <!-- ========== 时区转换模式 ========== -->
    <section class="mode-panel" id="convertPanel" hidden>
      <div class="convert-form">
        <div class="convert-row">
          <div class="field">
            <label>源城市</label>
            <select id="fromCity"></select>
          </div>
          <div class="field">
            <label>目标城市</label>
            <select id="toCity"></select>
          </div>
        </div>
        <div class="convert-row">
          <div class="field">
            <label>日期</label>
            <input type="date" id="convertDate">
          </div>
          <div class="field">
            <label>时间</label>
            <input type="time" id="convertTime" step="60">
          </div>
        </div>
        <div class="quick-time-bar">
          <span class="quick-label">快捷：</span>
          <button class="quick-btn" data-qtime="now" type="button">现在</button>
          <button class="quick-btn" data-qtime="+1h" type="button">+1 小时</button>
          <button class="quick-btn" data-qtime="+4h" type="button">+4 小时</button>
          <button class="quick-btn" data-qtime="tomorrow" type="button">明天</button>
          <button class="quick-btn" data-qtime="next-week" type="button">下周</button>
        </div>
        <div class="convert-actions">
          <button class="primary-btn" id="convertBtn" type="button">🔄 转换</button>
          <button class="ghost-btn" id="convertNowBtn" type="button">⏱️ 使用当前时间</button>
        </div>
      </div>
      <div class="convert-result" id="convertResult" hidden></div>
      <div class="convert-result-actions" id="convertResultActions" hidden>
        <button class="ghost-btn sm" id="convertCopyBtn" type="button">📋 复制结果</button>
        <button class="ghost-btn sm" id="convertSaveBtn" type="button">💾 存历史</button>
      </div>
    </section>

    <!-- ========== 会议规划器模式 ========== -->
    <section class="mode-panel" id="plannerPanel" hidden>
      <div class="planner-setup">
        <div class="planner-cities" id="plannerCities"></div>
        <button class="add-city-btn" id="plannerAddBtn" type="button">＋ 添加参会城市</button>
        <div class="planner-controls">
          <div class="field">
            <label>工作时段（本地时间）</label>
            <div class="work-hours">
              <input type="time" id="workStart" value="09:00" step="60">
              <span>—</span>
              <input type="time" id="workEnd" value="17:00" step="60">
            </div>
          </div>
          <div class="field">
            <label>会议日期</label>
            <input type="date" id="plannerDate">
          </div>
          <div class="field">
            <label>会议时长</label>
            <div class="seg sm" id="durationSeg">
              <button data-value="30" type="button">30 分</button>
              <button data-value="60" class="active" type="button">1 小时</button>
              <button data-value="90" type="button">1.5 小时</button>
            </div>
          </div>
        </div>
        <div class="planner-controls one-col">
          <div class="field">
            <label>时间粒度</label>
            <div class="seg sm" id="granularitySeg">
              <button data-value="15" type="button">15 分</button>
              <button data-value="30" class="active" type="button">30 分</button>
              <button data-value="60" type="button">60 分</button>
            </div>
          </div>
        </div>
        <button class="primary-btn" id="plannerCalcBtn" type="button">📊 查找最佳时间</button>
      </div>
      <div class="planner-result" id="plannerResult" hidden>
        <div class="planner-chart-wrap">
          <canvas id="plannerChart"></canvas>
        </div>
        <div class="planner-overlaps" id="plannerOverlaps"></div>
        <div class="planner-result-actions">
          <button class="ghost-btn sm" id="plannerExportICS" type="button">📅 导出 ICS</button>
          <button class="ghost-btn sm" id="plannerCopyBtn" type="button">📋 复制最佳时段</button>
          <button class="ghost-btn sm" id="plannerSaveBtn" type="button">💾 存历史</button>
        </div>
        <p class="planner-tip">💡 绿色 = 所有人都在工作时段；黄色 = 部分人非工作时段；灰色 = 深夜时段。点击卡片可复制该时段。</p>
      </div>
    </section>

    <!-- 城市选择弹窗 -->
    <div class="modal-mask" id="cityModal" hidden>
      <div class="modal-body">
        <button class="modal-close" id="cityModalClose" type="button" aria-label="关闭">×</button>
        <h3 class="modal-title">🌆 选择城市</h3>
        <div class="city-search-wrap">
          <input type="search" id="citySearch" placeholder="搜索城市名 / 国家 / 时区…" autocomplete="off">
        </div>
        <div class="city-list" id="cityList"></div>
      </div>
    </div>
  </div>

  <!-- 历史抽屉 -->
  <div class="history-backdrop" id="historyBackdrop" hidden></div>
  <aside class="history-drawer" id="historyDrawer">
    <div class="history-head">
      <h3>📜 历史记录</h3>
      <button class="tool-btn" id="historyClose" type="button">✕</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="history-actions">
      <button class="tool-btn danger" id="historyClear" type="button">🗑 清空历史</button>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</main>
<script src="../../js/world-clock.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
