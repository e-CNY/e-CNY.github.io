<!-- tools/world-clock/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界时钟 · 时区转换 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/world-clock.css">
</head>
<body>
<main class="wc-page">
  <header class="tool-page-header">
    <h1>🌍 世界时钟 · 时区转换</h1>
    <p>多城市实时时钟 / 日期时间转换 / 会议规划器 / 夏令时自动处理</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="wc-app">
    <!-- 模式切换 -->
    <div class="mode-bar">
      <div class="seg" id="modeSeg">
        <button data-value="clock" class="active" type="button">🕐 世界时钟</button>
        <button data-value="convert" type="button">🔄 时区转换</button>
        <button data-value="planner" type="button">📅 会议规划器</button>
      </div>
    </div>

    <!-- ========== 世界时钟模式 ========== -->
    <section class="mode-panel" id="clockPanel">
      <div class="clock-grid" id="clockGrid"></div>
      <div class="add-city-bar">
        <button class="add-city-btn" id="addCityBtn" type="button">＋ 添加城市</button>
      </div>
      <p class="clock-tip">💡 点击城市卡片右上角 × 移除；时间每秒自动刷新，夏令时由浏览器 IANA tzdata 自动处理。</p>
    </section>

    <!-- ========== 时区转换模式 ========== -->
    <section class="mode-panel" id="convertPanel" hidden>
      <div class="convert-form">
        <div class="convert-row">
          <div class="field">
            <label>源城市</label>
            <select id="fromCity"></select>
          </div>
          <div class="field">
            <label>目标城市</label>
            <select id="toCity"></select>
          </div>
        </div>
        <div class="convert-row">
          <div class="field">
            <label>日期</label>
            <input type="date" id="convertDate">
          </div>
          <div class="field">
            <label>时间</label>
            <input type="time" id="convertTime" step="60">
          </div>
        </div>
        <div class="convert-actions">
          <button class="primary-btn" id="convertBtn" type="button">🔄 转换</button>
          <button class="ghost-btn" id="convertNowBtn" type="button">⏱️ 使用当前时间</button>
        </div>
      </div>
      <div class="convert-result" id="convertResult" hidden></div>
    </section>

    <!-- ========== 会议规划器模式 ========== -->
    <section class="mode-panel" id="plannerPanel" hidden>
      <div class="planner-setup">
        <div class="planner-cities" id="plannerCities"></div>
        <button class="add-city-btn" id="plannerAddBtn" type="button">＋ 添加参会城市</button>
        <div class="planner-controls">
          <div class="field">
            <label>工作时段（本地时间）</label>
            <div class="work-hours">
              <input type="time" id="workStart" value="09:00" step="60">
              <span>—</span>
              <input type="time" id="workEnd" value="17:00" step="60">
            </div>
          </div>
          <div class="field">
            <label>会议日期</label>
            <input type="date" id="plannerDate">
          </div>
          <div class="field">
            <label>会议时长</label>
            <div class="seg sm" id="durationSeg">
              <button data-value="30" type="button">30 分</button>
              <button data-value="60" class="active" type="button">1 小时</button>
              <button data-value="90" type="button">1.5 小时</button>
            </div>
          </div>
        </div>
        <button class="primary-btn" id="plannerCalcBtn" type="button">📊 查找最佳时间</button>
      </div>
      <div class="planner-result" id="plannerResult" hidden>
        <div class="planner-chart-wrap">
          <canvas id="plannerChart"></canvas>
        </div>
        <div class="planner-overlaps" id="plannerOverlaps"></div>
        <p class="planner-tip">💡 绿色 = 所有人都在工作时段；黄色 = 部分人非工作时段；灰色 = 所有人非工作时段。点击绿色区块可选中该时段。</p>
      </div>
    </section>

    <!-- 城市选择弹窗 -->
    <div class="modal-mask" id="cityModal" hidden>
      <div class="modal-body">
        <button class="modal-close" id="cityModalClose" type="button" aria-label="关闭">×</button>
        <h3 class="modal-title">🌆 选择城市</h3>
        <div class="city-search-wrap">
          <input type="search" id="citySearch" placeholder="搜索城市名 / 国家 / 时区…" autocomplete="off">
        </div>
        <div class="city-list" id="cityList"></div>
      </div>
    </div>
  </div>
</main>
<script src="../../js/world-clock.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
