<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>办公文档自动化 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/doc-automation.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📄 办公文档自动化</h1>
  <p>Word 转 HTML、提取图片，纯本地处理。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="da-layout" style="padding-top: 0;">
  <div class="da-container">
    <aside class="da-sidebar">
      <div class="da-section">
        <h3>1. 上传 Word 文档</h3>
        <div id="da-drop-zone" class="da-drop-zone">
          <span>📁 点击或拖拽 .docx 文件</span>
        </div>
        <input id="da-input" type="file" accept=".docx" hidden>
      </div>
      <div class="da-section" id="da-actions" style="display:none;">
        <h3>2. 操作</h3>
        <button id="btn-copy-html" class="da-btn primary">📋 复制 HTML 代码</button>
        <button id="btn-copy-rich" class="da-btn">📋 复制为富文本(Word用)</button>
      </div>
    </aside>

    <div class="da-main">
      <div class="da-toolbar">
        <span id="da-status">等待上传文件...</span>
        <button id="btn-download-html" class="da-btn" style="display:none;">⬇️ 下载 HTML</button>
      </div>
      <div class="da-preview-wrap">
        <div id="da-preview" class="da-preview markdown-body">
          <p style="color:#8a7a5f; text-align:center; margin-top:50px;">预览区域</p>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../js/libs/mammoth.browser.min.js"></script>
<script src="../../js/doc-automation.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
