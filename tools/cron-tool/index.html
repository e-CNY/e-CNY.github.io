<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cron 表达式工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/cron-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>⏰ Cron 表达式解析</h1>
  <p>解析 Cron 表达式含义，实时预测未来 10 次执行时间。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="cr-layout" style="padding-top: 0;">
  <div class="cr-card">
    <div class="cr-input-group">
      <input type="text" id="cr-input" class="cr-input" value="* * * * *" placeholder="输入 Cron 表达式，如 */5 * * * *">
      <button id="btn-cron" class="cr-btn primary">解析</button>
    </div>
    
    <div class="cr-examples">
      <span>常用示例：</span>
      <button class="cr-tag" data-cron="* * * * *">每分钟</button>
      <button class="cr-tag" data-cron="0 * * * *">每小时</button>
      <button class="cr-tag" data-cron="0 0 * * *">每天零点</button>
      <button class="cr-tag" data-cron="0 9 * * 1-5">工作日早上9点</button>
    </div>

    <div class="cr-result">
      <h3>表达式含义</h3>
      <div id="cr-desc" class="cr-desc-box">等待解析...</div>
      
      <h3>接下来 10 次运行时间</h3>
      <ul id="cr-list" class="cr-time-list">
        <!-- JS 生成 -->
      </ul>
    </div>
  </div>
</main>
<script src="../../js/libs/croner.min.js"></script>
<script src="../../js/cron-tool.js" defer></script>
</body>
</html>
