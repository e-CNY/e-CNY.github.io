<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS & OPML 工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/rss-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📡 RSS & OPML 工具</h1>
  <p>RSS / Atom 转 JSON 预览、OPML 订阅源提取。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="rs-layout" style="padding-top: 0;">
  <div class="rs-tabs">
    <button class="rs-tab active" data-target="panel-rss">RSS 转 JSON</button>
    <button class="rs-tab" data-target="panel-opml">OPML 提取</button>
  </div>

  <div class="rs-content">
    <!-- RSS -->
    <div id="panel-rss" class="rs-panel active">
      <textarea id="rss-input" class="rs-textarea" rows="6" placeholder="粘贴 RSS / Atom XML 源码..."></textarea>
      <button id="btn-rss" class="rs-btn primary">解析 RSS</button>
      <div id="rss-result" class="rs-result-box"></div>
    </div>

    <!-- OPML -->
    <div id="panel-opml" class="rs-panel">
      <textarea id="opml-input" class="rs-textarea" rows="6" placeholder="粘贴 OPML XML 源码..."></textarea>
      <button id="btn-opml" class="rs-btn primary">提取订阅源</button>
      <div id="opml-result" class="rs-result-box" style="white-space: pre-wrap; font-family: monospace;"></div>
    </div>
  </div>
</main>
<script src="../../js/rss-tool.js" defer></script>
</body>
</html>
