<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS&OPML工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/rss-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="rs-layout">
  <div class="rs-tabs">
    <button class="rs-tab active" data-target="panel-rss">📰 RSS / Atom 解析</button>
    <button class="rs-tab" data-target="panel-opml">📁 OPML 订阅源提取</button>
  </div>

  <div class="rs-content">
    
    <!-- ================= 1. RSS / Atom ================= -->
    <div id="panel-rss" class="rs-panel active">
      <div class="rs-split">
        <!-- 左侧输入 -->
        <div class="rs-col">
          <div class="rs-header">
            <span>📄 XML 源码</span>
            <div style="display:flex; gap:6px;">
              <button class="rs-mini-btn" onclick="loadRssSample()">📥 填入示例</button>
              <button class="rs-mini-btn" onclick="clearInput('rss-input')">🗑️ 清空</button>
            </div>
          </div>
          <textarea id="rss-input" class="rs-textarea" spellcheck="false" placeholder="在此粘贴 RSS / Atom XML 源码..."></textarea>
          <div class="rs-action-bar">
            <button id="btn-rss" class="rs-btn primary">🚀 解析 RSS</button>
          </div>
        </div>
        
        <!-- 右侧结果 -->
        <div class="rs-col">
          <div class="rs-header">
            <div class="rs-view-toggle">
              <button class="rs-toggle-btn active" data-view="card">卡片视图</button>
              <button class="rs-toggle-btn" data-view="json">JSON 源码</button>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="rs-mini-btn" onclick="copyText('rss-result-json')">📋 复制</button>
              <button class="rs-mini-btn" onclick="downloadResult('rss')">💾 下载</button>
            </div>
          </div>
          <!-- 卡片视图 -->
          <div id="rss-result-card" class="rs-result-box active">
            <div class="rs-empty">等待解析...</div>
          </div>
          <!-- JSON 视图 -->
          <textarea id="rss-result-json" class="rs-textarea" style="display:none; border-radius: 0; border: none; flex:1;" readonly placeholder="JSON 结果..."></textarea>
        </div>
      </div>
    </div>

    <!-- ================= 2. OPML ================= -->
    <div id="panel-opml" class="rs-panel">
      <div class="rs-split">
        <!-- 左侧输入 -->
        <div class="rs-col">
          <div class="rs-header">
            <span>📄 OPML 源码</span>
            <div style="display:flex; gap:6px;">
              <button class="rs-mini-btn" onclick="loadOpmlSample()">📥 填入示例</button>
              <button class="rs-mini-btn" onclick="clearInput('opml-input')">🗑️ 清空</button>
            </div>
          </div>
          <textarea id="opml-input" class="rs-textarea" spellcheck="false" placeholder="在此粘贴 OPML XML 源码..."></textarea>
          <div class="rs-action-bar">
            <button id="btn-opml" class="rs-btn primary">🚀 提取订阅源</button>
          </div>
        </div>
        
        <!-- 右侧结果 -->
        <div class="rs-col">
          <div class="rs-header">
            <span>🌳 提取结果 <b id="opml-count" style="color:#8a5a2b; font-size:0.85rem;"></b></span>
            <div style="display:flex; gap:6px;">
              <button class="rs-mini-btn" onclick="copyText('opml-result')">📋 复制</button>
              <button class="rs-mini-btn" onclick="downloadResult('opml')">💾 下载 JSON</button>
            </div>
          </div>
          <textarea id="opml-result" class="rs-textarea" style="border-radius: 0; border: none; flex:1;" readonly placeholder="提取结果将显示在这里..."></textarea>
        </div>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="toast"></div>
<script src="../../js/rss-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
