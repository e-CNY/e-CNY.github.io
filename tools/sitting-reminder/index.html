<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间与计时工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/sitting-reminder.css">
</head>
<body>
<main class="tt-layout">
  <header class="tt-header">
    <h1>⏱️ 时间与计时工具</h1>
    <p>久坐提醒 / 秒表 / 倒计时 / 番茄钟，全本地运行。</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="tt-tabs">
    <button class="tt-tab active" data-target="panel-sit">🪑 久坐提醒</button>
    <button class="tt-tab" data-target="panel-stopwatch">⏱️ 秒表</button>
    <button class="tt-tab" data-target="panel-countdown">⏳ 倒计时</button>
    <button class="tt-tab" data-target="panel-pomodoro">🍅 番茄钟</button>
  </div>

  <div class="tt-content">
    <!-- 面板 1：久坐循环 -->
    <div id="panel-sit" class="tt-panel active">
      <div class="sr-tool" style="width:100%;">
        <p style="text-align:center;color:#6b5d47;font-size:.9rem;margin-bottom:20px;">坐下 → 活动 → 站立 循环提醒，设为 0 的阶段自动跳过。</p>
        <section class="sr-rings">
          <article class="sr-card" style="--phase-color:#6a8db8" data-phase="sit">
            <div class="sr-ring-wrap">
              <svg class="sr-ring" viewBox="0 0 100 100"><circle class="sr-ring-track" cx="50" cy="50" r="45"/><circle class="sr-ring-progress" cx="50" cy="50" r="45"/></svg>
              <div class="sr-ring-text"><span class="sr-emoji">🪑</span><span class="sr-time">--:--</span></div>
            </div>
            <label class="sr-label"><span>坐下</span><input type="number" min="0" max="999" value="40" data-phase="sit"><span>分</span></label>
          </article>
          <article class="sr-card" style="--phase-color:#7ba05b" data-phase="move">
            <div class="sr-ring-wrap">
              <svg class="sr-ring" viewBox="0 0 100 100"><circle class="sr-ring-track" cx="50" cy="50" r="45"/><circle class="sr-ring-progress" cx="50" cy="50" r="45"/></svg>
              <div class="sr-ring-text"><span class="sr-emoji">🚶</span><span class="sr-time">--:--</span></div>
            </div>
            <label class="sr-label"><span>活动</span><input type="number" min="0" max="999" value="3" data-phase="move"><span>分</span></label>
          </article>
          <article class="sr-card" style="--phase-color:#c99a4b" data-phase="stand">
            <div class="sr-ring-wrap">
              <svg class="sr-ring" viewBox="0 0 100 100"><circle class="sr-ring-track" cx="50" cy="50" r="45"/><circle class="sr-ring-progress" cx="50" cy="50" r="45"/></svg>
              <div class="sr-ring-text"><span class="sr-emoji">🧍</span><span class="sr-time">--:--</span></div>
            </div>
            <label class="sr-label"><span>站立</span><input type="number" min="0" max="999" value="20" data-phase="stand"><span>分</span></label>
          </article>
        </section>
        <div class="sr-controls">
          <button id="btn-start" class="primary">开始</button>
          <button id="btn-pause" disabled>暂停</button>
          <button id="btn-stop" disabled>停止</button>
        </div>
        <p id="sr-status" class="sr-status"></p>
      </div>
    </div>

    <!-- 面板 2：秒表 -->
    <div id="panel-stopwatch" class="tt-panel">
      <div class="timer-display" id="sw-display">00:00.00</div>
      <div class="timer-controls">
        <button id="sw-start" class="btn-primary">开始</button>
        <button id="sw-lap" disabled>计次</button>
        <button id="sw-reset" disabled>重置</button>
      </div>
      <ul id="sw-laps" class="laps-list"></ul>
    </div>

    <!-- 面板 3：倒计时 -->
    <div id="panel-countdown" class="tt-panel">
      <div class="timer-display" id="cd-display">00:00</div>
      <div class="timer-inputs">
        <input type="number" id="cd-min" placeholder="分" min="0" style="width:60px"> : 
        <input type="number" id="cd-sec" placeholder="秒" min="0" max="59" style="width:60px">
      </div>
      <div class="timer-controls">
        <button id="cd-start" class="btn-primary">开始</button>
        <button id="cd-pause" disabled>暂停</button>
        <button id="cd-reset">重置</button>
      </div>
    </div>

    <!-- 面板 4：番茄钟 -->
    <div id="panel-pomodoro" class="tt-panel">
      <div class="timer-display" id="pm-display">25:00</div>
      <p class="timer-status" id="pm-status">专注时间</p>
      <div class="timer-controls">
        <button id="pm-start" class="btn-primary">开始专注</button>
        <button id="pm-reset">重置</button>
      </div>
    </div>
  </div>
</main>
<script src="../../js/sitting-reminder.js" defer></script>
</body>
</html>
