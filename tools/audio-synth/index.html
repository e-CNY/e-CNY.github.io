<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高级音频合成器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/audio-synth.css">
</head>
<body>
<header class="tool-page-header theme-header" style="padding: 12px 16px 8px;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions"><button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题"></button></div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->

  <h1>🎹 高级音频合成器</h1>
  <p>多八度全键盘，11 种乐器音色，混响/延迟，支持 WAV 录制。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="as-layout">
  <!-- 顶部控制面板 -->
  <div class="as-controls">
    <div class="as-row">
      <div class="as-group">
        <label>选择乐器</label>
        <select id="as-instrument" class="as-select">
          <option value="piano">🎹 原声钢琴 (Acoustic Piano)</option>
          <option value="epiano">🎹 电钢琴 (Electric Piano)</option>
          <option value="guitar">🎸 木吉他 (Acoustic Guitar)</option>
          <option value="strings">🎻 弦乐 / 铺底 (Strings)</option>
          <option value="lead">🎛️ 电子主音 (Synth Lead)</option>
          <option value="pad">🌌 电子氛围 (Synth Pad)</option>
          <option value="bass">🎸 贝斯 (Bass)</option>
          <option value="organ">⛪ 管风琴 (Organ)</option>
          <option value="musicbox">🎵 八音盒 (Music Box)</option>
          <option value="ukulele">🪕 乌克丽丽 (Ukulele)</option>
          <option value="marimba">🎵 马林巴 (Marimba)</option>
          <option value="custom">🔊 自定义波形</option>
        </select>
        <select id="as-waveform" class="as-select" style="display: none; width: 100px;">
          <option value="sine">正弦波</option>
          <option value="square">方波</option>
          <option value="triangle">三角波</option>
          <option value="sawtooth">锯齿波</option>
        </select>
      </div>

      <div class="as-group">
        <label>主音量</label>
        <input type="range" id="as-master-vol" min="0" max="1" step="0.01" value="0.8">
      </div>

      <div class="as-group">
        <label>效果器</label>
        <label class="as-checkbox"><input type="checkbox" id="as-reverb"> 混响</label>
        <label class="as-checkbox"><input type="checkbox" id="as-delay"> 延迟</label>
      </div>
    </div>
    
    <div class="as-row">
      <div class="as-group">
        <label>包络 (起音)</label>
        <input type="range" id="as-attack" min="0.01" max="1" step="0.01" value="0.05">
      </div>
      <div class="as-group">
        <label>包络 (衰减)</label>
        <input type="range" id="as-decay" min="0.1" max="2" step="0.1" value="0.5">
      </div>
      
      <div class="as-group" style="margin-left: auto;">
        <span id="record-timer" style="font-family:monospace; font-weight:bold; color:#c62828; display:none;">00:00</span>
        <button id="btn-record" class="as-btn primary">🔴 开始录音 (WAV)</button>
      </div>
    </div>

    <!-- 节拍器面板 -->
    <div class="as-row metronome-panel">
      <label>🥁 节拍器</label>
      <button id="btn-metronome" class="as-btn">▶️ 启动</button>
      
      <div class="metro-group">
        <span>BPM</span>
        <input type="number" id="metro-bpm" min="40" max="240" value="120" class="as-input-small">
      </div>

      <div class="metro-group">
        <span>音色</span>
        <select id="metro-sound" class="as-select" style="padding: 4px 8px; font-size: .8rem;">
          <option value="beep">电子滴答</option>
          <option value="wood">木头敲击</option>
          <option value="click">机械节拍</option>
        </select>
      </div>

      <div class="metro-group" style="flex:1;">
        <span>音量</span>
        <input type="range" id="metro-vol" min="0" max="1" step="0.05" value="0.5" style="max-width:100px;">
      </div>
      <span style="font-size:.75rem; color:#a8452a;">(不录入WAV)</span>
    </div>
  </div>

  <!-- 键盘操作区 -->
  <div class="as-keyboard-area">
    <div class="as-kb-toolbar">
      <div class="as-kb-info">
        <span>🎹 当前音域: <b id="display-octave">C3 - C6</b></span>
        <span style="color:#8a7a5f; font-size:0.8rem; margin-left:12px;">(电脑键盘：A-L 弹奏，Z/X 切换八度)</span>
      </div>
      <div class="as-kb-actions">
        <button class="as-mini-btn" id="btn-sustain">🦶 延音踏板 (Space)</button>
        <button class="as-mini-btn" id="btn-oct-down">⬇️ 降八度</button>
        <button class="as-mini-btn" id="btn-oct-up">⬆️ 升八度</button>
      </div>
    </div>
    
    <!-- 键盘容器 -->
    <div class="as-keyboard" id="as-keyboard"></div>
  </div>
</main>

<!-- 转码 Loading 遮罩 -->
<div id="loading-overlay" class="as-loading-overlay" style="display: none;">
  <div class="spinner"></div>
  <div class="loading-text">正在生成无损 WAV 文件...</div>
</div>

<div id="toast" class="toast"></div>

<script src="../../js/libs/Tone.js"></script>
<script src="../../js/audio-synth.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
