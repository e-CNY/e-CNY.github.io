<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高级音频合成器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/audio-synth.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎹 高级音频合成器</h1>
  <p>基于 Web Audio API 的纯前端合成器，支持多波形与多音轨。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="as-layout" style="padding-top: 0;">
  <div class="as-controls">
    <div class="as-row">
      <label>波形选择</label>
      <select id="as-waveform" class="as-select">
        <option value="sine">正弦波 (Sine)</option>
        <option value="square">方波 (Square)</option>
        <option value="triangle">三角波 (Triangle)</option>
        <option value="sawtooth">锯齿波 (Sawtooth)</option>
      </select>
    </div>
    <div class="as-row">
      <label>包络 (起音/衰减)</label>
      <input type="range" id="as-attack" min="0.01" max="1" step="0.01" value="0.05">
      <input type="range" id="as-decay" min="0.1" max="2" step="0.1" value="0.5">
    </div>
  </div>

  <div class="as-keyboard" id="as-keyboard">
    <!-- JS 生成琴键 -->
  </div>
</main>
<script src="../../js/libs/Tone.js"></script>
<script src="../../js/audio-synth.js" defer></script>
</body>
</html>
