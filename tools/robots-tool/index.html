<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robots规则解析 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/robots-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="rb-layout">
  <div class="rb-tabs">
    <button class="rb-tab active" data-target="panel-robots">🛡️ robots.txt 解析</button>
    <button class="rb-tab" data-target="panel-sitemap">🔗 Sitemap 提取</button>
  </div>

  <div class="rb-content">
    
    <!-- ================= 1. Robots 解析 ================= -->
    <div id="panel-robots" class="rb-panel active">
      <div class="rb-split">
        <!-- 左侧输入 -->
        <div class="rb-col">
          <div class="rb-header">
            <span>📄 robots.txt 源码</span>
            <button class="rb-mini-btn" onclick="loadRobotsSample()">📥 填入示例</button>
          </div>
          <textarea id="robots-input" class="rb-textarea" spellcheck="false" placeholder="在此粘贴 robots.txt 内容..."></textarea>
        </div>
        
        <!-- 右侧操作与结果 -->
        <div class="rb-col">
          <div class="rb-header">
            <span>🔍 解析与测试</span>
            <button class="rb-mini-btn" onclick="copyText('robots-result')">📋 复制结果</button>
          </div>
          
          <div class="rb-test-bar">
            <input type="text" id="robots-test-url" class="rb-input" placeholder="输入路径测试 (如 /admin 或 /public)">
            <button id="btn-robots" class="rb-btn primary" style="padding:8px 16px;">仅解析规则</button>
            <button id="btn-robots-test" class="rb-btn" style="padding:8px 16px; background:#2563eb; color:#fff; border-color:#2563eb;">🚀 测试权限</button>
          </div>
          
          <div id="robots-result" class="rb-result-box"></div>
        </div>
      </div>
    </div>

    <!-- ================= 2. Sitemap 提取 ================= -->
    <div id="panel-sitemap" class="rb-panel">
      <div class="rb-split">
        <!-- 左侧输入 -->
        <div class="rb-col">
          <div class="rb-header">
            <span>📄 sitemap.xml 源码</span>
            <button class="rb-mini-btn" onclick="loadSitemapSample()">📥 填入示例</button>
          </div>
          <textarea id="sitemap-input" class="rb-textarea" spellcheck="false" placeholder="在此粘贴 sitemap.xml 内容..."></textarea>
        </div>
        
        <!-- 右侧操作与结果 -->
        <div class="rb-col">
          <div class="rb-header">
            <span>🔗 提取结果 <b id="sitemap-count" style="color:#8a5a2b; font-size:0.85rem;"></b></span>
            <div style="display:flex; gap:6px;">
              <button class="rb-mini-btn" onclick="copyText('sitemap-result')">📋 复制</button>
              <button class="rb-mini-btn" onclick="downloadSitemapUrls()">💾 下载 TXT</button>
            </div>
          </div>
          
          <div class="rb-test-bar">
             <button id="btn-sitemap" class="rb-btn primary" style="width:100%; padding:8px;">🚀 开始提取全部 URL</button>
          </div>
          
          <div id="sitemap-result" class="rb-result-box" style="white-space: pre-wrap; font-family: monospace;"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="toast"></div>
<script src="../../js/robots-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
