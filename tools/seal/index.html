<!-- tools/seal/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电子印章生成器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/seal.css">
</head>
<body>
<main class="seal-page">
  <header class="tool-page-header">
    <h1>📮 电子印章生成器</h1>
    <p>环形文字 / 五角星 / 做旧效果 / 导出透明 PNG · 纯本地处理</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="seal-layout">
    <!-- 左侧控制面板 -->
    <aside class="panel">
      <div class="group">
        <label class="group-label">印章形状</label>
        <div class="seg" id="shapeSeg" role="group">
          <button data-value="circle" class="active" type="button">⬤ 圆形</button>
          <button data-value="square" type="button">■ 方形</button>
          <button data-value="ellipse" type="button">⬭ 椭圆</button>
        </div>
      </div>

      <div class="group">
        <label class="group-label">主文字 <span class="hint" id="textLen">0 / 20</span></label>
        <input id="mainText" type="text" value="华夏科技有限公司" maxlength="20" autocomplete="off">
      </div>

      <div class="group" id="layoutGroup">
        <label class="group-label">文字排版</label>
        <div class="seg" id="layoutSeg" role="group">
          <button data-value="arc" class="active" type="button">环形</button>
          <button data-value="horizontal" type="button">横排</button>
          <button data-value="vertical" type="button">竖排</button>
        </div>
      </div>

      <div class="group">
        <label class="group-label">字体</label>
        <select id="fontSelect">
          <option value="kai">楷体（经典公章）</option>
          <option value="song">宋体</option>
          <option value="hei">黑体</option>
          <option value="li">隶书</option>
          <option value="yuan">圆体</option>
        </select>
      </div>

      <div class="group">
        <label class="group-label">字号 <span class="hint" id="fontScaleVal">1.00×</span></label>
        <input id="fontScale" type="range" min="0.6" max="1.6" step="0.02" value="1">
      </div>

      <div class="group">
        <label class="group-label">印泥颜色</label>
        <div class="color-row">
          <button class="swatch" data-color="#c8202a" style="background:#c8202a" title="朱砂红"></button>
          <button class="swatch" data-color="#b02616" style="background:#b02616" title="深红"></button>
          <button class="swatch" data-color="#d43030" style="background:#d43030" title="正红"></button>
          <button class="swatch" data-color="#8e1e1e" style="background:#8e1e1e" title="暗红"></button>
          <button class="swatch" data-color="#1e3a8a" style="background:#1e3a8a" title="蓝色（专用）"></button>
          <button class="swatch" data-color="#166534" style="background:#166534" title="绿色"></button>
          <input id="colorPicker" type="color" value="#c8202a" title="自定义颜色">
        </div>
      </div>

      <div class="group">
        <label class="group-label">五角星</label>
        <div class="seg" id="starSeg" role="group">
          <button data-value="none" type="button">无</button>
          <button data-value="small" type="button">小</button>
          <button data-value="medium" class="active" type="button">中</button>
          <button data-value="large" type="button">大</button>
        </div>
      </div>

      <div class="group">
        <label class="group-label">边框样式</label>
        <div class="seg" id="borderSeg" role="group">
          <button data-value="none" type="button">无</button>
          <button data-value="single" type="button">单圈</button>
          <button data-value="double" class="active" type="button">双圈</button>
        </div>
      </div>

      <div class="group">
        <label class="group-label">底部文字（可选）</label>
        <input id="subText" type="text" value="合同专用章" maxlength="16" autocomplete="off">
      </div>

      <div class="group">
        <label class="group-label">做旧程度</label>
        <div class="seg" id="agingSeg" role="group">
          <button data-value="0" class="active" type="button">无</button>
          <button data-value="1" type="button">轻</button>
          <button data-value="2" type="button">中</button>
          <button data-value="3" type="button">重</button>
        </div>
      </div>

      <div class="group">
        <label class="group-label">旋转微调 <span class="hint" id="rotationVal">0°</span></label>
        <input id="rotation" type="range" min="-15" max="15" step="1" value="0">
      </div>
    </aside>

    <!-- 右侧预览与导出 -->
    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="sealCanvas"></canvas>
      </div>

      <div class="export-row">
        <label class="export-size-label">
          导出尺寸
          <select id="exportSize">
            <option value="256">256 × 256</option>
            <option value="512" selected>512 × 512</option>
            <option value="1024">1024 × 1024</option>
            <option value="2048">2048 × 2048</option>
          </select>
        </label>
        <button id="downloadBtn" type="button" class="primary-btn">💾 下载透明 PNG</button>
      </div>
      <p class="tips">💡 提示：正式文书请使用正规刻制的实体印章；本工具生成的图片仅供装饰、演示或占位使用。</p>
    </section>
  </div>
</main>
<script src="../../js/seal.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
