<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屏幕录制播放器 - 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/screen-recorder.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="recorder-wrap">
  <!-- 录制控制台 -->
  <div class="control-panel">
    <div class="options">
      <label class="checkbox-label">
        <input type="checkbox" id="opt-mic" checked>
        🎙️ 录制麦克风
      </label>
      <label class="checkbox-label" title="Mac 系统的 Chrome 默认不支持直接录系统音频，需安装虚拟声卡">
        <input type="checkbox" id="opt-system-audio">
        🔊 录制系统声音
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="opt-countdown" checked>
        ⏱️ 3 秒倒计时
      </label>
      <label class="checkbox-label" style="gap: 4px;">
        🎞️ 画质:
        <select id="opt-quality" class="quality-select">
          <option value="8000000">超清 (8Mbps)</option>
          <option value="5000000" selected>高清 (5Mbps)</option>
          <option value="2500000">标清 (2.5Mbps)</option>
        </select>
      </label>
    </div>
    
    <div class="action-buttons">
      <button id="btn-start" class="primary-btn">🔴 开始录制</button>
      <button id="btn-pause" class="secondary-btn" disabled>⏸️ 暂停</button>
      <button id="btn-stop" class="secondary-btn" disabled>⏹️ 停止</button>
      <button id="btn-restart" class="secondary-btn" disabled style="display:none;">🔄 重录</button>
    </div>
    
    <div class="timer-wrap">
      <div class="record-indicator" id="record-indicator"></div>
      <div class="timer" id="timer">00:00:00</div>
    </div>
  </div>

  <!-- 倒计时遮罩 -->
  <div id="countdown-overlay" class="countdown-overlay" style="display: none;">
    <div class="countdown-number" id="countdown-number">3</div>
  </div>

  <!-- 预览区 -->
  <div class="preview-container" id="preview-container">
    <div class="empty-hint" id="empty-hint">
      <div style="font-size:3rem; margin-bottom:12px;">🖥️</div>
      点击“开始录制”并选择要录制的屏幕区域<br>
      按 <kbd>Space</kbd> 暂停/继续，按 <kbd>Esc</kbd> 停止
    </div>
    <video id="preview-video" controls playsinline hidden></video>
  </div>

  <!-- 下载栏 -->
  <div class="download-bar" id="download-bar" hidden>
    <button id="btn-download" class="primary-btn">💾 下载视频</button>
    <div class="file-info">
      <span class="file-size" id="file-size"></span>
      <span class="file-format" id="file-format"></span>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/screen-recorder.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
