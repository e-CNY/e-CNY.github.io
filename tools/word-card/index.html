<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词卡片闪记器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/word-card.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📇 单词卡片闪记器</h1>
  <p>英语7大词库·日文JLPT·韩语TOPIK·SRS间隔重复·拼写测试·学习日历·成就系统</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="wc-app">
  <!-- 顶栏：语言 + 主题 + 列表 + 成就 -->
  <div class="wc-topbar">
    <div class="wc-lang-switch" id="lang-switch">
      <button type="button" class="active" data-lang="en">🇬🇧 英语</button>
      <button type="button" data-lang="ja">🇯🇵 日文</button>
      <button type="button" data-lang="ko">🇰🇷 韩语</button>
    </div>
    <div class="wc-top-actions">
      <button class="wc-icon-btn" id="btn-achv" type="button" title="学习统计与成就">🏆</button>
      <button class="wc-icon-btn" id="btn-theme" type="button" title="切换深色/浅色">🌙</button>
      <button class="wc-icon-btn" id="btn-list" type="button" title="单词列表">📋</button>
    </div>
  </div>

  <!-- 顶部词库分类 -->
  <div class="wc-decks" id="decks"></div>

  <!-- 工具栏按钮 -->
  <div class="wc-toolbar">
    <div class="wc-tool-group">
      <button class="wc-btn" id="btn-load">📥 导入词库</button>
      <input type="file" id="file-input" accept=".txt,text/plain" multiple hidden>
      <button class="wc-btn" id="btn-order">🔀 乱序</button>
      <button class="wc-btn" id="btn-hide-def" title="学习模式下隐藏释义，点击释义区可临时查看">🙈 隐藏释义</button>
      <button class="wc-btn" id="btn-random" title="随机跳到一个单词">🎲 随机</button>
    </div>
    <div class="wc-tool-group">
      <button class="wc-btn" id="btn-favonly">⭐ 只看收藏</button>
      <button class="wc-btn" id="btn-unmastered">🎯 只看未掌握</button>
      <button class="wc-btn" id="btn-review" title="仅显示今天需要复习的单词">📅 今日复习</button>
      <button class="wc-btn" id="btn-reset">♻️ 重置进度</button>
      <button class="wc-btn" id="btn-export" title="导出收藏的单词">📤 导出收藏</button>
    </div>
  </div>

  <!-- 今日学习面板 -->
  <section class="wc-daily" id="daily-panel">
    <div class="wc-daily-goal">
      <span class="wc-daily-label">🎯 今日目标</span>
      <b id="daily-goal-count">0 / 20</b>
      <div class="wc-progress-bar"><div class="wc-progress-fill" id="daily-progress"></div></div>
      <button class="wc-icon-btn sm" id="btn-set-goal" type="button" title="设置每日目标">⚙</button>
    </div>
    <div class="wc-daily-stats">
      <span>🔥 连续 <b id="daily-streak">0</b> 天</span>
      <span>⏱ 今日 <b id="daily-studied">0</b> 分钟</span>
      <span>📚 待复习 <b id="daily-due">0</b></span>
      <button class="wc-btn wc-btn-tiny" id="btn-open-achv" type="button">🏆 查看成就</button>
    </div>
  </section>

  <!-- 模式切换 -->
  <div class="wc-mode-switch">
    <button id="mode-learn" class="active">📖 学习</button>
    <button id="mode-test">🧠 选择</button>
    <button id="mode-spell">✍️ 拼写</button>
  </div>

  <!-- 主卡片区 -->
  <section class="wc-stage">
    <div class="wc-card" id="card">
      <div class="wc-card-top">
        <span class="wc-deck-tag" id="deck-tag">—</span>
        <span class="wc-status-tag" id="status-tag" hidden></span>
      </div>

      <div class="wc-visual-wrap">
        <canvas id="word-img-canvas" width="200" height="200"></canvas>
      </div>

      <div class="wc-word-row">
        <div class="wc-word" id="word">—</div>
      </div>

      <!-- 学习模式展示区 -->
      <div class="wc-learn-def" id="learn-def">—</div>

      <!-- 测试模式展示区 -->
      <div class="wc-test-options" id="test-options" hidden></div>
      <div class="wc-test-feedback" id="test-feedback" hidden></div>

      <!-- 拼写模式展示区 -->
      <div class="wc-spell-wrap" id="spell-wrap" hidden>
        <div class="wc-spell-hint" id="spell-hint">请根据释义拼写单词</div>
        <input class="wc-spell-input" id="spell-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入单词…">
        <div class="wc-spell-actions">
          <button class="wc-btn wc-btn-primary" id="spell-submit" type="button">提交</button>
          <button class="wc-btn" id="spell-reveal" type="button">查看答案</button>
        </div>
        <div class="wc-spell-feedback" id="spell-feedback"></div>
      </div>
    </div>
  </section>

  <!-- 底部控制按钮 -->
  <section class="wc-controls" id="controls">
    <button class="wc-btn wc-btn-prev" id="btn-prev">◀ 上一个</button>
    <button class="wc-btn wc-btn-danger" id="btn-unmastered-mark">❌ 不会</button>
    <button class="wc-btn wc-btn-fav" id="btn-fav-mark">☆ 收藏</button>
    <button class="wc-btn wc-btn-success" id="btn-mastered-mark">✅ 掌握</button>
    <button class="wc-btn wc-btn-next" id="btn-next">下一个 ▶</button>
  </section>

  <!-- 统计与生成图片 -->
  <section class="wc-stats">
    <div><span>当前</span><b id="stat-idx">0 / 0</b></div>
    <div><span>✅ 掌握</span><b id="stat-mastered" style="color:#4caf50;">0</b></div>
    <div><span>❌ 不会</span><b id="stat-unmastered" style="color:#f44336;">0</b></div>
    <div><span>⭐ 收藏</span><b id="stat-fav">0</b></div>
    <div class="wc-stats-grow"></div>

    <div class="wc-sound-ctrl">
      <button id="btn-sound" class="wc-btn" title="开关提示音">🔊</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" title="音量">
    </div>

    <button class="wc-btn wc-btn-accent" id="btn-share">🎨 生成卡片图</button>
  </section>

  <!-- 空状态提示 -->
  <section class="wc-empty" id="empty" hidden>
    <p>没有找到匹配的单词 🙌</p>
    <p class="wc-empty-sub">
      如果当前选中的是「只看未掌握」「今日复习」且没有任何单词，也会显示此提示。
    </p>
  </section>

  <!-- 单词列表抽屉 -->
  <div class="wc-list-modal" id="list-modal" hidden>
    <div class="wc-list-body">
      <div class="wc-list-head">
        <h3>📋 单词列表</h3>
        <button class="wc-icon-btn" id="list-close" type="button">✕</button>
      </div>
      <div class="wc-list-filters">
        <input type="search" id="list-search" placeholder="搜索单词 / 释义…" autocomplete="off">
        <select id="list-filter">
          <option value="all">全部</option>
          <option value="fav">⭐ 收藏</option>
          <option value="mastered">✅ 已掌握</option>
          <option value="unmastered">❌ 未掌握</option>
          <option value="new">🆕 未学</option>
        </select>
      </div>
      <div class="wc-list-count" id="list-count">—</div>
      <div class="wc-list-grid" id="list-grid"></div>
    </div>
  </div>

  <!-- 成就 & 学习统计弹窗 -->
  <div class="wc-achv-modal" id="achv-modal" hidden>
    <div class="wc-achv-body">
      <div class="wc-achv-head">
        <h3>🏆 学习统计与成就</h3>
        <button class="wc-icon-btn" id="achv-close" type="button">✕</button>
      </div>

      <div class="wc-achv-summary" id="achv-summary"></div>

      <div class="wc-heatmap-wrap">
        <div class="wc-heatmap-title">📅 学习日历（最近 20 周）</div>
        <canvas id="heatmap-canvas" width="700" height="260"></canvas>
        <div class="wc-heatmap-legend">
          <span>少</span>
          <i style="background:#ebedf0"></i>
          <i style="background:#c8e6c9"></i>
          <i style="background:#81c784"></i>
          <i style="background:#4caf50"></i>
          <i style="background:#2e7d32"></i>
          <span>多</span>
        </div>
      </div>

      <div class="wc-achv-grid-title">🎖 成就徽章</div>
      <div class="wc-achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <!-- 弹窗：生成图片 -->
  <div class="wc-modal" id="modal" hidden>
    <div class="wc-modal-body">
      <div class="wc-modal-head">
        <span>卡片图预览</span>
        <button class="wc-modal-close" id="btn-close" aria-label="关闭">✕</button>
      </div>
      <div class="wc-modal-canvas-wrap">
        <canvas id="card-canvas" width="1080" height="1350"></canvas>
      </div>
      <div class="wc-modal-actions">
        <button class="wc-btn" id="btn-change-bg">🔁 换一种背景</button>
        <button class="wc-btn wc-btn-primary" id="btn-download">⬇️ 下载 PNG</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="wc-toast" id="toast"></div>
</main>

<script src="../../js/word-card-bank.js"></script>
<script src="../../js/word-card.js"></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
