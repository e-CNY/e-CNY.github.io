<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片隐写与处理 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/steganography.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="st-layout">
  <div class="st-tabs" id="st-tabs">
    <button class="st-tab active" data-target="panel-hide" type="button">✍️ 隐藏信息</button>
    <button class="st-tab" data-target="panel-extract" type="button">🔍 提取信息</button>
  </div>

  <div class="st-content">
    <!-- ============ 隐藏信息 ============ -->
    <div id="panel-hide" class="st-panel active">
      <div class="st-row">
        <label>1. 上传图片</label>
        <div class="st-dropzone" id="hide-dropzone">
          <div class="st-dropzone-icon">📁</div>
          <p class="st-dropzone-text">点击选择 / 拖拽图片到此处</p>
          <p class="st-dropzone-hint">支持 PNG / JPG / WebP，输出始终为 PNG</p>
          <input type="file" id="hide-img" accept="image/*" hidden>
        </div>
        <div class="st-preview-wrap" id="hide-preview-wrap" hidden>
          <img id="hide-preview" class="st-preview" alt="preview">
          <div class="st-image-info" id="hide-image-info"></div>
          <div class="st-capacity" id="hide-capacity"></div>
        </div>
      </div>

      <div class="st-row">
        <label>2. 输入要隐藏的文本</label>
        <textarea id="hide-text" class="st-textarea" rows="5"
                  placeholder="输入绝密信息（支持中文、Emoji）"></textarea>
        <div class="st-text-info">
          <span id="hide-text-info">0 字节</span>
        </div>
      </div>

      <div class="st-row st-row-inline">
        <div class="st-col">
          <label>3. LSB 深度</label>
          <div class="st-seg" id="hide-depth-seg">
            <button data-depth="1" class="active" type="button">1 位</button>
            <button data-depth="2" type="button">2 位</button>
            <button data-depth="4" type="button">4 位</button>
          </div>
          <div class="st-hint" id="hide-depth-hint">质量最佳 · 容量最小</div>
        </div>
        <div class="st-col">
          <label>4. 加密密码（可选）</label>
          <input type="password" id="hide-password" class="st-input"
                 placeholder="留空则不加密" autocomplete="new-password">
        </div>
      </div>

      <button id="btn-hide" class="st-btn primary" type="button">🔒 隐藏并生成图片</button>

      <div id="hide-result" class="st-result-area"></div>
    </div>

    <!-- ============ 提取信息 ============ -->
    <div id="panel-extract" class="st-panel">
      <div class="st-row">
        <label>1. 上传含有隐藏信息的图片</label>
        <div class="st-dropzone" id="extract-dropzone">
          <div class="st-dropzone-icon">📁</div>
          <p class="st-dropzone-text">点击选择 / 拖拽图片到此处</p>
          <p class="st-dropzone-hint">请使用生成的 PNG 原图（未压缩）</p>
          <input type="file" id="extract-img" accept="image/*" hidden>
        </div>
        <div class="st-preview-wrap" id="extract-preview-wrap" hidden>
          <img id="extract-preview" class="st-preview" alt="preview">
          <div class="st-image-info" id="extract-image-info"></div>
        </div>
      </div>

      <div class="st-row">
        <label>2. 密码（如编码时使用了）</label>
        <input type="password" id="extract-password" class="st-input"
               placeholder="留空则视为未加密" autocomplete="new-password">
      </div>

      <button id="btn-extract" class="st-btn primary" type="button">🔍 提取隐藏文本</button>

      <div class="st-row" style="margin-top:20px;">
        <label>3. 提取结果</label>
        <textarea id="extract-text" class="st-textarea" rows="6" readonly
                  placeholder="提取结果将显示在此"></textarea>
        <div class="st-text-info">
          <span id="extract-text-info"></span>
          <button class="st-mini-btn" id="btn-copy-extract" type="button" hidden>📋 复制</button>
        </div>
      </div>
    </div>
  </div>

  <div class="st-warning">
    ⚠️ <strong>重要提示</strong>：生成的图片必须保存为 <strong>PNG</strong> 格式。
    如果被重新保存为 JPEG、被微信/QQ/微博等平台压缩、或截图，像素数据可能被修改，隐藏信息将<strong>永久丢失</strong>。
  </div>
</main>

<div class="st-toast" id="st-toast"></div>

<script src="../../js/steganography.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
