<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片隐写术 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/steganography.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🕵️ 图片隐写与极客处理</h1>
  <p>将文本藏在图片的像素深处，肉眼看不出任何变化。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="st-layout" style="padding-top: 0;">
  <div class="st-tabs">
    <button class="st-tab active" data-target="panel-hide">✍️ 隐藏信息 (Encode)</button>
    <button class="st-tab" data-target="panel-extract">🔍 提取信息 (Decode)</button>
  </div>

  <div class="st-content">
    <!-- 隐藏信息 -->
    <div id="panel-hide" class="st-panel active">
      <div class="st-row">
        <label>1. 上传封面图片 (建议 PNG)</label>
        <input type="file" id="hide-img" accept="image/png,image/jpeg">
      </div>
      <div class="st-row">
        <label>2. 输入要隐藏的文本</label>
        <textarea id="hide-text" class="st-textarea" rows="4" placeholder="输入绝密信息..."></textarea>
      </div>
      <button id="btn-hide" class="st-btn primary">生成带隐秘信息的图片</button>
      <div id="hide-result" class="st-result-area"></div>
    </div>

    <!-- 提取信息 -->
    <div id="panel-extract" class="st-panel">
      <div class="st-row">
        <label>1. 上传包含隐秘信息的图片</label>
        <input type="file" id="extract-img" accept="image/png">
      </div>
      <button id="btn-extract" class="st-btn primary">提取隐藏文本</button>
      <div class="st-row" style="margin-top:20px;">
        <label>提取结果</label>
        <textarea id="extract-text" class="st-textarea" rows="4" readonly></textarea>
      </div>
    </div>
  </div>
</main>
<script src="../../js/steganography.js" defer></script>
</body>
</html>
