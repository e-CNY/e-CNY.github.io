<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高保真录音笔 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/audio-recorder.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎙️ 高保真音频工作站</h1>
  <p>无损录音、波形频谱预览、精准裁剪、音量增益，纯本地处理。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="ar-layout" style="padding-top: 0;">
  <div class="ar-container">
    <!-- 左侧：录音与频谱 -->
    <div class="ar-card">
      <div class="ar-toolbar">
        <div class="ar-setting-group">
          <label>视觉特效：</label>
          <select id="ar-visual-mode" class="ar-select">
            <option value="wave">波形 (时域)</option>
            <option value="bars">频谱 (频域)</option>
          </select>
        </div>
      </div>

      <div class="ar-visualizer-wrap">
        <canvas id="ar-canvas"></canvas>
      </div>
      
      <div class="ar-controls">
        <button id="btn-record" class="ar-btn primary">
          <span class="ar-icon">🔴</span> 开始录音
        </button>
        <button id="btn-pause" class="ar-btn" disabled>
          <span class="ar-icon">⏸️</span> 暂停
        </button>
        <button id="btn-stop" class="ar-btn danger" disabled>
          <span class="ar-icon">⏹️</span> 停止
        </button>
        <div class="ar-timer" id="ar-timer">00:00</div>
      </div>
    </div>

    <!-- 右侧：后处理与导出 -->
    <div class="ar-card" id="ar-editor-panel" style="display: none;">
      <div class="ar-header-row">
        <h3>✂️ 音频剪辑与导出</h3>
      </div>
      
      <div class="ar-editor-content">
        <audio id="ar-audio-player" controls></audio>
        
        <div class="ar-edit-group">
          <label>裁剪范围：</label>
          <div class="ar-slider-wrap">
            <span id="label-start">00:00</span>
            <input type="range" id="trim-start" min="0" max="100" step="0.1" value="0">
          </div>
          <div class="ar-slider-wrap">
            <span id="label-end">00:00</span>
            <input type="range" id="trim-end" min="0" max="100" step="0.1" value="100">
          </div>
        </div>

        <div class="ar-edit-group">
          <label>音量增益：</label>
          <div class="ar-slider-wrap">
            <input type="range" id="vol-gain" min="0.5" max="3" step="0.1" value="1">
            <span id="label-gain">1.0x</span>
          </div>
        </div>

        <div class="ar-edit-group">
          <label>导出设置：</label>
          <div class="ar-export-row">
            <input type="text" id="export-filename" placeholder="文件名" value="我的录音">
            <select id="export-format" class="ar-select">
              <option value="wav">.wav (无损)</option>
              <option value="webm">.webm (压缩)</option>
            </select>
          </div>
        </div>

        <button id="btn-download" class="ar-btn primary" style="width: 100%; margin-top: 10px;">⬇️ 生成并下载</button>
      </div>
    </div>
  </div>
</main>

<script src="../../js/audio-recorder.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
