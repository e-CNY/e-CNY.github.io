<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发辅助工具箱 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/dev-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🛠️ 开发辅助工具箱</h1>
  <p>.gitignore 生成器、Nginx 配置格式化与高亮。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="dv-layout" style="padding-top: 0;">
  <div class="dv-tabs">
    <button class="dv-tab active" data-target="panel-git">.gitignore 生成器</button>
    <button class="dv-tab" data-target="panel-nginx">Nginx 格式化</button>
  </div>

  <div class="dv-content">
    <!-- 1. Gitignore -->
    <div id="panel-git" class="dv-panel active">
      <div class="dv-grid">
        <div class="dv-sidebar">
          <label class="dv-check"><input type="checkbox" value="node" checked> Node.js</label>
          <label class="dv-check"><input type="checkbox" value="python"> Python</label>
          <label class="dv-check"><input type="checkbox" value="java"> Java / Maven</label>
          <label class="dv-check"><input type="checkbox" value="mac"> macOS 系统文件</label>
          <label class="dv-check"><input type="checkbox" value="win"> Windows 系统文件</label>
          <label class="dv-check"><input type="checkbox" value="ide"> IDE (VSCode / IDEA)</label>
          <button id="btn-git" class="dv-btn primary" style="margin-top: 16px;">生成配置</button>
        </div>
        <div class="dv-main">
          <textarea id="git-output" class="dv-textarea" rows="12" readonly placeholder="# 选择左侧选项生成 .gitignore"></textarea>
        </div>
      </div>
    </div>

    <!-- 2. Nginx -->
    <div id="panel-nginx" class="dv-panel">
      <div class="dv-row">
        <button id="btn-nginx" class="dv-btn primary">格式化并高亮</button>
      </div>
      <div class="dv-grid" style="grid-template-columns: 1fr 1fr;">
        <textarea id="nginx-input" class="dv-textarea" rows="12" placeholder="粘贴 Nginx 配置代码..."></textarea>
        <pre id="nginx-output" class="dv-code-block"></pre>
      </div>
    </div>
  </div>
</main>
<script src="../../js/dev-tool.js" defer></script>
</body>
</html>
