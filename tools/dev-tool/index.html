<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发辅助工具箱 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/dev-tool.css">
</head>
<body>
<header class="tool-page-header theme-header" style="padding: 12px 16px 8px;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions"><button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题"></button></div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->

  <h1>🛠️ 开发辅助工具箱</h1>
  <p>代码生成、Cron 表达式、Gitignore 配置、Nginx 格式化，提效利器。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="dv-layout">
  <div class="dv-tabs">
    <button class="dv-tab active" data-target="panel-git">.gitignore 生成</button>
    <button class="dv-tab" data-target="panel-entity">JSON 转实体类</button>
    <button class="dv-tab" data-target="panel-cron">Cron 表达式</button>
    <button class="dv-tab" data-target="panel-time">时间代码生成</button>
    <button class="dv-tab" data-target="panel-nginx">Nginx 格式化</button>
  </div>

  <div class="dv-content">
    
    <!-- ================= 1. Gitignore ================= -->
    <div id="panel-git" class="dv-panel active">
      <div class="dv-grid">
        <div class="dv-sidebar">
          <div class="dv-check-group">
            <label class="dv-check"><input type="checkbox" value="node" checked> Node.js / 前端</label>
            <label class="dv-check"><input type="checkbox" value="python"> Python</label>
            <label class="dv-check"><input type="checkbox" value="java"> Java / Maven</label>
            <label class="dv-check"><input type="checkbox" value="go"> Go</label>
            <label class="dv-check"><input type="checkbox" value="rust"> Rust</label>
            <label class="dv-check"><input type="checkbox" value="cpp"> C / C++</label>
            <label class="dv-check"><input type="checkbox" value="swift"> Swift / Xcode</label>
            <label class="dv-check"><input type="checkbox" value="csharp"> C# / .NET</label>
            <label class="dv-check"><input type="checkbox" value="unity"> Unity</label>
            <label class="dv-check"><input type="checkbox" value="os" checked> 操作系统缓存</label>
            <label class="dv-check"><input type="checkbox" value="ide" checked> IDE 配置文件</label>
          </div>
          <button id="btn-git-download" class="dv-btn primary" style="margin-top: 16px;">💾 下载 .gitignore</button>
        </div>
        <div class="dv-main">
          <div class="dv-input-wrapper">
            <button class="dv-copy-btn" data-target="git-output">📋</button>
            <textarea id="git-output" class="dv-textarea" rows="16" readonly placeholder="# 勾选左侧选项，将自动生成 .gitignore 内容"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 2. JSON 转实体类 ================= -->
    <div id="panel-entity" class="dv-panel">
      <div class="dv-row" style="flex-wrap: wrap; gap: 10px;">
        <input type="text" id="entity-class-name" class="dv-input" style="width:150px; padding:8px; border:1px solid #d5c7a8; border-radius:6px;" value="RootObject" placeholder="根类名">
        <select id="entity-lang" class="dv-select">
          <option value="typescript">TypeScript (Interface)</option>
          <option value="java">Java (Class)</option>
          <option value="go">Go (Struct)</option>
          <option value="python">Python (Class)</option>
          <option value="csharp">C# (Class)</option>
          <option value="dart">Dart (Class)</option>
        </select>
        <button id="btn-entity" class="dv-btn primary">⚡ 生成代码</button>
        <button id="btn-entity-sample" class="dv-btn">📥 填入示例</button>
      </div>
      <div class="dv-grid" style="grid-template-columns: 1fr 1fr; height: calc(100vh - 280px);">
        <div class="dv-col">
          <label>输入 JSON</label>
          <div class="dv-input-wrapper" style="flex:1;">
            <textarea id="entity-input" class="dv-textarea" style="height:100%;" placeholder='{"id": 1, "name": "张三", "address": {"city": "Beijing"}, "tags": ["admin"]}'></textarea>
          </div>
        </div>
        <div class="dv-col">
          <label>生成代码 <button class="dv-copy-btn" data-target="entity-output" style="position:static; float:right; margin-top:-2px;">📋 复制</button></label>
          <div class="dv-input-wrapper" style="flex:1;">
            <textarea id="entity-output" class="dv-textarea" style="height:100%;" readonly></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 3. Cron 表达式 ================= -->
    <div id="panel-cron" class="dv-panel">
      <div class="cron-builder">
        <div class="cron-field">
          <label>分钟 (0-59)</label>
          <input type="text" id="cron-min" value="*" class="cron-input">
        </div>
        <div class="cron-field">
          <label>小时 (0-23)</label>
          <input type="text" id="cron-hour" value="*" class="cron-input">
        </div>
        <div class="cron-field">
          <label>日 (1-31)</label>
          <input type="text" id="cron-day" value="*" class="cron-input">
        </div>
        <div class="cron-field">
          <label>月 (1-12)</label>
          <input type="text" id="cron-month" value="*" class="cron-input">
        </div>
        <div class="cron-field">
          <label>周 (0-6, 0=日)</label>
          <input type="text" id="cron-week" value="*" class="cron-input">
        </div>
      </div>
      <div class="cron-result-box">
        <div class="cron-expr-wrap">
          <span class="cron-prefix">Cron:</span>
          <input type="text" id="cron-result" class="cron-result" readonly value="* * * * *">
          <button class="dv-copy-btn" data-target="cron-result" style="position:static;">📋 复制</button>
        </div>
        <div id="cron-desc" class="cron-desc">每分钟执行一次</div>
      </div>
      <div class="cron-presets">
        <label>快速填入：</label>
        <button class="cron-preset" data-cron="* * * * *">每分钟</button>
        <button class="cron-preset" data-cron="0 * * * *">每小时整点</button>
        <button class="cron-preset" data-cron="0 0 * * *">每天 0 点</button>
        <button class="cron-preset" data-cron="0 0 * * 1">每周一 0 点</button>
        <button class="cron-preset" data-cron="0 0 1 * *">每月 1 号 0 点</button>
      </div>
    </div>

    <!-- ================= 4. 时间代码 ================= -->
    <div id="panel-time" class="dv-panel">
      <div class="dv-row">
        <select id="time-lang" class="dv-select">
          <option value="js">JavaScript / TypeScript</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="go">Go</option>
          <option value="php">PHP</option>
          <option value="csharp">C#</option>
          <option value="rust">Rust</option>
          <option value="swift">Swift</option>
          <option value="sql">SQL (MySQL)</option>
        </select>
      </div>
      <div class="dv-main">
        <div class="dv-input-wrapper">
          <button class="dv-copy-btn" data-target="time-output">📋</button>
          <textarea id="time-output" class="dv-textarea" rows="12" readonly style="font-family: monospace; font-size: 1rem; line-height: 1.8;"></textarea>
        </div>
      </div>
    </div>

    <!-- ================= 5. Nginx 高亮 ================= -->
    <div id="panel-nginx" class="dv-panel">
      <div class="dv-row">
        <button id="btn-nginx" class="dv-btn primary">✨ 格式化并高亮</button>
      </div>
      <div class="dv-grid" style="grid-template-columns: 1fr 1fr; height: calc(100vh - 280px);">
        <div class="dv-col">
          <label>粘贴 Nginx 代码</label>
          <div class="dv-input-wrapper" style="flex:1;">
            <textarea id="nginx-input" class="dv-textarea" style="height:100%;" placeholder="server { listen 80; location / { proxy_pass http://127.0.0.1:8080; } }"></textarea>
          </div>
        </div>
        <div class="dv-col">
          <label>高亮输出 <button class="dv-copy-btn" data-target="nginx-output-text" style="position:static; float:right; margin-top:-2px;">📋 复制</button></label>
          <div class="dv-input-wrapper" style="flex:1; overflow:auto;">
            <pre id="nginx-output" class="dv-code-block" style="height:100%; margin:0;"></pre>
            <textarea id="nginx-output-text" style="display:none;"></textarea>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="toast"></div>
<script src="../../js/dev-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
