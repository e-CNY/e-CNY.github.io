<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学函数绘图 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/math-plot.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📈 数学函数绘图</h1>
  <p>输入函数表达式（如 Math.sin(x)），实时渲染 2D 曲线。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="mp-layout" style="padding-top: 0;">
  <div class="mp-card">
    <div class="mp-toolbar">
      <input type="text" id="mp-func" class="mp-input" value="Math.sin(x) + Math.cos(x * 2)">
      <button id="btn-plot" class="mp-btn primary">绘图</button>
    </div>
    <div id="plot-area" class="mp-plot-area"></div>
  </div>
</main>
<script src="../../js/libs/plotly.min.js"></script>
<script src="../../js/math-plot.js" defer></script>
</body>
</html>
