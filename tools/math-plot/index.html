<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全功能数学绘图 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/math-plot.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📈 全功能数学绘图</h1>
  <p>支持显函数、参数方程、极坐标、隐函数及 3D 曲面。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="mp-layout" style="padding-top: 0;">
  <div class="mp-card">
    <div class="mp-toolbar">
      <select id="mp-type" class="mp-select">
        <option value="explicit">2D 显函数 (y = f(x))</option>
        <option value="parametric">2D 参数方程 (x(t), y(t))</option>
        <option value="polar">2D 极坐标 (r = f(θ))</option>
        <option value="implicit">2D 隐函数 (f(x,y) = 0)</option>
        <option value="surface">3D 曲面 (z = f(x,y))</option>
      </select>
      <button id="btn-plot" class="mp-btn primary">绘图</button>
    </div>

    <div id="mp-inputs" class="mp-inputs">
      <!-- 动态渲染输入框 -->
    </div>

    <div id="plot-area" class="mp-plot-area"></div>
  </div>
</main>
<script src="../../js/libs/plotly.min.js"></script>
<script src="../../js/math-plot.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
