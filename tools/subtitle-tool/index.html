<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕编辑器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/subtitle-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>💬 字幕编辑器</h1>
  <p>SRT / VTT 解析、时间轴平移、正则替换与格式互转，全程本地处理。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="sb-layout">
  <div class="sb-container">
    
    <!-- 左侧控制台 -->
    <aside class="sb-sidebar">
      <!-- 文件导入导出 -->
      <div class="sb-section">
        <h3>📁 文件操作</h3>
        <input type="file" id="file-input" accept=".srt,.vtt,.txt" hidden>
        <div class="sb-row">
          <button class="sb-btn primary" onclick="importFile()">📂 导入字幕</button>
          <button class="sb-btn" onclick="downloadSub('srt')">💾 存为 SRT</button>
          <button class="sb-btn" onclick="downloadSub('vtt')">💾 存为 VTT</button>
        </div>
      </div>

      <!-- 时间轴平移 -->
      <div class="sb-section">
        <h3>⏱️ 时间轴平移</h3>
        <div class="sb-row" style="margin-bottom: 8px;">
          <input type="number" id="sb-shift" value="1" step="0.1">
          <span style="font-size:0.85rem;">秒</span>
        </div>
        <div class="sb-row">
          <button id="btn-shift-add" class="sb-btn">🕒 整体延后 (+)</button>
          <button id="btn-shift-sub" class="sb-btn">🕒 整体提前 (-)</button>
        </div>
        <button id="btn-remove-gap" class="sb-btn" style="margin-top: 8px; width: 100%;">✨ 消除时间空隙</button>
      </div>

      <!-- 文本替换 -->
      <div class="sb-section">
        <h3>🔍 查找与替换</h3>
        <input type="text" id="sb-find" placeholder="查找内容" style="margin-bottom: 8px;">
        <input type="text" id="sb-replace" placeholder="替换为" style="margin-bottom: 8px;">
        <div class="sb-row" style="margin-bottom: 8px;">
          <label class="sb-checkbox"><input type="checkbox" id="chk-regex"> 正则</label>
          <label class="sb-checkbox"><input type="checkbox" id="chk-case"> 区分大小写</label>
        </div>
        <button id="btn-replace" class="sb-btn primary">替换全部文本</button>
      </div>

      <!-- 格式互转 -->
      <div class="sb-section">
        <h3>🔄 格式互转</h3>
        <div class="sb-row">
          <button id="btn-to-srt" class="sb-btn">转为 SRT</button>
          <button id="btn-to-vtt" class="sb-btn">转为 VTT</button>
        </div>
      </div>
    </aside>

    <!-- 右侧工作区 -->
    <div class="sb-main">
      <!-- 顶部工具栏与统计 -->
      <div class="sb-toolbar">
        <div class="sb-stats">
          字幕条数: <b id="stat-blocks">0</b> | 
          总字符: <b id="stat-chars">0</b>
        </div>
        <div class="sb-actions">
          <button class="sb-tab active" data-view="text">💻 源码对比</button>
          <button class="sb-tab" data-view="visual">👁️ 可视化列表</button>
          <button class="sb-btn danger" onclick="clearAll()">🗑️ 清空</button>
        </div>
      </div>

      <!-- 源码对比视图 -->
      <div class="sb-view active" id="view-text">
        <div class="sb-editor-col">
          <label>原始字幕 (支持拖拽文件) <span id="msg-in" class="sb-msg"></span></label>
          <textarea id="sb-input" spellcheck="false" placeholder="在此粘贴 SRT 或 VTT 字幕，或拖拽文件至此..."></textarea>
        </div>
        <div class="sb-editor-col">
          <label>处理结果
            <button class="sb-mini-btn" onclick="copyResult()">📋 复制</button>
          </label>
          <textarea id="sb-output" spellcheck="false" readonly placeholder="处理结果将显示在这里..."></textarea>
        </div>
      </div>

      <!-- 可视化列表视图 -->
      <div class="sb-view" id="view-visual">
        <div id="visual-list" class="sb-visual-list">
          <p class="sb-empty">请先在上方输入字幕...</p>
        </div>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/subtitle-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
