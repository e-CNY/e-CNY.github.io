<!-- 文件: tools/image-slicer/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片切图与拼接 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/image-slicer.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="is-layout" style="padding-top: 0;">
  <div class="is-tabs">
    <button class="is-tab active" data-target="panel-slice">🔲 网格切图</button>
    <button class="is-tab" data-target="panel-long">📜 长图拼接</button>
    <button class="is-tab" data-target="panel-grid">🧱 网格拼图</button>
  </div>

  <!-- 全局设置条 -->
  <div class="is-global-settings">
    <div class="setting-item">
      <label>导出格式</label>
      <select id="global-format" class="is-select">
        <option value="image/png">PNG (支持透明)</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp">WebP</option>
      </select>
    </div>
    <div class="setting-item">
      <label>画质 (JPG/WebP)</label>
      <input type="range" id="global-quality" min="30" max="100" value="92">
      <span id="global-quality-val">92%</span>
    </div>
    <div class="setting-item">
      <label>水印</label>
      <input type="text" id="global-watermark" class="is-input" placeholder="留空则不添加" maxlength="60">
    </div>
  </div>

  <div class="is-content">
    <!-- ================= 1. 网格切图 ================= -->
    <div id="panel-slice" class="is-panel active">
      <div class="is-toolbar">
        <div class="toolbar-group">
          <span>行数：</span>
          <input type="number" id="slice-rows" class="is-input" value="3" min="1" max="20" style="width:60px;">
          <span>列数：</span>
          <input type="number" id="slice-cols" class="is-input" value="3" min="1" max="20" style="width:60px;">
          <span>倍率：</span>
          <input type="number" id="slice-scale" class="is-input" value="100" min="10" max="400" step="10" style="width:64px;">%
        </div>
        <div class="toolbar-group">
          <span>最大边长：</span>
          <input type="number" id="slice-max-dim" class="is-input" value="0" min="0" step="10" style="width:80px;">
          <small>0 表示不限制</small>
        </div>
        <button id="btn-slice" class="is-btn primary" disabled>✂️ 开始切图并打包下载</button>
      </div>
      <div id="slice-drop" class="is-drop-zone">
        <span>📁 点击 / 拖拽 / 粘贴一张大图到这里</span>
        <small>支持 JPG / PNG / WebP · 使用 pica 高质量缩放</small>
      </div>
      <input id="slice-input" type="file" accept="image/*" hidden>

      <div class="is-preview-wrap">
        <div id="slice-preview" class="is-preview-grid"></div>
      </div>
    </div>

    <!-- ================= 2. 长图拼接 ================= -->
    <div id="panel-long" class="is-panel">
      <div class="is-toolbar">
        <div class="toolbar-group">
          <select id="long-direction" class="is-select">
            <option value="vertical">纵向拼接</option>
            <option value="horizontal">横向拼接</option>
          </select>
          <select id="long-align" class="is-select">
            <option value="center">居中对齐</option>
            <option value="left">左对齐</option>
            <option value="right">右对齐</option>
          </select>
          <span>间距：</span>
          <input type="number" id="long-gap" class="is-input" value="0" min="0" max="100" style="width:60px;">
          <span>背景：</span>
          <input type="color" id="long-bg" value="#ffffff" style="height:36px; padding:2px; border-radius:6px; border:1px solid #d5c7a8; cursor:pointer;">
        </div>
        <div class="toolbar-group">
          <label><input type="checkbox" id="long-unify"> 统一尺寸</label>
          <input type="number" id="long-target" class="is-input" value="0" min="0" style="width:80px;" placeholder="0=自动" title="统一宽度(纵向) / 统一高度(横向)">
          <span>圆角：</span>
          <input type="number" id="long-radius" class="is-input" value="0" min="0" max="200" style="width:60px;">
          <span>倍率：</span>
          <input type="number" id="long-scale" class="is-input" value="100" min="10" max="400" step="10" style="width:64px;">%
        </div>
        <button id="btn-long" class="is-btn primary" disabled>▶️ 开始拼接并下载</button>
        <button id="btn-long-clear" class="is-btn">🗑️ 清空</button>
      </div>

      <div id="long-drop" class="is-drop-zone">
        <span>📁 点击 / 拖拽 / 粘贴多张图片 (支持多选)</span>
        <small>支持统一尺寸 · 圆角 · 倍率缩放 · 水印</small>
      </div>
      <input id="long-input" type="file" accept="image/*" multiple hidden>

      <div class="is-list-wrap">
        <ul id="long-list" class="is-file-list"></ul>
      </div>

      <div class="is-preview-wrap">
        <canvas id="long-canvas"></canvas>
        <div id="long-empty" class="is-empty-hint">请上传图片以预览</div>
      </div>
    </div>

    <!-- ================= 3. 网格拼图 ================= -->
    <div id="panel-grid" class="is-panel">
      <div class="is-toolbar">
        <div class="toolbar-group">
          <span>列数：</span>
          <input type="number" id="grid-cols" class="is-input" value="2" min="1" max="10" style="width:60px;">
          <span>间距：</span>
          <input type="number" id="grid-gap" class="is-input" value="10" min="0" max="100" style="width:60px;">
          <span>圆角：</span>
          <input type="number" id="grid-radius" class="is-input" value="0" min="0" max="200" style="width:60px;">
          <span>背景：</span>
          <input type="color" id="grid-bg" value="#ffffff" style="height:36px; padding:2px; border-radius:6px; border:1px solid #d5c7a8; cursor:pointer;">
        </div>
        <div class="toolbar-group">
          <span>格子：</span>
          <select id="grid-cell-mode" class="is-select">
            <option value="auto">自动（最大图片）</option>
            <option value="fixed">固定尺寸</option>
          </select>
          <input type="number" id="grid-cell-size" class="is-input" value="400" min="20" style="width:80px; display:none;">
          <span>倍率：</span>
          <input type="number" id="grid-scale" class="is-input" value="100" min="10" max="400" step="10" style="width:64px;">%
        </div>
        <button id="btn-grid" class="is-btn primary" disabled>▶️ 开始拼图并下载</button>
        <button id="btn-grid-clear" class="is-btn">🗑️ 清空</button>
      </div>

      <div id="grid-drop" class="is-drop-zone">
        <span>📁 点击 / 拖拽 / 粘贴多张图片 (按顺序拼接)</span>
        <small>支持固定格子尺寸 · 圆角 · 倍率缩放 · 水印</small>
      </div>
      <input id="grid-input" type="file" accept="image/*" multiple hidden>

      <div class="is-list-wrap">
        <ul id="grid-list" class="is-file-list"></ul>
      </div>

      <div class="is-preview-wrap">
        <canvas id="grid-canvas"></canvas>
        <div id="grid-empty" class="is-empty-hint">请上传图片以预览</div>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/pica.min.js"></script>
<script src="../../js/libs/jszip.min.js"></script>
<script src="../../js/image-slicer.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
