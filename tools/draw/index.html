<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>在线画板 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/draw.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎨 在线画板</h1>
  <p>支持多种笔刷、形状、撤销重做与保存。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="draw-layout">
  <!-- 工具栏 -->
  <aside class="draw-sidebar">
    
    <div class="draw-group">
      <h3>🖌️ 笔刷类型</h3>
      <div class="draw-tools">
        <button type="button" class="tool-btn active" data-tool="pen" title="普通画笔">🖌️</button>
        <button type="button" class="tool-btn" data-tool="marker" title="马克笔">🖍️</button>
        <button type="button" class="tool-btn" data-tool="highlighter" title="荧光笔">🟨</button>
        <button type="button" class="tool-btn" data-tool="pencil" title="铅笔">✏️</button>
        <button type="button" class="tool-btn" data-tool="ink" title="毛笔">🖋️</button>
        <button type="button" class="tool-btn" data-tool="spray" title="喷枪">💨</button>
        <button type="button" class="tool-btn" data-tool="rainbow" title="彩虹笔">🌈</button>
        <button type="button" class="tool-btn" data-tool="neon" title="霓虹笔">💡</button>
        <button type="button" class="tool-btn" data-tool="bubbles" title="气泡笔">🫧</button>
        <button type="button" class="tool-btn" data-tool="crayon" title="蜡笔">🖍️</button>
      </div>
    </div>

    <div class="draw-group">
      <h3>📐 形状与擦除</h3>
      <div class="draw-tools">
        <button type="button" class="tool-btn" data-tool="eraser" title="橡皮擦">🧽</button>
        <button type="button" class="tool-btn" data-tool="line" title="直线">📏</button>
        <button type="button" class="tool-btn" data-tool="rect" title="矩形">⬜</button>
        <button type="button" class="tool-btn" data-tool="circle" title="圆形">⭕</button>
      </div>
    </div>

    <div class="draw-group">
      <h3>🎨 颜色</h3>
      <div class="draw-colors">
        <button type="button" class="color-btn active" style="background: #3d3226;" data-color="#3d3226"></button>
        <button type="button" class="color-btn" style="background: #a8452a;" data-color="#a8452a"></button>
        <button type="button" class="color-btn" style="background: #8a5a2b;" data-color="#8a5a2b"></button>
        <button type="button" class="color-btn" style="background: #7ba05b;" data-color="#7ba05b"></button>
        <button type="button" class="color-btn" style="background: #4a90e2;" data-color="#4a90e2"></button>
        <button type="button" class="color-btn" style="background: #8e44ad;" data-color="#8e44ad"></button>
        <button type="button" class="color-btn" style="background: #f1c40f;" data-color="#f1c40f"></button>
        <label class="color-btn custom-color" style="background: #fff;" title="自定义颜色">
          <input type="color" id="custom-color" value="#000000">
        </label>
      </div>
    </div>

    <div class="draw-group">
      <h3>⚙️ 笔触大小</h3>
      <div class="draw-size-row">
        <input type="range" id="brush-size" min="1" max="50" value="5">
        <span id="size-val">5px</span>
      </div>
    </div>

    <div class="draw-group">
      <h3>🧹 操作</h3>
      <div class="draw-actions">
        <button type="button" id="btn-undo" class="action-btn" title="撤销 (Ctrl+Z)">↩️ 撤销</button>
        <button type="button" id="btn-redo" class="action-btn" title="重做 (Ctrl+Y)">↪️ 重做</button>
        <button type="button" id="btn-clear" class="action-btn danger" title="清空画板">🗑️ 清空</button>
      </div>
    </div>

    <div class="draw-group" style="margin-top: auto;">
      <button type="button" id="btn-save" class="save-btn">⬇️ 保存图片</button>
    </div>

  </aside>

  <!-- 画板区域 -->
  <section class="draw-canvas-area">
    <div class="canvas-wrapper" id="canvas-wrapper">
      <canvas id="canvas-base"></canvas>
      <canvas id="canvas-top"></canvas>
    </div>
  </section>
</main>

<script src="../../js/draw.js" defer></script>
</body>
</html>
