<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端资源测速模拟器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/speed-sim-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>⏱️ 前端测速模拟器</h1>
  <p>模拟不同网络环境下的资源瀑布流加载耗时。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="ss-layout" style="padding-top: 0;">
  <div class="ss-container">
    <!-- 左侧配置 -->
    <aside class="ss-sidebar">
      <h3>1. 网络环境</h3>
      <div class="ss-row">
        <label>网络预设</label>
        <select id="ss-network">
          <option value="4g">4G (10Mbps / 50ms)</option>
          <option value="3g" selected>3G (1.5Mbps / 200ms)</option>
          <option value="slow3g">慢速 3G (400Kbps / 400ms)</option>
          <option value="wifi">Wi-Fi (50Mbps / 10ms)</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="ss-row"><label>带宽 (Mbps)</label><input type="number" id="ss-bw" value="1.5" step="0.1"></div>
      <div class="ss-row"><label>RTT 延迟 (ms)</label><input type="number" id="ss-rtt" value="200"></div>

      <h3>2. 资源列表</h3>
      <div id="ss-res-list" class="ss-res-list"></div>
      <button id="btn-add-res" class="ss-btn">➕ 添加资源</button>
      <button id="btn-simulate" class="ss-btn primary" style="margin-top: 10px; width: 100%;">▶️ 开始模拟</button>
    </aside>

    <!-- 右侧图表 -->
    <div class="ss-main">
      <div class="ss-header">
        <span>资源名称</span>
        <span class="ss-time-ruler" id="ss-time-ruler"></span>
      </div>
      <div class="ss-waterfall" id="ss-waterfall">
        <!-- 渲染区域 -->
      </div>
      <div id="ss-summary" class="ss-summary"></div>
    </div>
  </div>
</main>
<script src="../../js/speed-sim-tool.js" defer></script>
</body>
</html>
