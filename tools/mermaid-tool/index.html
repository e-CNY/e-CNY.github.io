<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流程图实时渲染 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/mermaid-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="mm-layout">
  <div class="mm-container">
    
    <!-- 左侧代码区 -->
    <div class="mm-col">
      <div class="mm-toolbar">
        <select id="mm-sample" class="mm-select">
          <option value="flow">流程图 (Flowchart)</option>
          <option value="sequence">时序图 (Sequence)</option>
          <option value="mindmap">脑图 (Mindmap)</option>
          <option value="gantt">甘特图 (Gantt)</option>
          <option value="state">状态图 (State)</option>
          <option value="class">类图 (Class)</option>
          <option value="er">实体关系图 (ER)</option>
          <option value="pie">饼图 (Pie)</option>
        </select>
        <select id="mm-theme" class="mm-select" style="flex: 0 0 100px;">
          <option value="default">默认</option>
          <option value="dark">暗黑</option>
          <option value="forest">森林</option>
          <option value="neutral">中性</option>
        </select>
        <label class="mm-checkbox-label">
          <input type="checkbox" id="mm-auto-render" checked> 实时渲染
        </label>
        <button id="btn-render" class="mm-btn primary">🔄 渲染</button>
      </div>
      
      <div class="mm-editor-wrap">
        <textarea id="mm-code" class="mm-textarea" spellcheck="false" placeholder="在此输入 Mermaid 代码..."></textarea>
        <div class="mm-editor-actions">
          <button id="btn-download-mmd" class="mm-mini-btn">💾 下载源码</button>
          <button id="btn-clear-code" class="mm-mini-btn danger">🗑️ 清空</button>
        </div>
      </div>
    </div>

    <!-- 右侧预览区 -->
    <div class="mm-col">
      <div class="mm-preview-header">
        <span>👁️ 实时预览</span>
        <div class="mm-preview-actions">
          <button id="btn-zoom-in" class="mm-icon-btn" title="放大">➕</button>
          <button id="btn-zoom-out" class="mm-icon-btn" title="缩小">➖</button>
          <button id="btn-zoom-reset" class="mm-icon-btn" title="重置缩放">🔄</button>
          <button id="btn-fullscreen" class="mm-icon-btn" title="全屏查看">⛶</button>
          <span class="mm-divider">|</span>
          <button id="btn-download-svg" class="mm-btn">⬇️ SVG</button>
          <button id="btn-download-png" class="mm-btn">⬇️ PNG</button>
        </div>
      </div>
      
      <div class="mm-preview-wrap" id="preview-wrap">
        <div id="mm-preview" class="mermaid"></div>
        <div id="mm-error" class="mm-error-overlay" style="display: none;">
          <div style="font-size:2rem; margin-bottom:10px;">⚠️</div>
          <div class="err-msg">语法错误</div>
        </div>
      </div>
    </div>
    
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/mermaid.min.js"></script>
<script src="../../js/mermaid-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
