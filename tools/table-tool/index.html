<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表格处理工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/table-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📊 表格处理工具</h1>
  <p>支持 Excel / CSV 解析与在线编辑，双击单元格即可修改内容。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="tt-layout" style="padding-top: 0;">
  <div class="tt-container">
    <div class="tt-sidebar">
      <div class="tt-section">
        <h3>1. 上传表格</h3>
        <div id="tt-drop-zone" class="tt-drop-zone">
          <span>📁 点击或拖拽文件</span>
          <span class="tt-hint">支持 .csv / .xlsx / .xls</span>
        </div>
        <input id="tt-input" type="file" accept=".csv,.xlsx,.xls" hidden>
      </div>

      <div class="tt-section">
        <h3>2. 在线编辑</h3>
        <button id="btn-add-row" class="tt-btn" disabled>➕ 在末尾添加行</button>
        <button id="btn-add-col" class="tt-btn" disabled>➕ 在末尾添加列</button>
        <button id="btn-clear" class="tt-btn danger" disabled>🗑️ 清空表格</button>
      </div>

      <div class="tt-section">
        <h3>3. 导出下载</h3>
        <button id="btn-export-csv" class="tt-btn" disabled>导出为 CSV</button>
        <button id="btn-export-json" class="tt-btn" disabled>导出为 JSON</button>
        <button id="btn-export-xlsx" class="tt-btn" disabled>导出为 Excel</button>
      </div>
    </div>

    <div class="tt-main">
      <div class="tt-toolbar">
        <span id="tt-status">等待上传文件或直接编辑...</span>
      </div>
      <div class="tt-preview-wrap" id="tt-table-wrap">
        <table id="tt-preview-table" class="tt-table"></table>
      </div>
    </div>
  </div>
</main>
<script src="../../js/libs/xlsx.full.min.js"></script>
<script src="../../js/table-tool.js" defer></script>
</body>
</html>
