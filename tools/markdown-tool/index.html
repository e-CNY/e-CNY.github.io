<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 编辑器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="../../css/markdown-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📝 Markdown 编辑器</h1>
  <p>完整 GFM 语法、公式支持，支持导出 MD / Word / PDF / HTML。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="md-layout" style="padding-top: 0;">
  <div class="md-toolbar">
    <div class="md-actions-left">
      <button id="btn-extract-toc" class="md-btn">📑 提取目录</button>
      <button id="btn-clear" class="md-btn">🗑️ 清空</button>
    </div>
    <div class="md-actions-right">
      <button id="btn-export-md" class="md-btn primary">导出 .md</button>
      <button id="btn-export-html" class="md-btn primary">导出 HTML</button>
      <button id="btn-export-word" class="md-btn primary">导出 Word</button>
      <button id="btn-export-pdf" class="md-btn primary">导出 PDF</button>
    </div>
  </div>
  
  <div class="md-container">
    <div class="md-col">
      <textarea id="md-input" spellcheck="false" placeholder="在此输入 Markdown..."></textarea>
    </div>
    <div class="md-col">
      <div id="md-preview" class="markdown-body"></div>
    </div>
  </div>
</main>
<script src="../../js/libs/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="../../js/libs/html2pdf.bundle.min.js"></script>
<script src="../../js/markdown-tool.js" defer></script>
</body>
</html>
