<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>结构化数据工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/json-toolbox.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
  .jt-layout { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .ts-toolbar-options { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #fdf8ec; padding: 8px 12px; border-radius: 6px; border: 1px solid #d5c7a8; flex: 1; }
  .ts-toolbar-options label { font-size: 0.85rem; color: #3d3226; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .ts-toolbar-options input[type="text"], .ts-toolbar-options select { padding: 4px 8px; border: 1px solid #d5c7a8; border-radius: 4px; font-size: 0.85rem; outline: none; }
</style>
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="jt-layout">
  <div class="jt-main">
    <nav class="jt-sidebar">
      <div class="jt-nav-group">
        <h3>转换与格式化</h3>
        <button class="jt-nav-btn active" data-target="panel-json">JSON 格式化/排序</button>
        <button class="jt-nav-btn" data-target="panel-yaml">YAML ↔ JSON</button>
        <button class="jt-nav-btn" data-target="panel-xml">XML ↔ JSON</button>
        <button class="jt-nav-btn" data-target="panel-toml">TOML ↔ JSON</button>
        <button class="jt-nav-btn" data-target="panel-csv">JSON ↔ CSV</button>
        <button class="jt-nav-btn" data-target="panel-sql">JSON 转 SQL</button>
        <button class="jt-nav-btn" data-target="panel-bson">BSON / Base64</button>
      </div>
      <div class="jt-nav-group">
        <h3>查询与校验</h3>
        <button class="jt-nav-btn" data-target="panel-jsonpath">JSONPath 查询</button>
        <button class="jt-nav-btn" data-target="panel-jmespath">JMESPath 查询</button>
        <button class="jt-nav-btn" data-target="panel-pointer">JSON Pointer</button>
        <button class="jt-nav-btn" data-target="panel-schema">JSON Schema 校验</button>
      </div>
      <div class="jt-nav-group">
        <h3>对比与视图</h3>
        <button class="jt-nav-btn" data-target="panel-diff">JSON 差异对比</button>
        <button class="jt-nav-btn" data-target="panel-text-diff">文本差异对比</button>
        <button class="jt-nav-btn" data-target="panel-tree">JSON 树形视图</button>
      </div>
      <div class="jt-nav-group">
        <h3>生成与拓展</h3>
        <button class="jt-nav-btn" data-target="panel-form">JSON ↔ 表单</button>
        <button class="jt-nav-btn" data-target="panel-ts">JSON 转 TS 接口</button>
      </div>
    </nav>

    <section class="jt-workspace">
      <!-- 0. 通用隐藏文件输入 -->
      <input type="file" id="global-file-input" accept=".json,.txt,.yaml,.yml" hidden>

      <!-- 1. JSON 格式化 -->
      <div id="panel-json" class="jt-panel active">
        <div class="jt-toolbar">
          <button class="jt-btn" onclick="jsonFormat(2)">格式化 (2空格)</button>
          <button class="jt-btn" onclick="jsonFormat(4)">格式化 (4空格)</button>
          <button class="jt-btn" onclick="jsonMinify()">压缩</button>
          <button class="jt-btn" onclick="jsonSortKeys()">🔤 按字母排序键名</button>
          <button class="jt-btn" onclick="jsonEscape()">转义</button>
          <button class="jt-btn" onclick="jsonUnescape()">去转义</button>
          <button class="jt-btn" onclick="jsonToToml()">转 TOML</button>
        </div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入 JSON <span id="json-error-msg" class="jt-error-msg"></span>
              <span class="editor-actions">
                <button class="tool-mini-btn" onclick="importFile('json-input')">📂 导入</button>
                <button class="tool-mini-btn" onclick="clearInput('json-input')">🗑️ 清空</button>
              </span>
            </label>
            <textarea id="json-input" spellcheck="false" placeholder="粘贴 JSON 数据..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>输出结果
              <span class="editor-actions">
                <button class="tool-mini-btn" onclick="copyText('json-output')">📋 复制</button>
                <button class="tool-mini-btn" onclick="downloadText('json-output', 'data.json')">💾 下载</button>
              </span>
            </label>
            <textarea id="json-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 2. YAML <-> JSON -->
      <div id="panel-yaml" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="yamlToJson()">YAML 转 JSON</button><button class="jt-btn" onclick="jsonToYaml()">JSON 转 YAML</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入数据 <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('yaml-input')">🗑️</button></span></label>
            <textarea id="yaml-input" spellcheck="false" placeholder="粘贴 YAML 或 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>输出结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('yaml-output')">📋</button></span></label>
            <textarea id="yaml-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 3. XML <-> JSON -->
      <div id="panel-xml" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="xmlToJson()">XML 转 JSON</button><button class="jt-btn" onclick="jsonToXml()">JSON 转 XML</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入数据 <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('xml-input')">🗑️</button></span></label>
            <textarea id="xml-input" spellcheck="false" placeholder="粘贴 XML 或 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>输出结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('xml-output')">📋</button></span></label>
            <textarea id="xml-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 4. TOML <-> JSON -->
      <div id="panel-toml" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="tomlToJson()">TOML 转 JSON</button><button class="jt-btn" onclick="jsonToToml()">JSON 转 TOML</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入数据 <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('toml-input')">🗑️</button></span></label>
            <textarea id="toml-input" spellcheck="false" placeholder="粘贴 TOML 或 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>输出结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('toml-output')">📋</button></span></label>
            <textarea id="toml-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 5. JSON <-> CSV (新增) -->
      <div id="panel-csv" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="jsonToCsv()">JSON 转 CSV</button><button class="jt-btn" onclick="csvToJson()">CSV 转 JSON</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入数据 (JSON 数组 或 CSV 文本) <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('csv-input')">🗑️</button></span></label>
            <textarea id="csv-input" spellcheck="false" placeholder="粘贴 JSON 对象数组..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>输出结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('csv-output')">📋</button></span></label>
            <textarea id="csv-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 6. JSON 转 SQL (新增) -->
      <div id="panel-sql" class="jt-panel">
        <div class="jt-toolbar">
          <label style="font-size:.85rem; color:#6b5d47; display:flex; align-items:center; gap:4px;">表名：<input type="text" id="sql-table-name" value="my_table" class="jt-input" style="width:100px;"></label>
          <select id="sql-dialect" class="jt-input" style="flex:none; width:100px;">
            <option value="mysql">MySQL</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="sqlite">SQLite</option>
          </select>
          <button class="jt-btn" onclick="jsonToSql()">生成 INSERT 语句</button>
        </div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入 JSON (数组格式) <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('sql-input')">🗑️</button></span></label>
            <textarea id="sql-input" spellcheck="false" placeholder="[{&quot;id&quot;: 1, &quot;name&quot;: &quot;John&quot;}]"></textarea>
          </div>
          <div class="jt-editor-col">
            <label>SQL 输出 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('sql-output')">📋</button></span></label>
            <textarea id="sql-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 7. BSON / Base64 -->
      <div id="panel-bson" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="jsonToBase64()">JSON 转 Base64</button><button class="jt-btn" onclick="base64ToJson()">Base64 转 JSON</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入数据 <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('bson-input')">🗑️</button></span></label>
            <textarea id="bson-input" spellcheck="false" placeholder="输入 JSON 或 Base64..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>输出结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('bson-output')">📋</button></span></label>
            <textarea id="bson-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 8. JSONPath -->
      <div id="panel-jsonpath" class="jt-panel">
        <div class="jt-toolbar"><input type="text" id="jsonpath-query" class="jt-input" placeholder="输入 JSONPath，例如 $.store.book[*].author"><button class="jt-btn" onclick="runJsonPath()">查询</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入 JSON <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('jsonpath-input')">🗑️</button></span></label>
            <textarea id="jsonpath-input" spellcheck="false" placeholder="输入 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>查询结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('jsonpath-output')">📋</button></span></label>
            <textarea id="jsonpath-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 9. JMESPath -->
      <div id="panel-jmespath" class="jt-panel">
        <div class="jt-toolbar"><input type="text" id="jmespath-query" class="jt-input" placeholder="输入 JMESPath，例如 locations[?state == 'WA'].name"><button class="jt-btn" onclick="runJmesPath()">查询</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入 JSON <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('jmespath-input')">🗑️</button></span></label>
            <textarea id="jmespath-input" spellcheck="false" placeholder="输入 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>查询结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('jmespath-output')">📋</button></span></label>
            <textarea id="jmespath-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 10. JSON Pointer -->
      <div id="panel-pointer" class="jt-panel">
        <div class="jt-toolbar"><input type="text" id="pointer-query" class="jt-input" placeholder="输入 JSON Pointer，例如 /foo/0/bar"><button class="jt-btn" onclick="runJsonPointer()">定位</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入 JSON <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('pointer-input')">🗑️</button></span></label>
            <textarea id="pointer-input" spellcheck="false" placeholder="输入 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>定位结果 <span class="editor-actions"><button class="tool-mini-btn" onclick="copyText('pointer-output')">📋</button></span></label>
            <textarea id="pointer-output" spellcheck="false" readonly></textarea>
          </div>
        </div>
      </div>

      <!-- 11. JSON Schema -->
      <div id="panel-schema" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="validateSchema()">校验 JSON Schema</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入 JSON (待校验) <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('schema-json')">🗑️</button></span></label>
            <textarea id="schema-json" spellcheck="false" placeholder="输入待校验的 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>输入 Schema <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('schema-input')">🗑️</button></span></label>
            <textarea id="schema-input" spellcheck="false" placeholder="输入 JSON Schema..."></textarea>
          </div>
        </div>
        <div class="jt-output-box" id="schema-output" style="margin-top: 10px;"></div>
      </div>

      <!-- 12. JSON Diff -->
      <div id="panel-diff" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="runJsonDiff()">对比 JSON 差异</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>原始 JSON <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('diff-input-a')">🗑️</button></span></label>
            <textarea id="diff-input-a" spellcheck="false" placeholder="粘贴旧的 JSON..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>新的 JSON <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('diff-input-b')">🗑️</button></span></label>
            <textarea id="diff-input-b" spellcheck="false" placeholder="粘贴新的 JSON..."></textarea>
          </div>
        </div>
        <div class="jt-output-box" id="diff-output" style="margin-top: 10px; max-height: 300px;"></div>
      </div>

      <!-- 13. 文本 Diff -->
      <div id="panel-text-diff" class="jt-panel">
        <div class="jt-toolbar">
          <label style="font-size:.85rem; color:#6b5d47; display:flex; align-items:center; gap:4px;"><input type="checkbox" id="text-diff-ignore-case"> 忽略大小写</label>
          <label style="font-size:.85rem; color:#6b5d47; display:flex; align-items:center; gap:4px; margin-left:8px;"><input type="checkbox" id="text-diff-ignore-space"> 忽略空格</label>
          <button class="jt-btn" onclick="runTextDiff()" style="margin-left:auto;">对比文本差异</button>
          <button class="jt-btn" onclick="clearTextDiff()">清空</button>
        </div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>原始文本 (Old)</label>
            <div class="editor-wrapper">
              <div class="line-numbers" id="lines-old">1</div>
              <textarea id="text-diff-old" spellcheck="false" placeholder="粘贴旧的文本..."></textarea>
            </div>
          </div>
          <div class="jt-editor-col">
            <label>新的文本 (New)</label>
            <div class="editor-wrapper">
              <div class="line-numbers" id="lines-new">1</div>
              <textarea id="text-diff-new" spellcheck="false" placeholder="粘贴新的文本..."></textarea>
            </div>
          </div>
        </div>
        <div class="jt-output-box" id="text-diff-output" style="margin-top: 10px; max-height: 400px; padding: 0; overflow-y: auto;"></div>
      </div>

      <!-- 14. JSON 树形 -->
      <div id="panel-tree" class="jt-panel">
        <div class="jt-toolbar">
          <button class="jt-btn" onclick="renderTree()">生成树形视图</button>
          <button class="jt-btn" onclick="expandTree(true)">全部展开</button>
          <button class="jt-btn" onclick="expandTree(false)">全部折叠</button>
        </div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>输入 JSON <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('tree-input')">🗑️</button></span></label>
            <textarea id="tree-input" spellcheck="false" placeholder="粘贴 JSON..."></textarea>
          </div>
          <div class="jt-editor-col" style="background:#fff; border:1px solid #d5c7a8; border-radius:8px; padding:12px; overflow:auto;">
            <div id="tree-output" class="json-tree-view"></div>
          </div>
        </div>
      </div>

      <!-- 15. JSON 表单 -->
      <div id="panel-form" class="jt-panel">
        <div class="jt-toolbar"><button class="jt-btn" onclick="generateForm()">JSON 生成表单</button><button class="jt-btn" onclick="formToJson()">表单生成 JSON</button></div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>JSON 模板 <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('form-json')">🗑️</button></span></label>
            <textarea id="form-json" spellcheck="false" placeholder="输入 JSON..."></textarea>
          </div>
          <div class="jt-editor-col" style="background:#fff; border:1px solid #d5c7a8; border-radius:8px; padding:16px; overflow:auto;"><div id="form-container" class="json-form-container"></div></div>
        </div>
      </div>

      <!-- 16. JSON 转 TS 接口 -->
      <div id="panel-ts" class="jt-panel">
        <div class="jt-toolbar">
          <div class="ts-toolbar-options">
            <label>根名称：<input type="text" id="ts-root-name" value="RootObject" placeholder="RootObject"></label>
            <label>类型：<select id="ts-style"><option value="interface">interface</option><option value="type">type</option></select></label>
            <label><input type="checkbox" id="ts-semicolon" checked> 分号 (;)</label>
            <label><input type="checkbox" id="ts-optional" checked> 可选 (? )</label>
          </div>
          <button class="jt-btn" onclick="generateTS()" style="background: #8a5a2b; color: #fff; border: none;">✨ 转换</button>
          <button class="jt-btn" onclick="copyText('ts-code-output')">📋 复制代码</button>
        </div>
        <div class="jt-editor-group">
          <div class="jt-editor-col">
            <label>JSON 数据 <button class="jt-btn" onclick="fillTSSample()" style="padding:2px 6px; font-size:.75rem; margin-left:8px;">填入示例</button> <span class="editor-actions"><button class="tool-mini-btn" onclick="clearInput('ts-json-input')">🗑️</button></span></label>
            <textarea id="ts-json-input" spellcheck="false" placeholder="在此粘贴 JSON 数据..."></textarea>
          </div>
          <div class="jt-editor-col">
            <label>TypeScript 接口</label>
            <textarea id="ts-code-output" spellcheck="false" readonly placeholder="生成的 TS 代码将显示在这里..."></textarea>
          </div>
        </div>
      </div>

    </section>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/js-yaml.min.js"></script>
<script src="../../js/libs/jsonpath.min.js"></script>
<script src="../../js/libs/jmespath.min.js"></script>
<script src="../../js/libs/ajv.min.js"></script>
<script src="../../js/libs/diff.min.js"></script>
<script src="../../js/json-toolbox.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
