<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字体预览与信息 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/font-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🔤 字体预览与信息</h1>
  <p>上传本地 TTF / OTF 文件，实时预览排版并读取元信息。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="ft-layout" style="padding-top: 0;">
  <div class="ft-container">
    <aside class="ft-sidebar">
      <div id="ft-drop-zone" class="ft-drop-zone">
        <span>📁 点击或拖拽字体文件</span>
        <span class="ft-hint">支持 .ttf / .otf / .woff</span>
        <input id="ft-input" type="file" accept=".ttf,.otf,.woff,.woff2" hidden>
      </div>
      
      <div class="ft-info" id="ft-info" style="display: none;">
        <h3>字体信息</h3>
        <p>文件名: <b id="ft-name">-</b></p>
        <p>大小: <b id="ft-size">-</b></p>
      </div>

      <div class="ft-controls">
        <div class="ft-row">
          <label>预览字号</label>
          <input type="range" id="ft-font-size" min="12" max="96" value="32">
          <span id="ft-size-val">32px</span>
        </div>
      </div>
    </aside>

    <div class="ft-main">
      <div class="ft-preview-wrap">
        <div id="ft-preview" class="ft-preview" style="font-size: 32px;">
          <p>The quick brown fox jumps over the lazy dog.</p>
          <p>0123456789 !@#$%^&*()</p>
          <p>中文字体预览效果：落霞与孤鹜齐飞，秋水共长天一色。</p>
          <p>床前明月光，疑是地上霜。举头望明月，低头思故乡。</p>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../js/font-tool.js" defer></script>
</body>
</html>
