<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据密码生成器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/generator-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="gn-layout">
  <!-- 顶栏 -->
  <div class="gn-topbar">
    <div class="gn-top-actions">
      <button class="gn-icon-btn" id="btn-history" type="button" title="生成历史">📜 历史 <span id="history-count">0</span></button>
</div>
  </div>

  <div class="gn-grid">

    <!-- ============ 1. 高级 ID ============ -->
    <div class="gn-card">
      <h2>
        <span>🆔 高级 ID 生成</span>
        <span class="gn-hint-tag">加密安全随机</span>
      </h2>
      <div class="gn-id-list" id="id-list"></div>
    </div>

    <!-- ============ 2. 随机 Mock ============ -->
    <div class="gn-card">
      <h2>
        <span>🧪 随机测试数据</span>
        <span class="gn-hint-tag">点击即复制</span>
      </h2>
      <div class="gn-mock-filters" id="mock-filters"></div>
      <div class="gn-mock-list" id="mock-list"></div>
    </div>

    <!-- ============ 3. 密码 ============ -->
    <div class="gn-card gn-card-full">
      <h2>
        <span>🔑 安全密码生成</span>
        <span class="gn-hint-tag">Shannon 熵计算</span>
      </h2>
      <div class="gn-pwd-grid">
        <div class="gn-pwd-left">
          <div class="gn-row">
            <label>长度</label>
            <input type="range" id="pwd-len" min="4" max="128" value="16">
            <span class="gn-pwd-len-val" id="pwd-len-val">16</span>
          </div>
          <div class="gn-checkboxes">
            <label><input type="checkbox" id="pwd-upper" checked> 大写 <code>A-Z</code></label>
            <label><input type="checkbox" id="pwd-lower" checked> 小写 <code>a-z</code></label>
            <label><input type="checkbox" id="pwd-num" checked> 数字 <code>0-9</code></label>
            <label><input type="checkbox" id="pwd-sym" checked> 符号 <code>!@#$</code></label>
          </div>
          <div class="gn-checkboxes">
            <label><input type="checkbox" id="pwd-no-ambiguous" checked> 排除易混 <code>O0lI1</code></label>
            <label><input type="checkbox" id="pwd-no-similar"> 排除常见符号 <code>`'"|</code></label>
            <label><input type="checkbox" id="pwd-require-all" checked> 强制各类型至少 1 个</label>
          </div>
          <div class="gn-row">
            <label>排除字符</label>
            <input type="text" id="pwd-exclude" class="gn-input gn-input-sm" placeholder="额外排除的字符">
          </div>
          <div class="gn-row">
            <label>批量生成</label>
            <div class="gn-seg" id="pwd-batch-seg">
              <button data-count="1" class="active" type="button">1 个</button>
              <button data-count="5" type="button">5 个</button>
              <button data-count="10" type="button">10 个</button>
            </div>
          </div>
          <button id="btn-gen-pwd" class="gn-btn primary gn-btn-block" type="button">🎲 生成密码</button>
        </div>
        <div class="gn-pwd-right">
          <div class="gn-pwd-outputs" id="pwd-outputs"></div>
        </div>
      </div>
    </div>

    <!-- ============ 4. Diceware 短语 ============ -->
    <div class="gn-card gn-card-full">
      <h2>
        <span>🔐 Diceware 密码短语</span>
        <span class="gn-hint-tag">1200+ 词库</span>
      </h2>
      <div class="gn-pwd-grid">
        <div class="gn-pwd-left">
          <div class="gn-row">
            <label>单词数</label>
            <select id="phrase-words" class="gn-select">
              <option value="3">3 词 · 40 bits</option>
              <option value="4" selected>4 词 · 53 bits</option>
              <option value="5">5 词 · 66 bits</option>
              <option value="6">6 词 · 79 bits</option>
              <option value="7">7 词 · 92 bits</option>
            </select>
          </div>
          <div class="gn-row">
            <label>分隔符</label>
            <select id="phrase-sep" class="gn-select">
              <option value="-">连字符 -</option>
              <option value=".">点号 .</option>
              <option value="_">下划线 _</option>
              <option value=" ">空格</option>
              <option value="">无分隔</option>
            </select>
          </div>
          <div class="gn-checkboxes">
            <label><input type="checkbox" id="phrase-cap" checked> 首字母大写</label>
            <label><input type="checkbox" id="phrase-number"> 末尾加数字</label>
            <label><input type="checkbox" id="phrase-symbol"> 末尾加符号</label>
          </div>
          <button id="btn-gen-phrase" class="gn-btn primary gn-btn-block" type="button">🎲 生成短语</button>
        </div>
        <div class="gn-pwd-right">
          <div class="gn-pwd-outputs" id="phrase-outputs"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- 历史抽屉 -->
<div class="gn-drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="gn-drawer" id="drawer">
  <div class="gn-drawer-head">
    <h3>📜 生成历史</h3>
    <button class="gn-icon-btn" id="drawer-close" type="button">✕</button>
  </div>
  <div class="gn-drawer-list" id="drawer-list"></div>
  <div class="gn-drawer-actions">
    <button class="gn-btn gn-btn-danger" id="clear-history" type="button">🗑 清空历史</button>
  </div>
</aside>

<div class="gn-toast" id="gn-toast"></div>

<script src="../../js/generator-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
