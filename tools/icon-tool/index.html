<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图标符号Emoji · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/icon-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="ic-layout" style="padding-top: 0;">

  <!-- 工具栏 -->
  <div class="ic-toolbar">
    <div class="ic-search-wrap">
      <input type="text" id="ic-search" class="ic-search"
             placeholder="搜索名称 / 关键词 / Unicode 码点，或直接粘贴字符…">
      <button type="button" class="ic-search-clear" id="ic-search-clear" title="清空">×</button>
    </div>

    <div class="ic-tools">
      <div class="ic-tool-group">
        <label>复制格式</label>
        <select id="ic-copy-format" class="ic-select">
          <option value="char">字符</option>
          <option value="cp">Unicode 码点</option>
          <option value="htmlD">HTML 十进制</option>
          <option value="htmlH">HTML 十六进制</option>
          <option value="css">CSS 转义</option>
          <option value="js">JS 转义</option>
          <option value="url">URL 编码</option>
        </select>
      </div>
      <div class="ic-tool-group">
        <label>视图</label>
        <button type="button" class="ic-mini ic-view-btn active" data-view="grid">网格</button>
        <button type="button" class="ic-mini ic-view-btn" data-view="list">列表</button>
      </div>
      <div class="ic-tool-group">
        <label>大小</label>
        <button type="button" class="ic-mini ic-size-btn" data-size="sm">小</button>
        <button type="button" class="ic-mini ic-size-btn active" data-size="md">中</button>
        <button type="button" class="ic-mini ic-size-btn" data-size="lg">大</button>
      </div>
      <button type="button" class="ic-btn" id="ic-random">🎲 随机</button>
    </div>
  </div>

  <div class="ic-stats">共 <b id="ic-count">0</b> 个图标</div>

  <div class="ic-tabs" id="ic-categories"></div>

  <div class="ic-grid" id="ic-grid" data-size="md"></div>
</main>

<!-- 详情弹窗 -->
<div class="ic-modal" id="ic-modal">
  <div class="ic-modal-content" id="ic-modal-content">
    <button type="button" class="ic-modal-close" id="ic-modal-close" title="关闭">×</button>
    <div class="ic-modal-header">
      <div class="ic-modal-char" id="ic-modal-char">?</div>
      <div class="ic-modal-title">
        <h3 id="ic-modal-name">—</h3>
        <p id="ic-modal-cp">—</p>
      </div>
    </div>
    <div class="ic-modal-actions">
      <button type="button" id="ic-modal-fav">☆ 收藏</button>
      <button type="button" id="ic-modal-png">📥 导出 PNG</button>
    </div>
    <div class="ic-fmt-list" id="ic-fmt-list"></div>
  </div>
</div>

<script src="../../js/icon-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
