<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图标与 Emoji 工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/icon-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🔣 图标与 Emoji</h1>
  <p>收录常用开发与设计 Emoji，一键检索并复制 Unicode 或 HTML 代码。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="ic-layout" style="padding-top: 0;">
  <div class="ic-search-wrap">
    <input type="text" id="ic-search" class="ic-search" placeholder="搜索图标名称（如 笑脸, 代码, 箭头）或直接输入字符...">
  </div>

  <div class="ic-tabs" id="ic-categories">
    <button class="ic-cat active" data-cat="all">全部</button>
    <button class="ic-cat" data-cat="face">表情</button>
    <button class="ic-cat" data-cat="tech">开发与技术</button>
    <button class="ic-cat" data-cat="nature">自然</button>
    <button class="ic-cat" data-cat="symbol">符号</button>
    <button class="ic-cat" data-cat="object">物品</button>
  </div>

  <div class="ic-grid" id="ic-grid">
    <!-- JS 生成图标卡片 -->
  </div>
</main>
<script src="../../js/icon-tool.js" defer></script>
</body>
</html>
