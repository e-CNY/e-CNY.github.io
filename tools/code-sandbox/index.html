<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码沙盒预览器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/code-sandbox.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="cs-layout">
  <div class="cs-toolbar">
    <div class="cs-group">
      <button id="btn-run" class="cs-btn primary">▶️ 运行代码 (Ctrl+S)</button>
      <button id="btn-clear" class="cs-btn danger">🗑️ 清空全部</button>
    </div>
    <div class="cs-group">
      <button id="btn-download-merge" class="cs-btn">📦 导出单文件 HTML</button>
      <button id="btn-download-zip" class="cs-btn">📁 打包下载 ZIP</button>
    </div>
  </div>
  
  <div class="cs-container">
    <!-- 代码编辑区 -->
    <div class="cs-editors">
      <div class="cs-col">
        <div class="cs-tab-header">
          <span class="active">HTML</span>
          <button class="cs-copy-btn" data-target="ed-html">📋 复制</button>
        </div>
        <div class="cs-editor-wrap">
          <div class="cs-line-nums" id="nums-html">1</div>
          <textarea id="ed-html" class="cs-editor" spellcheck="false" placeholder="<h1>Hello World</h1>"></textarea>
        </div>
      </div>
      
      <div class="cs-col">
        <div class="cs-tab-header">
          <span class="active">CSS</span>
          <button class="cs-copy-btn" data-target="ed-css">📋 复制</button>
        </div>
        <div class="cs-editor-wrap">
          <div class="cs-line-nums" id="nums-css">1</div>
          <textarea id="ed-css" class="cs-editor" spellcheck="false" placeholder="body { color: red; }"></textarea>
        </div>
      </div>
      
      <div class="cs-col">
        <div class="cs-tab-header">
          <span class="active">JS</span>
          <button class="cs-copy-btn" data-target="ed-js">📋 复制</button>
        </div>
        <div class="cs-editor-wrap">
          <div class="cs-line-nums" id="nums-js">1</div>
          <textarea id="ed-js" class="cs-editor" spellcheck="false" placeholder="console.log('Hello');"></textarea>
        </div>
      </div>
    </div>

    <!-- 预览与控制台区 -->
    <div class="cs-preview-area">
      <div class="cs-preview-box">
        <div class="cs-tab-header">
          <span style="color:#7ba05b; font-weight:bold;">👁️ 预览</span>
          <button id="btn-refresh-preview" class="cs-copy-btn" style="color:#2563eb; font-weight:bold;">🔄 刷新</button>
        </div>
        <iframe id="preview-frame" class="cs-preview"></iframe>
      </div>
      
      <div class="cs-console-box">
        <div class="cs-tab-header" style="background:#1e1e1e; border-bottom-color:#333;">
          <span style="color:#fff;">💻 控制台</span>
          <button id="btn-clear-console" class="cs-copy-btn" style="color:#aaa;">🗑️ 清空</button>
        </div>
        <div id="console-output" class="cs-console"></div>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/jszip.min.js"></script>
<script src="../../js/code-sandbox.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
