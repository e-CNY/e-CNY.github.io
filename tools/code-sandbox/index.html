<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线代码沙盒 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/code-sandbox.css">
</head>
<body>
<header class="tool-page-header">
  <h1>💻 在线代码沙盒</h1>
  <p>HTML / CSS / JS 实时预览，纯前端运行。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="cs-layout" style="padding-top: 0;">
  <div class="cs-toolbar">
    <button id="btn-run" class="cs-btn primary">▶️ 运行代码</button>
    <button id="btn-clear" class="cs-btn">🗑️ 清空预览</button>
  </div>
  
  <div class="cs-container">
    <div class="cs-col">
      <div class="cs-tab-header">
        <span class="active">HTML</span>
      </div>
      <textarea id="ed-html" class="cs-editor" spellcheck="false" placeholder="<h1>Hello World</h1>"></textarea>
    </div>
    <div class="cs-col">
      <div class="cs-tab-header">
        <span class="active">CSS</span>
      </div>
      <textarea id="ed-css" class="cs-editor" spellcheck="false" placeholder="body { color: red; }"></textarea>
    </div>
    <div class="cs-col">
      <div class="cs-tab-header">
        <span class="active">JS</span>
      </div>
      <textarea id="ed-js" class="cs-editor" spellcheck="false" placeholder="console.log('Hello');"></textarea>
    </div>
    <div class="cs-col">
      <div class="cs-tab-header">
        <span class="active" style="color:#7ba05b;">预览</span>
      </div>
      <iframe id="preview-frame" class="cs-preview"></iframe>
    </div>
  </div>
</main>
<script src="../../js/code-sandbox.js" defer></script>
</body>
</html>
