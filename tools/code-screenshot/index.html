<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码截图美化器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/code-screenshot.css">
<!-- 高亮主题样式 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📸 代码截图美化器</h1>
  <p>一键将代码转化为极客风精美截图，支持高亮与多种背景。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="cs-layout" style="padding-top: 0;">
  <div class="cs-container">
    <!-- 左侧配置 -->
    <aside class="cs-sidebar">
      <div class="cs-section">
        <label>选择语言</label>
        <select id="cs-language" class="cs-select">
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="json">JSON</option>
        </select>
      </div>

      <div class="cs-section">
        <label>背景渐变风格</label>
        <div class="cs-colors">
          <button class="cs-color-btn active" style="background: linear-gradient(to right, #7ba05b, #4a90e2);" data-bg="linear-gradient(135deg, #7ba05b, #4a90e2)"></button>
          <button class="cs-color-btn" style="background: linear-gradient(to right, #f1c40f, #e67e22);" data-bg="linear-gradient(135deg, #f1c40f, #e67e22)"></button>
          <button class="cs-color-btn" style="background: linear-gradient(to right, #a8452a, #8e44ad);" data-bg="linear-gradient(135deg, #a8452a, #8e44ad)"></button>
          <button class="cs-color-btn" style="background: linear-gradient(to right, #2d3748, #1a202c);" data-bg="linear-gradient(135deg, #2d3748, #1a202c)"></button>
        </div>
      </div>

      <div class="cs-section">
        <label>窗口样式</label>
        <div class="cs-options">
          <label><input type="checkbox" id="cs-show-dots" checked> 显示 Mac 按钮</label>
          <label><input type="checkbox" id="cs-show-shadow" checked> 添加阴影</label>
        </div>
      </div>

      <button id="btn-generate" class="cs-btn primary">📸 生成截图</button>
    </aside>

    <!-- 右侧工作区 -->
    <div class="cs-main">
      <div class="cs-editor-wrap">
        <textarea id="cs-input" spellcheck="false" placeholder="在此粘贴代码..."></textarea>
      </div>
      
      <!-- 截图预览区 (生成时显示) -->
      <div id="cs-preview-area" class="cs-preview-area" style="display:none;">
        <div id="capture-target" class="capture-target">
          <div class="mac-header" id="mac-header">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="lang-label" id="lang-label">javascript</span>
          </div>
          <pre><code id="code-preview" class="hljs"></code></pre>
        </div>
        <button id="btn-download" class="cs-btn download-btn">⬇️ 下载高清图片</button>
      </div>
    </div>
  </div>
</main>
<script src="../../js/libs/highlight.min.js"></script>
<script src="../../js/libs/html2canvas.min.js"></script>
<script src="../../js/code-screenshot.js" defer></script>
</body>
</html>
