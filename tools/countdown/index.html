<!-- tools/countdown/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倒数日与纪念日 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/countdown.css">
</head>
<body>
<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="cd-page">

<div class="cd-app">
    <!-- 顶部工具栏 -->
    <div class="toolbar">
      <div style="flex:1;"></div>
      <button class="ghost-btn" id="importBtn" type="button">📥 导入备份</button>
      <button class="ghost-btn" id="exportBtn" type="button">📤 导出备份</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>

    <!-- 添加 / 编辑表单 -->
    <section class="add-panel" id="addPanel">
      <div class="panel-header">
        <h2 id="formTitle">添加重要日子</h2>
        <button class="cancel-edit-btn" id="cancelEditBtn" type="button" style="display:none;">✖ 取消编辑</button>
      </div>
      
      <div class="add-row">
        <div class="field grow">
          <label for="eventName">事件名称</label>
          <input type="text" id="eventName" placeholder="例如：女朋友生日、考研初试" maxlength="30">
        </div>
        <div class="field">
          <label for="eventDate">目标日期</label>
          <input type="date" id="eventDate">
        </div>
        <div class="field">
          <label for="eventType">类型</label>
          <select id="eventType">
            <option value="countdown">倒数日（未来）</option>
            <option value="countup">正数日（已过去）</option>
            <option value="yearly">每年重复（生日 / 周年）</option>
          </select>
        </div>
      </div>
      <div class="add-row">
        <div class="field grow">
          <label for="eventNote">备注（可选）</label>
          <input type="text" id="eventNote" placeholder="例如：别忘了准备惊喜" maxlength="50">
        </div>
        <button class="btn-primary" id="addBtn" type="button">＋ 添加事件</button>
      </div>
      
      <div class="quick-tags">
        <span class="quick-label">快捷一键添加：</span>
        <button class="quick-tag" data-name="元旦" data-date="1-1" type="button">🎊 元旦</button>
        <button class="quick-tag" data-name="情人节" data-date="2-14" type="button">💕 情人节</button>
        <button class="quick-tag" data-name="妇女节" data-date="3-8" type="button">🌸 妇女节</button>
        <button class="quick-tag" data-name="愚人节" data-date="4-1" type="button">🤡 愚人节</button>
        <button class="quick-tag" data-name="劳动节" data-date="5-1" type="button">🛠️ 劳动节</button>
        <button class="quick-tag" data-name="儿童节" data-date="6-1" type="button">🧒 儿童节</button>
        <button class="quick-tag" data-name="建党节" data-date="7-1" type="button">🚩 建党节</button>
        <button class="quick-tag" data-name="建军节" data-date="8-1" type="button">🎖️ 建军节</button>
        <button class="quick-tag" data-name="教师节" data-date="9-10" type="button">📚 教师节</button>
        <button class="quick-tag" data-name="国庆节" data-date="10-1" type="button">🇨🇳 国庆节</button>
        <button class="quick-tag" data-name="平安夜" data-date="12-24" type="button">🎄 平安夜</button>
        <button class="quick-tag" data-name="圣诞节" data-date="12-25" type="button">🎁 圣诞节</button>
      </div>
    </section>

    <!-- 事件列表 -->
    <section class="list-panel">
      <div class="list-head">
        <h2>📌 全部事件 <span class="count" id="eventCount">0</span></h2>
        <div class="seg" id="sortSeg">
          <button data-value="upcoming" class="active" type="button">即将到来</button>
          <button data-value="passed" type="button">已过去</button>
          <button data-value="created" type="button">添加时间</button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
      <p class="empty-tip" id="emptyTip" hidden>
        🎯 还没有记录，用上方表单添加第一个重要日子吧！
      </p>
    </section>

    <p class="tips">💡 数据保存在浏览器本地，清理浏览器数据会丢失记录，请定期导出备份。</p>
  </div>

  <!-- 分享卡片弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal-body">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
      <h3 class="modal-title">📤 分享卡片</h3>
      <div class="modal-canvas-wrap" id="modalCanvasWrap"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="downloadBtn" type="button">💾 保存图片</button>
        <button class="btn-ghost" id="copyShareBtn" type="button">📋 复制图片</button>
      </div>
      <p class="modal-tip">手机端可长按上方图片直接保存</p>
    </div>
  </div>

  <!-- 自定义确认弹窗 -->
  <div class="confirm-mask" id="confirmModal" hidden>
    <div class="confirm-body">
      <h3 id="confirmTitle">提示</h3>
      <p id="confirmMsg">确定要执行此操作吗？</p>
      <div class="confirm-actions">
        <button class="ghost-btn" id="confirmCancel">取消</button>
        <button class="primary-btn" id="confirmOk" style="background:#c0392b;">确认</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/countdown.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
