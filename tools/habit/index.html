<!-- tools/habit/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>习惯打卡热力图 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/habit.css">
</head>
<body>
<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="habit-page">

<div class="habit-app">
    <!-- 概览 -->
    <section class="overview-grid" id="overviewGrid"></section>

    <!-- 顶部操作栏 -->
    <div class="toolbar">
      <button class="primary-btn" id="addHabitBtn" type="button">＋ 添加习惯</button>
      <div class="toolbar-right">
        <div class="dropdown">
          <button class="ghost-btn dropdown-toggle" type="button">📤 导出 ▼</button>
          <div class="dropdown-menu">
            <button id="exportJsonBtn" type="button">📄 导出 JSON 备份</button>
            <button id="exportMdBtn" type="button">📝 导出 Markdown 表格</button>
          </div>
        </div>
        <button class="ghost-btn" id="importBtn" type="button">📥 导入数据</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <!-- 习惯列表 -->
    <div class="habit-list" id="habitList"></div>
    <p class="empty-tip" id="emptyTip" hidden>
      🌱 还没有习惯，点击「＋ 添加习惯」开始记录第一个好习惯！
    </p>

    <p class="tips">💡 数据保存在浏览器本地。清理浏览器数据会丢失记录，建议定期点击右上角导出备份。</p>
  </div>

  <!-- 添加 / 编辑习惯 Modal -->
  <div class="modal-mask" id="habitModal" hidden>
    <div class="modal-body">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
      <h3 class="modal-title" id="modalTitle">添加习惯</h3>

      <div class="modal-section">
        <label class="modal-label">习惯名称</label>
        <input type="text" id="habitName" placeholder="例如：早起、跑步、读书…" maxlength="20" autocomplete="off">
      </div>

      <div class="modal-section">
        <div class="modal-label" style="display:flex; justify-content:space-between; align-items:center;">
          <span>图标</span>
          <label class="custom-emoji-label">
            ✏️ 自定义: <input type="text" id="customEmojiInput" maxlength="2" placeholder="输入 Emoji">
          </label>
        </div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="modal-section">
        <label class="modal-label">主题颜色</label>
        <div class="color-row" id="colorRow"></div>
        <div class="custom-color-wrap" style="margin-top:8px;">
          <label class="custom-emoji-label">
            🎨 自定义色: <input type="color" id="customColorInput" value="#8a5a2b">
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button class="ghost-btn" id="cancelBtn" type="button">取消</button>
        <button class="primary-btn" id="saveBtn" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 自定义确认弹窗 -->
  <div class="confirm-mask" id="confirmModal" hidden>
    <div class="confirm-body">
      <h3 id="confirmTitle">提示</h3>
      <p id="confirmMsg">确定要执行此操作吗？</p>
      <div class="confirm-actions">
        <button class="ghost-btn" id="confirmCancel">取消</button>
        <button class="primary-btn" id="confirmOk" style="background:#c0392b;">确认</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>
<div id="heatmap-tooltip" class="heatmap-tooltip" style="display:none;"></div>

<script src="../../js/habit.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
