<!-- tools/habit/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>习惯打卡 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/habit.css">
</head>
<body>
<main class="habit-page">
  <header class="tool-page-header" style="padding: 12px 16px 8px;">
    <h1>🔥 习惯打卡</h1>
    <p>每日好习惯追踪 / 连续天数 / GitHub 风格热力图 / 完全本地保存</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="habit-app">
    <!-- 概览 -->
    <section class="overview-grid" id="overviewGrid"></section>

    <!-- 顶部操作栏 -->
    <div class="toolbar">
      <button class="primary-btn" id="addHabitBtn" type="button">＋ 添加习惯</button>
      <div class="toolbar-right">
        <div class="dropdown">
          <button class="ghost-btn dropdown-toggle" type="button">📤 导出 ▼</button>
          <div class="dropdown-menu">
            <button id="exportJsonBtn" type="button">📄 导出 JSON 备份</button>
            <button id="exportMdBtn" type="button">📝 导出 Markdown 表格</button>
          </div>
        </div>
        <button class="ghost-btn" id="importBtn" type="button">📥 导入数据</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <!-- 习惯列表 -->
    <div class="habit-list" id="habitList"></div>
    <p class="empty-tip" id="emptyTip" hidden>
      🌱 还没有习惯，点击「＋ 添加习惯」开始记录第一个好习惯！
    </p>

    <p class="tips">💡 数据保存在浏览器本地。清理浏览器数据会丢失记录，建议定期点击右上角导出备份。</p>
  </div>

  <!-- 添加 / 编辑习惯 Modal -->
  <div class="modal-mask" id="habitModal" hidden>
    <div class="modal-body">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
      <h3 class="modal-title" id="modalTitle">添加习惯</h3>

      <div class="modal-section">
        <label class="modal-label">习惯名称</label>
        <input type="text" id="habitName" placeholder="例如：早起、跑步、读书…" maxlength="20" autocomplete="off">
      </div>

      <div class="modal-section">
        <div class="modal-label" style="display:flex; justify-content:space-between; align-items:center;">
          <span>图标</span>
          <label class="custom-emoji-label">
            ✏️ 自定义: <input type="text" id="customEmojiInput" maxlength="2" placeholder="输入 Emoji">
          </label>
        </div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="modal-section">
        <label class="modal-label">主题颜色</label>
        <div class="color-row" id="colorRow"></div>
        <div class="custom-color-wrap" style="margin-top:8px;">
          <label class="custom-emoji-label">
            🎨 自定义色: <input type="color" id="customColorInput" value="#8a5a2b">
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button class="ghost-btn" id="cancelBtn" type="button">取消</button>
        <button class="primary-btn" id="saveBtn" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 自定义确认弹窗 -->
  <div class="confirm-mask" id="confirmModal" hidden>
    <div class="confirm-body">
      <h3 id="confirmTitle">提示</h3>
      <p id="confirmMsg">确定要执行此操作吗？</p>
      <div class="confirm-actions">
        <button class="ghost-btn" id="confirmCancel">取消</button>
        <button class="primary-btn" id="confirmOk" style="background:#c0392b;">确认</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>
<div id="heatmap-tooltip" class="heatmap-tooltip" style="display:none;"></div>

<script src="../../js/habit.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
