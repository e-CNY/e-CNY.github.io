<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 生成器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/css-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎛️ CSS 生成器</h1>
  <p>可视化调节阴影、圆角、渐变，直接复制代码。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="cs-layout" style="padding-top: 0;">
  <div class="cs-tabs">
    <button class="cs-tab active" data-target="panel-shadow">Box Shadow</button>
    <button class="cs-tab" data-target="panel-radius">Border Radius</button>
    <button class="cs-tab" data-target="panel-gradient">线性渐变</button>
  </div>

  <div class="cs-content">
    <!-- 1. 阴影 -->
    <div id="panel-shadow" class="cs-panel active">
      <div class="cs-grid">
        <div class="cs-controls">
          <div class="cs-row"><label>X 偏移</label><input type="range" id="sh-x" min="-50" max="50" value="10"><span id="val-sh-x">10px</span></div>
          <div class="cs-row"><label>Y 偏移</label><input type="range" id="sh-y" min="-50" max="50" value="10"><span id="val-sh-y">10px</span></div>
          <div class="cs-row"><label>模糊半径</label><input type="range" id="sh-blur" min="0" max="100" value="20"><span id="val-sh-blur">20px</span></div>
          <div class="cs-row"><label>扩散半径</label><input type="range" id="sh-spread" min="-50" max="50" value="0"><span id="val-sh-spread">0px</span></div>
          <div class="cs-row"><label>颜色 / 透明度</label><input type="color" id="sh-color" value="#000000"><input type="range" id="sh-opacity" min="0" max="1" step="0.01" value="0.2"></div>
        </div>
        <div class="cs-preview">
          <div class="cs-box" id="preview-shadow"></div>
          <textarea class="cs-code" id="code-shadow" readonly></textarea>
        </div>
      </div>
    </div>

    <!-- 2. 圆角 -->
    <div id="panel-radius" class="cs-panel">
      <div class="cs-grid">
        <div class="cs-controls">
          <div class="cs-row"><label>统一圆角</label><input type="range" id="rd-all" min="0" max="100" value="20"><span id="val-rd-all">20px</span></div>
        </div>
        <div class="cs-preview">
          <div class="cs-box" id="preview-radius"></div>
          <textarea class="cs-code" id="code-radius" readonly></textarea>
        </div>
      </div>
    </div>

    <!-- 3. 渐变 -->
    <div id="panel-gradient" class="cs-panel">
      <div class="cs-grid">
        <div class="cs-controls">
          <div class="cs-row"><label>角度</label><input type="range" id="gr-angle" min="0" max="360" value="45"><span id="val-gr-angle">45deg</span></div>
          <div class="cs-row"><label>起始颜色</label><input type="color" id="gr-c1" value="#8a5a2b"></div>
          <div class="cs-row"><label>结束颜色</label><input type="color" id="gr-c2" value="#7ba05b"></div>
        </div>
        <div class="cs-preview">
          <div class="cs-box" id="preview-gradient"></div>
          <textarea class="cs-code" id="code-gradient" readonly></textarea>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../js/css-tool.js" defer></script>
</body>
</html>
