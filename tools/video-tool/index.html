<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频截图工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/video-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎬 视频截图工具</h1>
  <p>读取视频信息、精确到帧的 Canvas 截图下载。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="vt-layout" style="padding-top: 0;">
  <div id="vt-drop-zone" class="vt-drop-zone">
    <span>📁 点击或拖拽视频文件</span>
    <span class="vt-hint">支持 mp4 / webm 等浏览器支持的格式</span>
    <input id="vt-input" type="file" accept="video/*" hidden>
  </div>

  <div id="vt-workspace" class="vt-workspace" style="display: none;">
    <div class="vt-video-wrap">
      <video id="vt-video" controls crossorigin="anonymous"></video>
    </div>
    
    <div class="vt-info">
      <p>分辨率: <b id="vt-res">0 x 0</b></p>
      <p>时长: <b id="vt-duration">0s</b></p>
    </div>

    <div class="vt-controls">
      <label>拖动进度条精准截图:</label>
      <input type="range" id="vt-timeline" min="0" max="100" step="0.1" value="0">
      <div class="vt-row">
        <button id="vt-capture" class="vt-btn primary">📸 立即截取当前帧</button>
      </div>
    </div>

    <div class="vt-preview-area">
      <canvas id="vt-canvas" style="display: none;"></canvas>
    </div>
  </div>
</main>
<script src="../../js/video-tool.js" defer></script>
</body>
</html>
