<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乐器调音节拍器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/tuner-metronome.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="tm-layout">
  <!-- Tabs -->
  <div class="tm-tabs">
    <button class="tm-tab active" data-target="panel-tuner">🎸 乐器调音器</button>
    <button class="tm-tab" data-target="panel-metronome">🥁 节拍器</button>
  </div>

  <!-- ================= 调音器 ================= -->
  <div id="panel-tuner" class="tm-panel active">
    <div class="tn-card">
      <div class="tn-header">
        <select id="tn-instrument" class="tn-select">
          <option value="guitar">木吉他 / 电吉他 (6弦)</option>
          <option value="ukulele">乌克丽丽 (4弦)</option>
          <option value="bass">贝斯 (4弦)</option>
          <option value="violin">小提琴 (4弦)</option>
          <option value="cello">大提琴 (4弦)</option>
          <option value="mandolin">曼陀林 (8弦/4组)</option>
          <option value="banjo">5弦班卓琴</option>
        </select>
        
        <div class="tn-a4-group">
          <label>A4 = </label>
          <input type="number" id="tn-a4" value="440" min="430" max="450" step="1">
          <span>Hz</span>
        </div>

        <button id="btn-start-tuner" class="tn-btn primary">🎤 开启麦克风</button>
      </div>

      <!-- 参考音 -->
      <div class="tn-reference">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <label style="margin:0;">🔊 参考音发声 (点击持续发声，再次点击停止)</label>
          <button id="btn-stop-ref" class="tn-mini-btn" style="display:none;">🛑 停止参考音</button>
        </div>
        <div class="tn-ref-buttons" id="tn-ref-buttons"></div>
      </div>

      <div class="tn-display">
        <div class="tn-string" id="tn-target-string">请先开启麦克风或点击参考音</div>
        
        <!-- 仪表盘 -->
        <div class="tn-dial">
          <div class="tn-center"></div>
          <div class="tn-ticks">
            <span>-50</span><span>-25</span><span>0</span><span>+25</span><span>+50</span>
          </div>
          <div class="tn-needle" id="tn-needle"></div>
        </div>

        <!-- 音分指示器 -->
        <div class="tn-cents-bar-wrap">
          <div class="tn-cents-bar" id="tn-cents-bar"></div>
        </div>
        
        <div class="tn-info">
          <div>当前频率: <b id="tn-freq">0.00 Hz</b></div>
          <div>目标音高: <b id="tn-target-note">-</b></div>
          <div>偏差: <b id="tn-cents" style="color:#8a7a5f;">0 音分</b></div>
        </div>
        <div class="tn-status" id="tn-status">等待输入声音...</div>
      </div>
    </div>
  </div>

  <!-- ================= 节拍器 ================= -->
  <div id="panel-metronome" class="tm-panel">
    <div class="mt-card">
      <div class="mt-top">
        <div class="mt-bpm-box">
          <label>BPM</label>
          <input type="number" id="mt-bpm" value="120" min="40" max="240" class="mt-bpm-input">
        </div>
        <input type="range" id="mt-bpm-slider" min="40" max="240" value="120" class="mt-slider">
      </div>

      <div class="mt-controls">
        <div class="mt-row">
          <label>拍号</label>
          <select id="mt-time-sig" class="mt-select">
            <option value="1">1 / 4 拍</option>
            <option value="2">2 / 4 拍</option>
            <option value="3">3 / 4 拍</option>
            <option value="4" selected>4 / 4 拍</option>
            <option value="5">5 / 4 拍</option>
            <option value="7">7 / 8 拍</option>
            <option value="3_8">3 / 8 拍 (圆舞曲)</option>
            <option value="6_8">6 / 8 拍</option>
          </select>
        </div>
        <div class="mt-row">
          <label>音色</label>
          <select id="mt-sound" class="mt-select">
            <option value="beep">电子哔声</option>
            <option value="wood">木头敲击</option>
            <option value="kick">底鼓 (Kick)</option>
            <option value="snare">军鼓 (Snare)</option>
          </select>
        </div>
        <div class="mt-row">
          <label>音量</label>
          <input type="range" id="mt-vol" min="0" max="1" step="0.05" value="0.5" style="width:100px;">
        </div>
      </div>

      <!-- 视觉节拍指示器 -->
      <div class="mt-visualizer" id="mt-visualizer"></div>

      <div class="mt-action-row">
        <button id="btn-toggle-metronome" class="mt-btn primary">▶️ 启动</button>
        <button id="btn-tap-tempo" class="mt-btn tap-btn" title="连续点击4次以上可测算BPM">👆 Tap Tempo</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/Tone.js"></script>
<script src="../../js/tuner-metronome.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
