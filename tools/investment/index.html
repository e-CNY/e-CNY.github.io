<!-- tools/investment/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资复利计算器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/investment.css">
</head>
<body>
<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="inv-page">

<div class="inv-app">
    <!-- 输入区 -->
    <section class="input-section">
      <div class="preset-row">
        <span class="preset-label">快捷预设</span>
        <button class="preset-btn" data-preset="conservative" type="button">🛡️ 保守 4%</button>
        <button class="preset-btn" data-preset="balanced" type="button">⚖️ 平衡 7%</button>
        <button class="preset-btn" data-preset="aggressive" type="button">🚀 激进 10%</button>
      </div>

      <div class="input-grid">
        <div class="field">
          <label for="initialPrincipal">初始本金</label>
          <div class="input-unit">
            <input type="number" id="initialPrincipal" value="10000" min="0" step="1000" inputmode="numeric">
            <span>元</span>
          </div>
        </div>
        <div class="field">
          <label for="regularInvest">定期投入</label>
          <div class="input-unit">
            <input type="number" id="regularInvest" value="2000" min="0" step="100" inputmode="numeric">
            <span>元 / <span id="investUnit">月</span></span>
          </div>
        </div>
        <div class="field">
          <label for="annualReturn">年化收益率</label>
          <div class="input-unit">
            <input type="number" id="annualReturn" value="7" min="0" max="50" step="0.1" inputmode="decimal">
            <span>%</span>
          </div>
        </div>
        <div class="field">
          <label for="years">投资年限</label>
          <div class="input-unit">
            <input type="number" id="years" value="20" min="1" max="60" step="1" inputmode="numeric">
            <span>年</span>
          </div>
          <input type="range" id="yearsRange" min="1" max="60" value="20" aria-label="投资年限滑块">
        </div>
      </div>

      <details class="advanced">
        <summary>⚙️ 高级选项（投入频率 / 通胀率 / 管理费 / 定投增长 / 情景对比 / 目标反推）</summary>

        <div class="input-grid">
          <div class="field">
            <label>投入频率</label>
            <div class="seg" id="freqSeg">
              <button data-value="monthly" class="active" type="button">每月</button>
              <button data-value="yearly" type="button">每年</button>
              <button data-value="once" type="button">一次性</button>
            </div>
          </div>
          <div class="field">
            <label for="inflationRate">年均通胀率</label>
            <div class="input-unit">
              <input type="number" id="inflationRate" value="3" min="0" max="20" step="0.1" inputmode="decimal">
              <span>%</span>
            </div>
          </div>
          <div class="field">
            <label for="feeRate">年管理费率</label>
            <div class="input-unit">
              <input type="number" id="feeRate" value="0" min="0" max="10" step="0.1" inputmode="decimal">
              <span>% / 年</span>
            </div>
          </div>
          <div class="field">
            <label for="investGrowth">定投年增长率</label>
            <div class="input-unit">
              <input type="number" id="investGrowth" value="0" min="-20" max="30" step="0.5" inputmode="decimal">
              <span>% / 年</span>
            </div>
          </div>
        </div>

        <div class="adv-toggle-row">
          <label class="adv-check">
            <input type="checkbox" id="scenarioToggle">
            <span>显示悲观 / 乐观情景对比</span>
          </label>
          <div class="scenario-delta-wrap" id="scenarioDeltaWrap" hidden>
            <span>波动幅度</span>
            <input type="number" id="scenarioDelta" value="3" min="0" max="20" step="0.5" inputmode="decimal">
            <span>± %</span>
          </div>
        </div>

        <div class="input-grid" style="margin-top:12px">
          <div class="field">
            <label for="targetAmount">目标金额（可选，用于反推年限）</label>
            <div class="input-unit">
              <input type="number" id="targetAmount" value="0" min="0" step="10000" inputmode="numeric">
              <span>元</span>
            </div>
          </div>
        </div>

        <p class="adv-tip">💡 通胀率用于计算"实际购买力"；管理费按年从资产中扣除；定投增长率表示每年投入比上一年增加的比例；目标金额 &gt; 0 时会反推达成所需年数</p>
      </details>

      <div class="input-actions">
        <button class="primary-btn" id="calcBtn" type="button">📊 开始计算</button>
        <button class="ghost-btn" id="resetBtn" type="button">↩️ 重置</button>
      </div>
    </section>

    <!-- 结果区 -->
    <section class="result-section" id="resultSection" hidden>
      <div class="summary-grid" id="summaryGrid"></div>

      <div class="chart-card">
        <div class="chart-head">
          <h2>📈 资产增长曲线</h2>
          <div class="chart-tools">
            <div class="chart-legend">
              <span><i class="dot principal"></i> 本金累积</span>
              <span><i class="dot asset"></i> 总资产</span>
              <span><i class="dot real"></i> 通胀调整后</span>
              <span class="scenario-legend" hidden><i class="dot optimistic"></i> 乐观</span>
              <span class="scenario-legend" hidden><i class="dot pessimistic"></i> 悲观</span>
            </div>
            <button class="ghost-btn xs" id="scaleBtn" type="button">切换对数坐标</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="growthChart"></canvas>
          <div class="chart-tooltip" id="chartTooltip" hidden></div>
        </div>
      </div>

      <div class="schedule-card">
        <div class="schedule-head">
          <h2>📋 逐年明细</h2>
          <button class="ghost-btn sm" id="exportBtn" type="button">📤 导出 CSV</button>
        </div>
        <div class="table-wrap">
          <table class="schedule-table" id="scheduleTable">
            <thead>
              <tr>
                <th>年末</th>
                <th>本年投入</th>
                <th>累计本金</th>
                <th>本年收益</th>
                <th>累计收益</th>
                <th>本年管理费</th>
                <th>年末总资产</th>
                <th>通胀调整后</th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </div>

      <p class="disclaimer">⚠️ 以上结果为复利公式估算，实际收益受市场波动影响可能严重偏离。本工具不构成投资建议。</p>
    </section>
  </div>
</main>
<script src="../../js/investment.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
