<!-- tools/investment/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>复利 · 投资收益计算器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/investment.css">
</head>
<body>
<main class="inv-page">
  <header class="tool-page-header">
    <h1>💰 复利 · 投资收益计算器</h1>
    <p>初始本金 / 定期定投 / 复利增长 / 通胀调整 / 年化 IRR / 逐年明细 / 增长曲线</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="inv-app">
    <!-- 输入区 -->
    <section class="input-section">
      <div class="input-grid">
        <div class="field">
          <label for="initialPrincipal">初始本金</label>
          <div class="input-unit">
            <input type="number" id="initialPrincipal" value="10000" min="0" step="1000" inputmode="numeric">
            <span>元</span>
          </div>
        </div>
        <div class="field">
          <label for="regularInvest">定期投入</label>
          <div class="input-unit">
            <input type="number" id="regularInvest" value="2000" min="0" step="100" inputmode="numeric">
            <span>元 / <span id="investUnit">月</span></span>
          </div>
        </div>
        <div class="field">
          <label for="annualReturn">年化收益率</label>
          <div class="input-unit">
            <input type="number" id="annualReturn" value="7" min="0" max="50" step="0.1" inputmode="decimal">
            <span>%</span>
          </div>
        </div>
        <div class="field">
          <label for="years">投资年限</label>
          <div class="input-unit">
            <input type="number" id="years" value="20" min="1" max="60" step="1" inputmode="numeric">
            <span>年</span>
          </div>
        </div>
      </div>

      <details class="advanced">
        <summary>⚙️ 高级选项（投入频率 / 通胀率）</summary>
        <div class="input-grid">
          <div class="field">
            <label>投入频率</label>
            <div class="seg" id="freqSeg">
              <button data-value="monthly" class="active" type="button">每月投入</button>
              <button data-value="yearly" type="button">每年投入</button>
              <button data-value="once" type="button">仅一次性</button>
            </div>
          </div>
          <div class="field">
            <label for="inflationRate">年均通胀率</label>
            <div class="input-unit">
              <input type="number" id="inflationRate" value="3" min="0" max="20" step="0.1" inputmode="decimal">
              <span>%</span>
            </div>
          </div>
        </div>
        <p class="adv-tip">💡 通胀率用于计算"实际购买力"，3% 是较常见的长期通胀假设</p>
      </details>

      <div class="input-actions">
        <button class="primary-btn" id="calcBtn" type="button">📊 开始计算</button>
        <button class="ghost-btn" id="resetBtn" type="button">↩️ 重置</button>
      </div>
    </section>

    <!-- 结果区 -->
    <section class="result-section" id="resultSection" hidden>
      <!-- 摘要卡片 -->
      <div class="summary-grid" id="summaryGrid"></div>

      <!-- 图表 -->
      <div class="chart-card">
        <div class="chart-head">
          <h2>📈 资产增长曲线</h2>
          <div class="chart-legend">
            <span><i class="dot principal"></i> 本金累积</span>
            <span><i class="dot asset"></i> 总资产</span>
            <span><i class="dot real"></i> 通胀调整后</span>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="growthChart"></canvas>
        </div>
      </div>

      <!-- 明细表 -->
      <div class="schedule-card">
        <div class="schedule-head">
          <h2>📋 逐年明细</h2>
          <button class="ghost-btn sm" id="exportBtn" type="button">📤 导出 CSV</button>
        </div>
        <div class="table-wrap">
          <table class="schedule-table" id="scheduleTable">
            <thead>
              <tr>
                <th>年末</th>
                <th>本年投入</th>
                <th>累计本金</th>
                <th>本年收益</th>
                <th>累计收益</th>
                <th>年末总资产</th>
                <th>通胀调整后</th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </div>

      <p class="disclaimer">⚠️ 以上结果为复利公式估算，实际收益受市场波动影响可能严重偏离。本工具不构成投资建议。</p>
    </section>
  </div>
</main>
<script src="../../js/investment.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
