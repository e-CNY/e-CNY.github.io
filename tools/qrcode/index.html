<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二维码工具 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/qrcode.css">
</head>
<body>
<main class="qr-tool">
  <header class="qr-header">
    <h1>📱 二维码工具</h1>
    <p>本地生成与识别二维码，不上传任何数据。</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="qr-tabs">
    <button class="active" data-tab="gen">✨ 生成二维码</button>
    <button data-tab="scan">🔍 识别二维码</button>
  </div>

  <!-- 生成区 -->
  <section id="tab-gen" class="qr-panel active">
    <div class="qr-layout">
      <div class="qr-settings">
        <label class="qr-label">输入文字 / 网址</label>
        <textarea id="qr-text" class="qr-textarea" rows="4" placeholder="输入要生成的内容...">https://github.com</textarea>

        <div class="qr-row">
          <div class="qr-col">
            <label class="qr-label">点阵样式</label>
            <select id="qr-style" class="qr-select">
              <option value="square">经典方块</option>
              <option value="dot">圆点</option>
              <option value="rounded">圆角</option>
            </select>
          </div>
          <div class="qr-col">
            <label class="qr-label">容错率 (越高越易扫)</label>
            <select id="qr-ecc" class="qr-select">
              <option value="L">L (7%)</option>
              <option value="M">M (15%)</option>
              <option value="Q" selected>Q (25%)</option>
              <option value="H">H (30%)</option>
            </select>
          </div>
        </div>

        <div class="qr-row">
          <div class="qr-col">
            <label class="qr-label">前景色</label>
            <div class="qr-color-wrap"><input id="qr-color-fg" type="color" value="#3d3226"></div>
          </div>
          <div class="qr-col">
            <label class="qr-label">背景色</label>
            <div class="qr-color-wrap"><input id="qr-color-bg" type="color" value="#ffffff"></div>
          </div>
        </div>
      </div>

      <div class="qr-preview-area">
        <div class="qr-canvas-container"><canvas id="qr-canvas" width="400" height="400"></canvas></div>
        <button id="qr-download" class="qr-btn-primary">⬇️ 下载二维码图片</button>
      </div>
    </div>
  </section>

  <!-- 识别区 -->
  <section id="tab-scan" class="qr-panel">
    <div id="scan-drop-zone" class="qr-drop-zone">
      <span id="scan-status-text">📁 点击选择或拖拽二维码图片到这里</span>
      <span class="qr-hint">支持 JPG / PNG / WebP 等格式</span>
      <input id="scan-input" type="file" accept="image/*" hidden>
    </div>

    <div id="scan-result-area" class="qr-result-area" hidden>
      <label class="qr-label">识别结果</label>
      <div class="qr-result-box">
        <textarea id="scan-result-text" class="qr-textarea" rows="3" readonly></textarea>
        <div class="qr-result-actions">
          <a id="scan-result-link" href="#" target="_blank" class="qr-btn-link" hidden>🔗 打开链接</a>
          <button id="scan-copy" class="qr-btn-copy">📋 复制结果</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- 1. 生成库 -->
<script src="../../js/libs/qrcode.js"></script>
<!-- 2. 纯JS识别库 ZXing -->
<script src="../../js/libs/zxing.min.js"></script>
<!-- 3. 业务逻辑 -->
<script src="../../js/qrcode.js" defer></script>
</body>
</html>
