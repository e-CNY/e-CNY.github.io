<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>饼状图生成预览 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/chart-tool.css">
</head>
<body>
<header class="tool-page-header theme-header" style="padding: 12px 16px 8px;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions"><button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题"></button></div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->

  <h1>📉 饼状图生成预览</h1>
  <p>支持折线、柱状、饼图、雷达等 8 种图表，实时 JSON 渲染，一键导出。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="ch-layout">
  <div class="ch-container">
    
    <!-- 左侧配置面板 -->
    <aside class="ch-sidebar">
      <div class="ch-row">
        <label>图表类型</label>
        <select id="ch-type" class="ch-select">
          <option value="line">折线图 (Line)</option>
          <option value="bar">柱状图 (Bar)</option>
          <option value="pie">饼图 (Pie)</option>
          <option value="doughnut">环形图 (Doughnut)</option>
          <option value="radar">雷达图 (Radar)</option>
          <option value="polarArea">极地区域图 (PolarArea)</option>
          <option value="bubble">气泡图 (Bubble)</option>
          <option value="scatter">散点图 (Scatter)</option>
        </select>
      </div>

      <div class="ch-row">
        <label>颜色主题</label>
        <select id="ch-theme" class="ch-select">
          <option value="default">默认主题</option>
          <option value="morandi">莫兰迪色系</option>
          <option value="pastel">清新马卡龙</option>
          <option value="vivid">高对比鲜艳</option>
        </select>
      </div>

      <div class="ch-row checkbox-row">
        <label class="ch-checkbox-label">
          <input type="checkbox" id="ch-show-legend" checked> 显示图例
        </label>
        <label class="ch-checkbox-label">
          <input type="checkbox" id="ch-show-grid" checked> 显示网格
        </label>
      </div>

      <div class="ch-row" style="flex: 1; flex-direction: column; min-height: 0;">
        <div class="ch-label-bar">
          <label>数据配置 (JSON)</label>
          <div class="ch-mini-actions">
            <button class="ch-mini-btn" id="btn-format-json" title="格式化/美化代码">格式化</button>
            <button class="ch-mini-btn" id="btn-reset-json" title="重置当前类型的示例数据">重置</button>
          </div>
        </div>
        <textarea id="ch-data" class="ch-textarea" spellcheck="false"></textarea>
        <div id="ch-error" class="ch-error"></div>
      </div>

      <div class="ch-action-bar">
        <button id="btn-render" class="ch-btn primary" style="width: 100%;">▶️ 强制渲染</button>
        <button id="btn-download" class="ch-btn" style="width: 100%; margin-top: 8px; background:#fff;">💾 下载 PNG 图片</button>
      </div>
    </aside>

    <!-- 右侧图表预览区 -->
    <div class="ch-main">
      <div class="ch-canvas-wrap">
        <canvas id="myChart"></canvas>
      </div>
    </div>
    
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/chart.umd.min.js"></script>
<script src="../../js/chart-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
