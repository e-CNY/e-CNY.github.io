<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颜色处理工具箱 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/color-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="cl-layout">
  <!-- 顶栏 -->
  <div class="cl-topbar">
    <div class="cl-top-actions">
      <button class="cl-icon-btn" id="btn-random" type="button" title="随机颜色">🎲 随机</button>
      <button class="cl-icon-btn" id="btn-fav" type="button" title="收藏当前颜色">⭐ 收藏</button>
      <button class="cl-icon-btn" id="btn-history" type="button" title="收藏与历史">
        📜 历史 <span id="history-count">0</span>
      </button>
</div>
  </div>

  <!-- 颜色转换 -->
  <div class="cl-card cl-card-full">
    <h2>
      <span>🎨 颜色转换</span>
      <span class="cl-hint-tag">支持任意格式输入</span>
    </h2>
    <div class="cl-color-bar">
      <div class="cl-color-preview" id="color-preview" style="background:#7ba05b">
        <input type="color" id="color-picker" value="#7ba05b" title="点击拾色">
      </div>
      <div class="cl-color-info">
        <div class="cl-main-input-wrap">
          <input type="text" id="cl-input" class="cl-main-input" value="#7BA05B" autocomplete="off"
                 placeholder="#7BA05B / rgb(123,160,91) / hsl(91,28%,49%) / red">
          <span class="cl-name-badge" id="color-name"></span>
        </div>
        <div class="cl-format-list" id="format-list"></div>
      </div>
    </div>
  </div>

  <!-- WCAG 对比度 -->
  <div class="cl-card">
    <h2>
      <span>♿ WCAG 对比度</span>
      <span class="cl-hint-tag">WCAG 2.1</span>
    </h2>
    <div class="cl-wcag-config">
      <div class="cl-wcag-picker">
        <label>前景</label>
        <input type="color" id="fg-color" value="#333333">
        <span id="fg-hex" class="cl-hex-mini">#333333</span>
      </div>
      <button class="cl-swap-btn" id="btn-swap" type="button" title="交换">⇄</button>
      <div class="cl-wcag-picker">
        <label>背景</label>
        <input type="color" id="bg-color" value="#ffffff">
        <span id="bg-hex" class="cl-hex-mini">#ffffff</span>
      </div>
    </div>

    <div class="cl-wcag-demo" id="wcag-demo">
      <div class="cl-wcag-sample-large">大文本 (24px) Sample</div>
      <div class="cl-wcag-sample-normal">正常文本 (14px) Sample text 123</div>
    </div>

    <div class="cl-wcag-result" id="wcag-result"></div>
  </div>

  <!-- 色盲模拟 -->
  <div class="cl-card">
    <h2>
      <span>👁️ 色盲模拟</span>
      <span class="cl-hint-tag">Brettel 近似</span>
    </h2>
    <div class="cl-blind-list" id="blind-list"></div>
  </div>

  <!-- 配色方案 -->
  <div class="cl-card cl-card-full">
    <h2>
      <span>🌈 配色方案</span>
      <span class="cl-hint-tag">点击色块可应用</span>
    </h2>
    <div class="cl-scheme-list" id="scheme-list"></div>
  </div>

  <!-- 色阶 -->
  <div class="cl-card cl-card-full">
    <h2>
      <span>📊 深浅色阶</span>
      <span class="cl-hint-tag">11 级 · 点击应用</span>
    </h2>
    <div class="cl-shades" id="shades"></div>
  </div>

  <!-- 图片取色 -->
  <div class="cl-card cl-card-full">
    <h2>
      <span>🖼️ 图片取色</span>
      <span class="cl-hint-tag">上传图片 · 鼠标悬浮取色</span>
    </h2>
    <div class="cl-img-controls">
      <label class="cl-upload-btn">
        📁 上传图片
        <input type="file" id="img-input" accept="image/*" hidden>
      </label>
      <span class="cl-img-pick-info" id="img-pick-info">未上传图片</span>
    </div>
    <div class="cl-img-canvas-wrap" id="img-canvas-wrap" hidden>
      <canvas id="img-canvas"></canvas>
      <div class="cl-img-cursor" id="img-cursor" hidden></div>
    </div>
  </div>
</main>

<!-- 收藏 / 历史抽屉 -->
<div class="cl-drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="cl-drawer" id="drawer">
  <div class="cl-drawer-head">
    <h3>📜 收藏与历史</h3>
    <button class="cl-icon-btn" id="drawer-close" type="button">✕</button>
  </div>
  <div class="cl-drawer-section">
    <h4>⭐ 收藏</h4>
    <div class="cl-drawer-list" id="fav-list"></div>
  </div>
  <div class="cl-drawer-section">
    <h4>🕐 最近历史</h4>
    <div class="cl-drawer-list" id="history-list"></div>
  </div>
  <div class="cl-drawer-actions">
    <button class="cl-btn-danger" id="clear-history" type="button">🗑 清空历史</button>
  </div>
</aside>

<div class="cl-toast" id="cl-toast"></div>

<script src="../../js/color-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
