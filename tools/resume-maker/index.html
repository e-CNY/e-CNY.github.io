<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 简历 - 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/resume-maker.css">
</head>
<body class="rm-body">
<div class="tool-page-header rm-header">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions"><button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题"></button></div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->

  <h1>📋 Markdown 简历</h1>
  <p>左写右排，支持一键随机生成、头像上传与多格式导出</p>
  <a href="../../index.html">← 返回首页</a>
</div>

<main class="rm-wrap">
  <!-- 顶部操作栏 -->
  <div class="rm-toolbar">
    <div class="rm-toolbar-left">
      <button id="btn-random" class="secondary-btn">🎲 一键随机</button>
      <button id="btn-clear" class="secondary-btn">🗑️ 清空</button>
      
      <div class="rm-upload-avatar">
        <input type="file" id="avatar-input" accept="image/*" hidden>
        <button id="btn-upload-avatar" class="secondary-btn">🖼️ 上传头像</button>
      </div>

      <div class="rm-theme-group">
        <label>主题色：</label>
        <input type="color" id="theme-color" value="#2c3e50">
      </div>
      
      <div class="rm-slider-group">
        <label>字号：</label>
        <input type="range" id="font-scale" min="80" max="120" value="100">
        <label>行距：</label>
        <input type="range" id="line-scale" min="100" max="180" value="150">
      </div>
    </div>

    <div class="rm-toolbar-right">
      <div class="dropdown">
        <button class="primary-btn dropdown-toggle">💾 导出 ▼</button>
        <div class="dropdown-menu">
          <button id="btn-print">🖨️ 导出 PDF (打印)</button>
          <button id="btn-export-html">🌐 导出 HTML</button>
          <button id="btn-export-md">📄 下载 .md</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑器与预览区 -->
  <div class="rm-container">
    <!-- 左侧 Markdown 输入 -->
    <div class="rm-editor">
      <div class="rm-panel-header">
        <span>✍️ Markdown 编辑 <small>(支持 Tab 缩进)</small></span>
        <div class="rm-format-tools">
          <button data-insert="**" title="加粗">B</button>
          <button data-insert="*" title="斜体"><i>I</i></button>
          <button data-insert="# " title="标题">H</button>
          <button data-insert="- " title="无序列表">≡</button>
          <button data-insert="> " title="引用">”</button>
          <button data-insert="---\n" title="分割线">—</button>
        </div>
      </div>
      <textarea id="md-input" spellcheck="false" placeholder="在此输入 Markdown 内容..."></textarea>
    </div>

    <!-- 右侧 A4 纸预览 -->
    <div class="rm-preview-wrap">
      <div class="rm-preview-page" id="resume-page">
        <img id="resume-avatar" class="rm-avatar" style="display: none;" alt="头像">
        <div class="rm-preview-content" id="resume-content">
          <!-- 实时渲染内容 -->
        </div>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/resume-maker.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
