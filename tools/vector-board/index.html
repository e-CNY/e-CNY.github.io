<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高级矢量白板 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/vector-board.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🎨 高级矢量白板</h1>
  <p>拖拽添加形状、双击编辑文字，支持导出高清图片。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="vb-layout" style="padding-top: 0;">
  <div class="vb-toolbar">
    <button id="btn-rect" class="vb-btn">⬜ 矩形</button>
    <button id="btn-circle" class="vb-btn">⭕ 圆形</button>
    <button id="btn-text" class="vb-btn">🔤 文字</button>
    <button id="btn-delete" class="vb-btn danger">🗑️ 删除选中</button>
    <button id="btn-export" class="vb-btn primary">⬇️ 导出 PNG</button>
  </div>
  <div class="vb-canvas-wrap">
    <canvas id="c"></canvas>
  </div>
</main>
<script src="../../js/libs/fabric.min.js"></script>
<script src="../../js/vector-board.js" defer></script>
</body>
</html>
