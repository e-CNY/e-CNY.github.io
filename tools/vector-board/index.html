<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高级矢量图白板 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/vector-board.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="vb-layout" style="padding-top: 0;">
  <!-- 顶部工具栏 -->
  <div class="vb-toolbar">
    <div class="vb-tool-group">
      <button id="btn-pen" class="vb-btn">🖌️ 涂鸦</button>
      <button id="btn-pen-bezier" class="vb-btn" title="贝塞尔钢笔：单击落点、拖拽调曲线、Enter 结束、Esc 取消">✒️ 钢笔</button>
      <button id="btn-rect" class="vb-btn">⬜ 矩形</button>
      <button id="btn-circle" class="vb-btn">⭕ 圆形</button>
      <button id="btn-triangle" class="vb-btn">🔺 三角</button>
      <button id="btn-line" class="vb-btn">📏 直线</button>
      <button id="btn-text" class="vb-btn">🔤 文字</button>
    </div>

    <div class="vb-tool-group">
      <label class="vb-btn" style="cursor: pointer; margin: 0;">
        🖼️ 图片
        <input type="file" id="image-input" accept="image/*" hidden>
      </label>
      <label class="vb-btn" style="cursor: pointer; margin: 0;" title="导入 SVG 矢量文件">
        📥 SVG
        <input type="file" id="svg-input" accept=".svg,image/svg+xml" hidden>
      </label>
      <button id="btn-undo" class="vb-btn" title="撤销 (Ctrl+Z)">↩️</button>
      <button id="btn-redo" class="vb-btn" title="重做 (Ctrl+Y)">↪️</button>
      <button id="btn-delete" class="vb-btn danger" title="删除选中对象">🗑️</button>
    </div>

    <div class="vb-tool-group" style="border-right: none;">
      <span style="font-size:0.75rem;color:#8a7a5f;font-weight:bold;">布尔：</span>
      <button class="vb-btn icon-btn" data-bool="unite" title="合并">∪</button>
      <button class="vb-btn icon-btn" data-bool="subtract" title="减去">−</button>
      <button class="vb-btn icon-btn" data-bool="intersect" title="相交">∩</button>
      <button class="vb-btn icon-btn" data-bool="exclude" title="排除">⊕</button>
      <button id="btn-smooth-path" class="vb-btn" title="平滑选中路径">〰️ 平滑</button>
    </div>

    <div class="vb-tool-group">
      <button id="btn-grid" class="vb-btn">🔲 网格</button>
      <button id="btn-fullscreen" class="vb-btn">⛶ 全屏</button>
      <button id="btn-export" class="vb-btn primary">⬇️ 导出</button>
    </div>
  </div>

  <!-- 主体区域：画布 + 属性面板 -->
  <div class="vb-main">
    <div class="vb-canvas-wrap" id="canvas-wrap">
      <canvas id="c"></canvas>

      <!-- 浮动视图工具栏（interact.js 可拖拽） -->
      <div class="vb-float-tools" id="float-tools" title="可拖拽">
        <button class="vb-float-btn" id="float-zoom-out" title="缩小">−</button>
        <span class="vb-zoom-label" id="float-zoom-label">100%</span>
        <button class="vb-float-btn" id="float-zoom-in" title="放大">+</button>
        <button class="vb-float-btn" id="float-reset" title="重置视图">⟲</button>
        <button class="vb-float-btn" id="float-fit" title="适应窗口">⛶</button>
      </div>
    </div>

    <aside class="vb-sidebar" id="sidebar">
      <div class="vb-sidebar-empty" id="sidebar-empty">
        <p>👈 选择画布上的对象<br>或点击上方工具添加</p>
        <p style="font-size:0.75rem; color:#8a7a5f; margin-top:20px; line-height:1.6;">
          💡 快捷键：<br>
          空格+拖拽 平移画布<br>
          滚轮 缩放<br>
          Delete 删除<br>
          Ctrl+C/V 复制粘贴<br>
          Ctrl+Z/Y 撤销重做<br>
          <br>
          ✒️ 钢笔模式：<br>
          单击落点 / 拖拽调曲线<br>
          Enter 结束 / Esc 取消
        </p>
      </div>

      <div class="vb-sidebar-content" id="sidebar-content" style="display: none;">
        <h3 id="prop-title">对象属性</h3>

        <div class="prop-group">
          <label>填充颜色</label>
          <div class="prop-row">
            <input type="color" id="prop-fill">
            <button class="prop-btn" id="prop-fill-none">无</button>
          </div>
        </div>

        <div class="prop-group">
          <label>描边颜色</label>
          <div class="prop-row">
            <input type="color" id="prop-stroke">
            <input type="number" id="prop-stroke-width" min="0" max="50" value="0" style="width:50px;" title="线宽">
          </div>
        </div>

        <div class="prop-group">
          <label>不透明度</label>
          <div class="prop-row">
            <input type="range" id="prop-opacity" min="0" max="100" value="100">
            <span id="prop-opacity-val" style="width:30px; text-align:right; font-size:0.8rem;">100%</span>
          </div>
        </div>

        <div class="prop-group" id="prop-radius-group" style="display: none;">
          <label>圆角大小</label>
          <input type="range" id="prop-radius" min="0" max="100" value="0">
        </div>

        <div class="prop-group" id="prop-text-group" style="display: none;">
          <label>字体大小</label>
          <input type="number" id="prop-font-size" min="10" max="200" value="24">
        </div>

        <div class="prop-group">
          <label>图层顺序</label>
          <div class="prop-row layer-btns">
            <button id="btn-layer-up" title="上移一层">⬆️</button>
            <button id="btn-layer-down" title="下移一层">⬇️</button>
            <button id="btn-layer-top" title="置于顶层">⏫</button>
            <button id="btn-layer-bottom" title="置于底层">⏬</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- 导出弹窗 -->
  <div class="vb-modal" id="export-modal" style="display: none;">
    <div class="vb-modal-content">
      <h3>⬇️ 导出画布</h3>
      <div class="prop-group">
        <label>导出格式</label>
        <select id="export-format" class="vb-select">
          <option value="image/png">PNG (支持透明)</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/svg+xml">SVG (矢量图, Snap.svg)</option>
        </select>
      </div>
      <div class="prop-group">
        <label>导出倍数 (PNG/JPG)</label>
        <select id="export-scale" class="vb-select">
          <option value="1">1x 原始大小</option>
          <option value="2" selected>2x 高清</option>
          <option value="3">3x 超清</option>
        </select>
      </div>
      <div class="prop-group">
        <label class="checkbox-label" style="display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:normal; cursor:pointer; color:#3d3226; margin-bottom:4px;">
          <input type="checkbox" id="export-include-bg" checked style="accent-color: #8a5a2b; width:16px; height:16px;">
          导出包含白色背景
        </label>
        <label class="checkbox-label" style="display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:normal; cursor:pointer; color:#3d3226;">
          <input type="checkbox" id="export-include-grid" style="accent-color: #8a5a2b; width:16px; height:16px;">
          导出包含网格背景
        </label>
      </div>
      <div class="vb-modal-actions">
        <button class="vb-btn" id="btn-cancel-export">取消</button>
        <button class="vb-btn primary" id="btn-confirm-export">确认导出</button>
      </div>
    </div>
  </div>
</main>

<!-- 钢笔纸画布（fixed 定位，仅钢笔激活时显示） -->
<canvas id="pen-canvas"></canvas>

<div id="toast" class="toast"></div>

<script src="../../js/libs/fabric.min.js"></script>
<script src="../../js/libs/paper-full.min.js"></script>
<script src="../../js/libs/snap.svg-min.js"></script>
<script src="../../js/libs/interact.min.js"></script>
<script src="../../js/vector-board.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
