<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>硬件串口调试 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/serial-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🔌 硬件串口调试</h1>
  <p>纯浏览器连接 Arduino / ESP32，无需安装客户端（需 Chrome/Edge）。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="se-layout" style="padding-top: 0;">
  <div class="se-container">
    <aside class="se-sidebar">
      <div class="se-section">
        <h3>1. 连接设置</h3>
        <div class="se-row">
          <label>波特率</label>
          <select id="se-baudrate" class="se-select">
            <option value="9600">9600</option>
            <option value="115200" selected>115200</option>
          </select>
        </div>
        <button id="btn-connect" class="se-btn primary">🔌 连接串口</button>
        <button id="btn-disconnect" class="se-btn danger" disabled>❌ 断开</button>
      </div>
      
      <div class="se-section">
        <h3>2. 发送数据</h3>
        <input type="text" id="se-send-input" class="se-input" placeholder="输入要发送的指令...">
        <button id="btn-send" class="se-btn" disabled>发送</button>
      </div>
    </aside>

    <div class="se-main">
      <div class="se-terminal" id="se-terminal">等待连接...</div>
    </div>
  </div>
</main>
<script src="../../js/serial-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
