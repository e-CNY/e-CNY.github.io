<!-- tools/todo/index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办清单 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/todo.css">
</head>
<body>
<main class="todo-page">
  <header class="tool-page-header">
    <h1>✅ 待办清单</h1>
    <p>任务管理 · 分类标签 · 优先级 · 拖拽排序 · 本地保存</p>
    <a href="../../index.html">← 返回工具站</a>
  </header>

  <div class="todo-app">
    <div class="add-bar">
      <input id="newTask" type="text" placeholder="输入任务，按回车添加…" autocomplete="off" maxlength="200">
      <button id="addBtn" type="button">＋ 添加</button>
    </div>

    <div class="toolbar">
      <div class="toolbar-row">
        <div class="seg" id="statusFilters" role="tablist">
          <button data-status="all" class="active" type="button">全部</button>
          <button data-status="active" type="button">进行中</button>
          <button data-status="done" type="button">已完成</button>
        </div>
        <input id="search" type="search" placeholder="🔍 搜索任务…" autocomplete="off">
      </div>
      <div class="toolbar-row">
        <div class="cat-bar" id="catFilters"></div>
        <select id="sortBy" title="排序方式">
          <option value="order">手动排序</option>
          <option value="created">最新创建</option>
          <option value="priority">按优先级</option>
          <option value="due">按到期日</option>
        </select>
      </div>
    </div>

    <ul class="task-list" id="taskList"></ul>
    <p class="empty-tip" id="emptyTip" hidden></p>

    <div class="footer-bar">
      <div class="stats" id="stats"></div>
      <div class="footer-actions">
        <button id="importBtn" type="button">导入</button>
        <button id="exportBtn" type="button">导出</button>
        <button id="clearDoneBtn" type="button">清除已完成</button>
        <button id="clearAllBtn" type="button">全部清除</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </div>
</main>
<script src="../../js/todo.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
