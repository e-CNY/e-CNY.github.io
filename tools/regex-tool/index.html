<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正则与选择器测试 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/regex-tool.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🔍 正则与选择器测试</h1>
  <p>正则匹配高亮、CSS / XPath 测试、HTML 链接提取。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="rx-layout" style="padding-top: 0;">
  <div class="rx-tabs">
    <button class="rx-tab active" data-target="panel-regex">正则表达式</button>
    <button class="rx-tab" data-target="panel-css">CSS 选择器</button>
    <button class="rx-tab" data-target="panel-xpath">XPath 选择器</button>
    <button class="rx-tab" data-target="panel-extract">链接提取</button>
  </div>

  <div class="rx-content">
    <!-- 1. 正则表达式 -->
    <div id="panel-regex" class="rx-panel active">
      <div class="rx-row">
        <span class="rx-slash">/</span>
        <input type="text" id="rx-pattern" class="rx-input" placeholder="输入正则表达式">
        <span class="rx-slash">/</span>
        <input type="text" id="rx-flags" class="rx-input" style="max-width: 60px;" value="g" placeholder="修饰符">
      </div>
      <textarea id="rx-text" class="rx-textarea" rows="6" placeholder="在此粘贴要测试的文本..."></textarea>
      <button id="btn-regex" class="rx-btn primary">▶️ 执行匹配</button>
      <div class="rx-result-box">
        <p>匹配数量: <span id="rx-count">0</span></p>
        <div id="rx-highlight" class="rx-highlight-box"></div>
      </div>
    </div>

    <!-- 2. CSS 选择器 -->
    <div id="panel-css" class="rx-panel">
      <div class="rx-row">
        <input type="text" id="css-selector" class="rx-input" placeholder="输入 CSS 选择器，如 .class a 或 div#id">
        <button id="btn-css" class="rx-btn primary">查询</button>
      </div>
      <textarea id="css-html" class="rx-textarea" rows="6" placeholder="粘贴 HTML 源码..."></textarea>
      <div class="rx-result-box">
        <p>匹配数量: <span id="css-count">0</span></p>
        <div id="css-result" class="rx-highlight-box"></div>
      </div>
    </div>

    <!-- 3. XPath 选择器 -->
    <div id="panel-xpath" class="rx-panel">
      <div class="rx-row">
        <input type="text" id="xpath-selector" class="rx-input" placeholder="输入 XPath，如 //div[@class='test']">
        <button id="btn-xpath" class="rx-btn primary">查询</button>
      </div>
      <textarea id="xpath-html" class="rx-textarea" rows="6" placeholder="粘贴 HTML 源码..."></textarea>
      <div class="rx-result-box">
        <p>匹配数量: <span id="xpath-count">0</span></p>
        <div id="xpath-result" class="rx-highlight-box"></div>
      </div>
    </div>

    <!-- 4. 链接提取 -->
    <div id="panel-extract" class="rx-panel">
      <textarea id="ex-html" class="rx-textarea" rows="6" placeholder="粘贴网页 HTML 源码..."></textarea>
      <div class="rx-row">
        <button id="btn-extract-a" class="rx-btn primary">提取 a 标签</button>
        <button id="btn-extract-img" class="rx-btn primary">提取 img 标签</button>
      </div>
      <textarea id="ex-result" class="rx-textarea" rows="6" readonly placeholder="提取结果将显示在这里..."></textarea>
    </div>
  </div>
</main>
<script src="../../js/regex-tool.js" defer></script>
</body>
</html>
