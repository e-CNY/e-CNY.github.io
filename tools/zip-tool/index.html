<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件压缩与解压 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/zip-tool.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="zt-layout">
  <div class="zt-tabs">
    <button class="zt-tab active" data-target="panel-zip">📁 文件打包与解压</button>
    <button class="zt-tab" data-target="panel-gzip">🔤 文本 Gzip 压缩</button>
  </div>

  <div class="zt-content">
    <!-- ================= 文件打包与解压 ================= -->
    <div id="panel-zip" class="zt-panel active">
      <div class="zt-grid">
        
        <!-- 左侧：文件打包 -->
        <div class="zt-card">
          <h2>📁 文件打包</h2>
          <div id="zip-drop-zone" class="zt-drop-zone">
            <div class="zt-icon">📁</div>
            <span>点击 / 拖拽多个文件到此处</span>
            <span class="zt-hint">支持任意文件格式，将在本地进行打包</span>
            <input id="zip-input" type="file" multiple hidden>
          </div>
          
          <div class="zt-list-wrap">
            <ul id="zip-file-list" class="zt-file-list"></ul>
          </div>
          
          <div class="zt-row" style="margin-bottom: 12px; align-items: center; justify-content: space-between;">
            <div style="display:flex; align-items:center; gap:8px;">
              <label style="font-size: .85rem; color: #6b5d47; font-weight:bold;">格式:</label>
              <select id="zip-format" class="zt-select">
                <option value="zip">ZIP 压缩包 (.zip)</option>
                <option value="targz">Gzip 压缩的 TAR (.tar.gz)</option>
                <option value="tar">普通 TAR 归档 (.tar)</option>
              </select>
            </div>
            <span class="zt-total-size" id="zip-total-size"></span>
          </div>

          <button id="btn-zip-pack" class="zt-btn primary" disabled>📦 打包并下载</button>
        </div>
        
        <!-- 右侧：解包 -->
        <div class="zt-card">
          <h2>📂 解压 ZIP 文件</h2>
          <div class="zt-drop-zone" id="unzip-drop-zone">
            <div class="zt-icon">📂</div>
            <span>点击 / 拖拽 .zip 文件</span>
            <span class="zt-hint">若含多个文件将自动重新打包为 ZIP 供下载</span>
            <input id="unzip-input" type="file" accept=".zip" hidden>
          </div>
          <div class="zt-log" id="unzip-log">等待上传压缩包...</div>
        </div>
        
      </div>
    </div>

    <!-- ================= Gzip 文本压缩 ================= -->
    <div id="panel-gzip" class="zt-panel">
      <div class="zt-row">
        <div class="zt-col">
          <label>输入文本 (String) <button class="zt-mini-btn" onclick="document.getElementById('gz-input').value=''; updateGzipStats();">🗑️ 清空</button></label>
          <textarea id="gz-input" class="zt-textarea" rows="8" placeholder="在此输入要压缩的文本..."></textarea>
        </div>
        <div class="zt-col">
          <label>输出结果 (Base64) <button class="zt-mini-btn" onclick="copyText('gz-output')">📋 复制</button></label>
          <textarea id="gz-output" class="zt-textarea" rows="8" placeholder="压缩或解压的结果..."></textarea>
        </div>
      </div>
      
      <div class="gz-stats" id="gz-stats">
        <span>原始大小: <b id="gz-size-in">0</b></span>
        <span>压缩后大小: <b id="gz-size-out">0</b></span>
        <span>压缩率: <b id="gz-ratio">0%</b></span>
      </div>

      <div class="zt-row center" style="margin-top: 16px;">
        <button id="btn-gz-compress" class="zt-btn primary">🗜️ 压缩 (Compress)</button>
        <button id="btn-gz-decompress" class="zt-btn">🔓 解压 (Decompress)</button>
        <button id="btn-gz-download" class="zt-btn">💾 下载为 .gz 文件</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/jszip.min.js"></script>
<script src="../../js/libs/pako.min.js"></script>
<script src="../../js/zip-tool.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
