<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>证件照处理与水印工具箱 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/watermark.css">
</head>
<body>
<header class="tool-page-header">
  <h1>📸 证件照处理工具箱</h1>
  <p>加水印、换底色、排版打印，一站式本地处理，保护隐私</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="wm-tool" style="padding-top: 0;">
  
  <!-- Tab 切换按钮 -->
  <div class="app-tabs">
    <button class="tab-btn active" data-tab="tab-watermark">💧 加水印与换底色</button>
    <button class="tab-btn" data-tab="tab-print">🖨️ 证件照排版打印</button>
  </div>

  <!-- ================= Tab 1: 加水印与换底色 ================= -->
  <div id="tab-watermark" class="tab-content active">
    <div class="wm-layout">
      <!-- 左侧面板 -->
      <section class="wm-panel">
        <!-- 1. 上传 -->
        <div class="wm-section">
          <h2>1. 上传图片</h2>
          <div id="wm-drop-zone" class="wm-drop-zone">
            <span>📁 点击选择或拖拽图片到这里</span>
            <span class="wm-hint">支持 JPG / PNG / WebP，最大 20MB</span>
            <input id="wm-image-input" type="file" accept="image/*,.heic,.heif" hidden>
          </div>
        </div>

        <!-- 2. 水印 -->
        <div class="wm-section">
          <h2>2. 水印设置</h2>
          <label class="wm-label">水印文字</label>
          <input id="wm-text" class="wm-input" type="text" placeholder="输入水印文字" value="仅供办理业务使用，他用无效">
          <div class="wm-row">
            <div class="wm-col">
              <label class="wm-label">字体文件 (可选)</label>
              <label class="wm-upload-btn">📄 上传 TTF/OTF<input id="wm-font-input" type="file" accept=".ttf,.otf,.woff,.woff2" hidden></label>
              <span id="wm-font-name" class="wm-file-name"></span>
            </div>
            <div class="wm-col">
              <label class="wm-label">颜色</label>
              <div class="wm-color-wrap" title="点击选择颜色"><input id="wm-color" type="color" value="#8a5a2b"></div>
            </div>
          </div>
          <div class="wm-row">
            <div class="wm-col"><label class="wm-label">字号大小</label><input id="wm-size" type="range" min="10" max="200" value="40"></div>
            <div class="wm-col"><label class="wm-label">透明度</label><input id="wm-opacity" type="range" min="10" max="100" value="40"></div>
          </div>
        </div>

        <!-- 3. 换底色 -->
        <div class="wm-section">
          <h2 style="display: flex; justify-content: space-between; align-items: center;">
            <span>3. 证件照换底色</span>
            <label class="wm-switch">
              <input type="checkbox" id="wm-enable-bg">
              <span class="wm-slider"></span>
            </label>
          </h2>
          <div id="wm-bg-settings" style="display: none; margin-top: 12px;">
            <div class="wm-row">
              <div class="wm-col">
                <label class="wm-label">原背景色 (可点击图片吸取)</label>
                <div class="wm-row" style="align-items: center; gap: 8px;">
                  <button id="wm-eyedropper" class="wm-btn-small">🔍 吸管</button>
                  <div id="wm-origin-color-preview" style="width:28px; height:28px; border-radius:6px; background:#438edb; border:1px solid #ccc;"></div>
                </div>
              </div>
              <div class="wm-col">
                <label class="wm-label">目标背景色</label>
                <div class="wm-color-presets">
                  <button type="button" class="wm-bg-color-btn active" data-color="#ffffff" style="background:#ffffff" title="白底"></button>
                  <button type="button" class="wm-bg-color-btn" data-color="#438edb" style="background:#438edb" title="蓝底"></button>
                  <button type="button" class="wm-bg-color-btn" data-color="#ff0000" style="background:#ff0000" title="红底"></button>
                </div>
              </div>
            </div>
            <div class="wm-row">
              <div class="wm-col">
                <label class="wm-label">容差微调 (边缘羽化)</label>
                <input id="wm-tolerance" type="range" min="10" max="150" value="60">
              </div>
            </div>
            <p class="wm-hint">提示：衣服被替换请调小，边缘有杂色请调大。</p>
          </div>
        </div>

        <!-- 4. 位置 -->
        <div class="wm-section">
          <h2>4. 水印位置</h2>
          <div class="wm-positions">
            <button data-pos="top-left">↖️</button>
            <button data-pos="top-center">⬆️</button>
            <button data-pos="top-right">↗️</button>
            <button data-pos="center-left">⬅️</button>
            <button data-pos="center">⏺️</button>
            <button data-pos="center-right">➡️</button>
            <button data-pos="bottom-left">↙️</button>
            <button data-pos="bottom-center">⬇️</button>
            <button data-pos="bottom-right">↘️</button>
            <button data-pos="tile" class="wm-btn-tile">🔲 全屏平铺</button>
          </div>
        </div>
      </section>
      
      <!-- 右侧预览 -->
      <section class="wm-preview">
        <div class="wm-canvas-container" id="wm-canvas-container">
          <p id="wm-placeholder" class="wm-placeholder">上传图片后在此预览</p>
          <canvas id="wm-canvas"></canvas>
        </div>
        <button id="wm-download" class="wm-download-btn" disabled>⬇️ 下载处理后的图片</button>
      </section>
    </div>
  </div>

  <!-- ================= Tab 2: 证件照排版打印 ================= -->
  <div id="tab-print" class="tab-content">
    <div class="ps-layout">
      <!-- 左侧设置 -->
      <section class="wm-panel ps-panel">
        <div class="wm-section">
          <h2>1. 上传单张照片</h2>
          <div id="ps-drop-zone" class="wm-drop-zone">
            <span>📁 点击或拖拽照片至此</span>
            <span class="wm-hint">系统将自动为您拼版</span>
            <input id="ps-image-input" type="file" accept="image/*" hidden>
          </div>
        </div>

        <div class="wm-section" id="ps-settings" style="display: none;">
          <h2>2. 排版设置</h2>
          
          <div class="wm-row">
            <label class="wm-label" style="flex: 1; margin: 0;">相纸尺寸：</label>
            <select id="ps-paper-size" class="wm-input" style="width: 160px;">
              <option value="6inch">标准 6寸 (4x6英寸)</option>
              <option value="5inch">标准 5寸 (3.5x5英寸)</option>
            </select>
          </div>

          <div class="wm-row" style="margin-top: 12px;">
            <label class="wm-label" style="flex: 1; margin: 0;">照片规格：</label>
            <select id="ps-photo-size" class="wm-input" style="width: 160px;">
              <option value="1inch">一寸 (25x35mm)</option>
              <option value="2inch">二寸 (35x53mm)</option>
              <option value="small1">小一寸 (22x32mm)</option>
              <option value="small2">小二寸 (35x45mm)</option>
            </select>
          </div>

          <div class="wm-row" style="margin-top: 12px;">
            <label class="checkbox-label">
              <input type="checkbox" id="ps-cut-lines" checked> 显示切割辅助线
            </label>
          </div>

          <button id="ps-download" class="wm-download-btn" style="margin-top: 16px; width: 100%;">💾 导出打印高清图</button>
          
          <p class="wm-hint" style="margin-top: 12px; line-height: 1.6;">
            💡 <strong>打印提示：</strong><br>
            发给打印店并强调<strong>“按 6寸相纸、满版、不缩放打印”</strong>。打印后沿辅助线剪开即可。
          </p>
        </div>
      </section>

      <!-- 右侧预览 -->
      <section class="wm-preview">
        <div class="wm-canvas-container" id="ps-canvas-container">
          <p id="ps-placeholder" class="wm-placeholder">请在左侧上传单张照片<br><small>系统将自动为您排版</small></p>
          <canvas id="ps-canvas"></canvas>
        </div>
      </section>
    </div>
  </div>

</main>
<script src="../../js/watermark.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
