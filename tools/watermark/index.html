<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片加水印</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="tool-body">
<div class="tool-page">
  <a class="back" href="../../">← 返回首页</a>
  <h1>图片加水印</h1>
  <p style="color:#666;font-size:.85rem;margin-bottom:1rem">图片不会上传，全部在浏览器本地处理。</p>

  <input type="file" id="wm-input" accept="image/*">
  <input id="wm-text" placeholder="水印文字" value="© 我的水印">

  <label style="display:block;margin:.75rem 0;font-size:.9rem">
    透明度：<input type="range" id="wm-opacity" min="0.1" max="1" step="0.1" value="0.5" style="width:200px;vertical-align:middle">
  </label>

  <label style="display:block;margin:.75rem 0;font-size:.9rem">
    水印位置：
    <select id="wm-position" style="width:auto;display:inline-block;margin-left:.5rem">
      <option value="top-left">左上角</option>
      <option value="top-center">顶部居中</option>
      <option value="top-right">右上角</option>
      <option value="middle-left">左侧居中</option>
      <option value="center" selected>正中间</option>
      <option value="middle-right">右侧居中</option>
      <option value="bottom-left">左下角</option>
      <option value="bottom-center">底部居中</option>
      <option value="bottom-right">右下角</option>
    </select>
  </label>

  <button onclick="addWatermark()" id="wm-btn">添加水印</button>
  <div class="status" id="wm-status"></div>
  <div class="result" id="wm-result"></div>
</div>

<script>
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

async function addWatermark() {
  const file = document.getElementById('wm-input').files[0];
  const text = document.getElementById('wm-text').value.trim();
  if (!file) { document.getElementById('wm-status').textContent = '请选择图片'; return; }
  if (!text) { document.getElementById('wm-status').textContent = '请输入水印文字'; return; }
  if (file.size > MAX_FILE_SIZE) {
    document.getElementById('wm-status').textContent =
      `文件过大（${(file.size / 1024 / 1024).toFixed(1)}MB），请上传小于 10MB 的图片。`;
    return;
  }

  document.getElementById('wm-btn').disabled = true;
  document.getElementById('wm-status').textContent = '处理中...';

  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();

  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');

  // 绘制原图
  ctx.drawImage(img, 0, 0);

  // 水印参数
  const opacity = parseFloat(document.getElementById('wm-opacity').value);
  const position = document.getElementById('wm-position').value;
  const fontSize = Math.max(20, Math.round(img.naturalWidth / 20));
  ctx.font = `${fontSize}px sans-serif`;
  ctx.textBaseline = 'middle';

  // 计算文字宽高
  const textWidth = ctx.measureText(text).width;
  const textHeight = fontSize;

  // 边距：图片宽度的 4%，最小 20px
  const margin = Math.max(20, Math.round(img.naturalWidth * 0.04));

  let x, y;
  // 根据位置计算绘制坐标（x 为文字中心点，y 为文字垂直中心）
  switch (position) {
    case 'top-left':
      x = margin + textWidth / 2;
      y = margin + textHeight / 2;
      break;
    case 'top-center':
      x = canvas.width / 2;
      y = margin + textHeight / 2;
      break;
    case 'top-right':
      x = canvas.width - margin - textWidth / 2;
      y = margin + textHeight / 2;
      break;
    case 'middle-left':
      x = margin + textWidth / 2;
      y = canvas.height / 2;
      break;
    case 'center':
      x = canvas.width / 2;
      y = canvas.height / 2;
      break;
    case 'middle-right':
      x = canvas.width - margin - textWidth / 2;
      y = canvas.height / 2;
      break;
    case 'bottom-left':
      x = margin + textWidth / 2;
      y = canvas.height - margin - textHeight / 2;
      break;
    case 'bottom-center':
      x = canvas.width / 2;
      y = canvas.height - margin - textHeight / 2;
      break;
    case 'bottom-right':
      x = canvas.width - margin - textWidth / 2;
      y = canvas.height - margin - textHeight / 2;
      break;
    default:
      x = canvas.width / 2;
      y = canvas.height / 2;
  }

  // 绘制水印（先描边后填充，增加可读性）
  ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
  ctx.strokeStyle = `rgba(0, 0, 0, ${opacity * 0.5})`;
  ctx.lineWidth = Math.max(2, fontSize / 15);
  ctx.textAlign = 'center';
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);

  // 导出
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  const url = URL.createObjectURL(blob);
  document.getElementById('wm-status').textContent = '✓ 完成';
  document.getElementById('wm-result').innerHTML =
    `<img src="${url}" alt="加水印结果"><br><a href="${url}" download="watermarked.jpg">下载图片</a>`;
  document.getElementById('wm-btn').disabled = false;
}
</script>
</body>
</html>
