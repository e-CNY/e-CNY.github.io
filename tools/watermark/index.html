<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片加水印 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/watermark.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🖼️ 图片加水印</h1>
  <p>支持自定义字体、颜色、位置和平铺，全程在浏览器本地处理。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="wm-tool" style="padding-top: 0;">
  <div class="wm-layout">
    <section class="wm-panel">
      <div class="wm-section">
        <h2>1. 上传图片</h2>
        <div id="wm-drop-zone" class="wm-drop-zone">
          <span>📁 点击选择或拖拽图片到这里</span>
          <span class="wm-hint">支持 JPG / PNG / WebP，最大 20MB</span>
          <input id="wm-image-input" type="file" accept="image/*,.heic,.heif" hidden>
        </div>
      </div>
      <div class="wm-section">
        <h2>2. 水印设置</h2>
        <label class="wm-label">水印文字</label>
        <input id="wm-text" class="wm-input" type="text" placeholder="输入水印文字" value="© 我的版权">
        <div class="wm-row">
          <div class="wm-col">
            <label class="wm-label">字体文件 (可选)</label>
            <label class="wm-upload-btn">📄 上传 TTF/OTF/WOFF<input id="wm-font-input" type="file" accept=".ttf,.otf,.woff,.woff2" hidden></label>
            <span id="wm-font-name" class="wm-file-name"></span>
          </div>
          <div class="wm-col">
            <label class="wm-label">颜色</label>
            <div class="wm-color-wrap" title="点击选择颜色"><input id="wm-color" type="color" value="#8a5a2b"></div>
          </div>
        </div>
        <div class="wm-row">
          <div class="wm-col"><label class="wm-label">字号大小</label><input id="wm-size" type="range" min="10" max="200" value="40"></div>
          <div class="wm-col"><label class="wm-label">透明度</label><input id="wm-opacity" type="range" min="10" max="100" value="80"></div>
        </div>
      </div>
      <div class="wm-section">
        <h2>3. 水印位置</h2>
        <div class="wm-positions">
          <button data-pos="top-left">↖️</button>
          <button data-pos="top-center">⬆️</button>
          <button data-pos="top-right">↗️</button>
          <button data-pos="center-left">⬅️</button>
          <button data-pos="center">⏺️</button>
          <button data-pos="center-right">➡️</button>
          <button data-pos="bottom-left">↙️</button>
          <button data-pos="bottom-center">⬇️</button>
          <button data-pos="bottom-right">↘️</button>
          <button data-pos="tile" class="wm-btn-tile">🔲 全屏平铺</button>
        </div>
      </div>
    </section>
    <section class="wm-preview">
      <div class="wm-canvas-container" id="wm-canvas-container">
        <p id="wm-placeholder" class="wm-placeholder">上传图片后在此预览</p>
        <canvas id="wm-canvas"></canvas>
      </div>
      <button id="wm-download" class="wm-download-btn" disabled>⬇️ 下载水印图片</button>
    </section>
  </div>
</main>
<script src="../../js/watermark.js" defer></script>
</body>
</html>
