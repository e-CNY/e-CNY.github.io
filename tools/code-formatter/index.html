<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多语言代码格式化 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/code-formatter.css">
</head>
<body>
<header class="tool-page-header">
  <h1>🪄 多语言代码格式化</h1>
  <p>支持 JS / TS / HTML / CSS / JSON / YAML / Markdown / SQL / Vue / GraphQL 美化与压缩。</p>
  <a href="../../index.html">← 返回工具站</a>
</header>

<main class="cf-layout" style="padding-top: 0;">
  <div class="cf-toolbar">
    <div class="cf-group">
      <select id="cf-language" class="cf-select">
        <option value="json">JSON</option>
        <option value="javascript">JavaScript (Babel)</option>
        <option value="typescript">TypeScript</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="scss">SCSS</option>
        <option value="yaml">YAML</option>
        <option value="markdown">Markdown</option>
        <option value="sql">SQL</option>
        <option value="vue">Vue</option>
        <option value="graphql">GraphQL</option>
      </select>

      <select id="cf-indent" class="cf-select">
        <option value="2">2 空格缩进</option>
        <option value="4">4 空格缩进</option>
        <option value="tab">Tab 缩进</option>
      </select>
    </div>

    <div class="cf-group">
      <button id="btn-format" class="cf-btn primary">✨ 格式化/美化</button>
      <button id="btn-minify" class="cf-btn">🗜️ 极限压缩</button>
      <button id="btn-copy" class="cf-btn">📋 复制结果</button>
      <button id="btn-clear" class="cf-btn danger">🗑️ 清空</button>
    </div>
  </div>

  <div class="cf-container">
    <div class="cf-col">
      <div class="cf-col-header">输入代码</div>
      <textarea id="cf-input" class="cf-textarea" spellcheck="false" placeholder="在此粘贴代码..."></textarea>
    </div>
    <div class="cf-col">
      <div class="cf-col-header">输出结果 <span id="cf-status"></span></div>
      <textarea id="cf-output" class="cf-textarea" spellcheck="false" readonly placeholder="格式化结果..."></textarea>
    </div>
  </div>
</main>

<!-- Prettier 核心与插件（本地化引入） -->
<script src="../../js/libs/prettier/standalone.min.js"></script>
<script src="../../js/libs/prettier/babel.min.js"></script>
<script src="../../js/libs/prettier/estree.min.js"></script>
<script src="../../js/libs/prettier/typescript.min.js"></script>
<script src="../../js/libs/prettier/html.min.js"></script>
<script src="../../js/libs/prettier/postcss.min.js"></script>
<script src="../../js/libs/prettier/yaml.min.js"></script>
<script src="../../js/libs/prettier/markdown.min.js"></script>
<script src="../../js/libs/prettier/graphql.min.js"></script>

<!-- SQL Formatter（本地化引入） -->
<script src="../../js/libs/sql-formatter.min.js"></script>

<script src="../../js/code-formatter.js" defer></script>
</body>
</html>
