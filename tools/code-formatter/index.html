<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语言代码格式化 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/code-formatter.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="cf-layout">
  <div class="cf-toolbar">
    <div class="cf-group">
      <select id="cf-language" class="cf-select">
        <option value="json">JSON</option>
        <option value="javascript">JavaScript (Babel)</option>
        <option value="typescript">TypeScript</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="scss">SCSS</option>
        <option value="yaml">YAML</option>
        <option value="markdown">Markdown</option>
        <option value="sql">SQL</option>
        <option value="vue">Vue</option>
        <option value="graphql">GraphQL</option>
      </select>

      <select id="cf-indent" class="cf-select">
        <option value="2">2 空格缩进</option>
        <option value="4">4 空格缩进</option>
        <option value="tab">Tab 缩进</option>
      </select>
    </div>

    <div class="cf-group">
      <button id="btn-format" class="cf-btn primary">✨ 格式化</button>
      <button id="btn-minify" class="cf-btn">🗜️ 极限压缩</button>
      <button id="btn-copy" class="cf-btn">📋 复制</button>
      <button id="btn-download" class="cf-btn">💾 下载</button>
      <button id="btn-clear" class="cf-btn danger">🗑️ 清空</button>
    </div>
  </div>

  <div class="cf-container">
    <!-- 左侧输入 -->
    <div class="cf-col">
      <div class="cf-col-header">
        <span>📝 输入代码 (支持拖拽文件)</span>
        <label class="cf-upload-btn">📂 导入<input type="file" id="cf-file" hidden></label>
      </div>
      <div class="cf-editor-wrap">
        <div class="cf-line-numbers" id="line-nums-in">1</div>
        <textarea id="cf-input" class="cf-textarea" spellcheck="false" placeholder="在此粘贴代码，或拖拽代码文件到这里..."></textarea>
      </div>
    </div>
    
    <!-- 右侧输出 -->
    <div class="cf-col">
      <div class="cf-col-header">
        <span>✨ 输出结果 <span id="cf-status"></span></span>
      </div>
      <div class="cf-editor-wrap">
        <div class="cf-line-numbers" id="line-nums-out">1</div>
        <textarea id="cf-output" class="cf-textarea" spellcheck="false" readonly placeholder="格式化结果将显示在这里..."></textarea>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<!-- Prettier 核心与插件（本地化引入） -->
<script src="../../js/libs/prettier/standalone.min.js"></script>
<script src="../../js/libs/prettier/babel.min.js"></script>
<script src="../../js/libs/prettier/estree.min.js"></script>
<script src="../../js/libs/prettier/typescript.min.js"></script>
<script src="../../js/libs/prettier/html.min.js"></script>
<script src="../../js/libs/prettier/postcss.min.js"></script>
<script src="../../js/libs/prettier/yaml.min.js"></script>
<script src="../../js/libs/prettier/markdown.min.js"></script>
<script src="../../js/libs/prettier/graphql.min.js"></script>

<!-- SQL Formatter（本地化引入） -->
<script src="../../js/libs/sql-formatter.min.js"></script>

<script src="../../js/code-formatter.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
