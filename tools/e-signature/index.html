<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高清电子签名生成器 - 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/e-signature.css">
</head>
<body>
<div class="tool-page-header">
  <h1>✒️ 高清电子签名生成器</h1>
  <p>丝滑手写体验，自动裁切留白，一键导出透明背景 PNG</p>
  <a href="../../index.html">← 返回首页</a>
</div>

<main class="es-wrap">
  <!-- 左侧控制面板 -->
  <div class="control-panel">
    <div class="panel-section">
      <label class="section-title">🖋️ 1. 画笔设置</label>
      
      <div class="setting-row">
        <label>画笔颜色：</label>
        <div class="color-presets">
          <button class="color-btn active" data-color="#000000" style="background: #000000;" title="黑色"></button>
          <button class="color-btn" data-color="#1a56db" style="background: #1a56db;" title="深蓝"></button>
          <button class="color-btn" data-color="#e02424" style="background: #e02424;" title="红色"></button>
        </div>
        <input type="color" id="custom-color" value="#000000" title="自定义颜色">
      </div>

      <div class="setting-row">
        <label>笔画粗细：</label>
        <input type="range" id="brush-size" min="1" max="10" step="0.5" value="3">
        <span id="brush-size-val">3</span>
      </div>
    </div>

    <div class="panel-section">
      <label class="section-title">📄 2. 画板背景</label>
      <select id="bg-mode">
        <option value="white">白底 (方便手写)</option>
        <option value="transparent">透明底 (预览网格)</option>
        <option value="grid">点阵辅助线</option>
      </select>
      <p class="hint">注：无论选择什么背景，导出的图片均为**透明背景**。</p>
    </div>

    <div class="panel-section">
      <label class="section-title">✂️ 3. 智能裁切</label>
      <label class="checkbox-label">
        <input type="checkbox" id="auto-crop" checked>
        导出时自动裁切四周多余空白
      </label>
    </div>

    <div class="panel-section">
      <label class="section-title">💾 4. 导出保存</label>
      <button id="btn-download" class="primary-btn" style="width: 100%;">⬇️ 下载透明 PNG</button>
    </div>
  </div>

  <!-- 右侧画板区 -->
  <div class="preview-panel">
    <div class="canvas-container" id="canvas-container">
      <canvas id="signature-canvas"></canvas>
    </div>
    
    <div class="action-bar">
      <button id="btn-undo" class="secondary-btn" disabled>↩️ 撤销上一步</button>
      <button id="btn-clear" class="secondary-btn">🗑️ 清空画板</button>
    </div>
  </div>
</main>

<script src="../../js/e-signature.js"></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
