<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorem Ipsum器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/lorem-ipsum.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin:0!important;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="lorem-wrap">
  <div class="lorem-layout">
    <!-- 左侧控制区 -->
    <aside class="lorem-sidebar">
      
      <!-- 1. 基本设置 -->
      <div class="lorem-card">
        <h3>1. 基础设置</h3>
        
        <div class="form-row">
          <label>语言</label>
          <select id="lang" class="form-select">
            <option value="latin">拉丁 Lorem</option>
            <option value="zh">中文</option>
            <option value="ja">日文</option>
            <option value="ko">韩文</option>
            <option value="de">德语 (Deutsch)</option>
            <option value="fr">法语 (Français)</option>
            <option value="es">西语 (Español)</option>
          </select>
        </div>

        <div class="form-row">
          <label>输出格式</label>
          <select id="format" class="form-select">
            <option value="html">HTML 源码</option>
            <option value="markdown">Markdown 源码</option>
            <option value="text">纯文本</option>
          </select>
        </div>

        <div class="form-row">
          <label>生成单位</label>
          <select id="mode" class="form-select">
            <option value="paragraphs">按段落</option>
            <option value="sentences">按句子</option>
            <option value="words">按单词</option>
          </select>
        </div>

        <div class="form-row-group">
          <div class="form-group-col">
            <label>数量</label>
            <input id="count" type="number" min="1" max="500" value="3" class="form-input">
          </div>
          <div class="form-group-col">
            <label title="0表示不限字数">字数上限</label>
            <input id="maxChars" type="number" min="0" max="100000" value="0" class="form-input">
          </div>
        </div>

        <label class="form-checkbox">
          <input id="startClassic" type="checkbox" checked> 
          以 "Lorem ipsum…" 开头（仅拉丁文）
        </label>
      </div>

      <!-- 2. 自定义词源 -->
      <div class="lorem-card">
        <h3 style="display:flex; justify-content:space-between; align-items:center;">
          <span>2. 自定义词源</span>
          <label class="form-checkbox" style="margin-bottom:0;">
            <input id="useCustom" type="checkbox"> 启用
          </label>
        </h3>
        <div id="customWrap" style="display:none; margin-top:10px;">
          <textarea id="customText" class="form-textarea" placeholder="粘贴你的词源文本，系统将自动按空格或标点分割，中文字符按2字组合切分..." rows="4"></textarea>
        </div>
      </div>

      <!-- 3. 标签包裹设置 (仅 HTML/Markdown 格式生效) -->
      <div class="lorem-card" id="tagsPanel">
        <h3>3. 标签包裹</h3>
        
        <label class="section-label">块级容器</label>
        <select id="blockTag" class="form-select" style="margin-bottom: 12px;">
          <option value="none">无包裹 (纯文本)</option>
          <optgroup label="HTML 标签">
            <option value="p">&lt;p&gt; 段落</option>
            <option value="h1">&lt;h1&gt; 大标题</option>
            <option value="h2">&lt;h2&gt; 中标题</option>
            <option value="h3">&lt;h3&gt; 小标题</option>
            <option value="blockquote">&lt;blockquote&gt; 引用</option>
            <option value="ul">&lt;ul&gt; 无序列表</option>
            <option value="ol">&lt;ol&gt; 有序列表</option>
            <option value="mixed">🎲 随机混搭</option>
          </optgroup>
          <optgroup label="Markdown 语法">
            <option value="md_h1"># 大标题</option>
            <option value="md_h2">## 中标题</option>
            <option value="md_h3">### 小标题</option>
            <option value="md_bq">&gt; 引用</option>
            <option value="md_ul">- 无序列表</option>
            <option value="md_ol">1. 有序列表</option>
          </optgroup>
        </select>

        <div id="inlineTagsWrap">
          <label class="section-label" style="display:flex; justify-content:space-between;">
            <span>行内修饰 (多选)</span>
            <button id="clearInlineTags" class="btn-text">清空选择</button>
          </label>
          <div class="inline-tags-grid">
            <label><input type="checkbox" value="b"> &lt;b&gt;</label>
            <label><input type="checkbox" value="i"> &lt;i&gt;</label>
            <label><input type="checkbox" value="u"> &lt;u&gt;</label>
            <label><input type="checkbox" value="strong"> &lt;strong&gt;</label>
            <label><input type="checkbox" value="em"> &lt;em&gt;</label>
            <label><input type="checkbox" value="mark"> &lt;mark&gt;</label>
            <label><input type="checkbox" value="del"> &lt;del&gt;</label>
            <label><input type="checkbox" value="a"> &lt;a&gt;</label>
            <label><input type="checkbox" value="code"> &lt;code&gt;</label>
            <label><input type="checkbox" value="kbd"> &lt;kbd&gt;</label>
          </div>
        </div>
      </div>

      <button id="generate" class="generate-btn">✨ 重新生成文本</button>
    </aside>

    <!-- 右侧输出区 -->
    <div class="lorem-main">
      
      <!-- 工具栏 -->
      <div class="output-toolbar">
        <div class="stats-bar">
          <span>单词：<b id="stWords">0</b></span>
          <span>字符：<b id="stChars">0</b></span>
          <span>句子：<b id="stSentences">0</b></span>
          <span>段落：<b id="stParagraphs">0</b></span>
        </div>
        <div class="action-bar">
          <button id="copy" class="action-btn primary">📋 复制源码</button>
          <button id="copyText" class="action-btn">📄 仅复制文本</button>
          <button id="download" class="action-btn">💾 下载文件</button>
        </div>
      </div>

      <!-- 内容展示 -->
      <div class="output-content">
        <!-- 源码 -->
        <textarea id="output" class="output-code" readonly spellcheck="false" placeholder="生成结果将出现在这里…"></textarea>
        
        <!-- 渲染预览 -->
        <div class="output-preview-wrap" id="previewWrap">
          <div id="preview" class="output-preview"></div>
        </div>
      </div>

      <!-- 切换视图 -->
      <div class="view-toggle">
        <button class="view-btn active" data-view="code">💻 源码</button>
        <button class="view-btn" data-view="preview">👁️ 渲染预览</button>
      </div>

    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/lorem-ipsum.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
