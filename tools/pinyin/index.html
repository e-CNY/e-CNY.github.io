<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字拼音转换器 - 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/pinyin.css">
</head>
<body>
<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;font-size:15px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;">↩️</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;font-size:0!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->


  
  
  
</div>

<main class="pinyin-wrap">
  
  <!-- 顶部工具栏 -->
  <div class="control-bar">
    <div class="left-tools">
      <div class="option-group">
        <label>声调模式</label>
        <select id="tone-type">
          <option value="symbol">带声调 (wǒ)</option>
          <option value="num">数字声调 (wo3)</option>
          <option value="none">无声调 (wo)</option>
          <option value="first">仅首字母 (w)</option>
        </select>
      </div>
      
      <label class="switch-label">
        <input type="checkbox" id="realtime" checked> 实时转换
      </label>
      
      <button id="btn-convert" class="primary-btn">⚡ 立即转换</button>
      <button id="btn-clear" class="secondary-btn">🗑️ 清空</button>
    </div>
    
    <div class="right-tools">
      <input type="file" id="file-upload" accept=".txt,.md" hidden>
      <button id="btn-upload" class="secondary-btn">📁 导入文件</button>
      <button id="btn-download" class="secondary-btn">💾 导出结果</button>
    </div>
  </div>

  <!-- 文本编辑区 -->
  <div class="text-container">
    
    <!-- 左侧输入 -->
    <div class="textarea-box" id="input-box">
      <div class="box-header">
        <span>📝 原始中文文本</span>
        <div class="box-actions">
          <button class="text-btn" id="btn-trim" title="去除首尾空格">✂️ 去首尾空格</button>
          <button class="text-btn" id="btn-remove-empty" title="删除所有空行">🪣 删空行</button>
        </div>
      </div>
      <textarea id="input-text" placeholder="在此输入或粘贴需要转换的中文文本，或直接拖拽 TXT 文件到这里..."></textarea>
      <div class="status-bar">
        <span>字符: <b id="input-count">0</b> | 段落: <b id="input-paragraphs">0</b></span>
      </div>
    </div>

    <!-- 右侧输出 -->
    <div class="textarea-box" id="output-box">
      <div class="box-header">
        <span>✨ 拼音转换结果</span>
      </div>
      <textarea id="output-text" placeholder="转换结果会自动显示在这里..." readonly></textarea>
      <div class="status-bar">
        <span>字符: <b id="output-count">0</b> | 段落: <b id="output-paragraphs">0</b></span>
        <button id="btn-copy" class="text-btn">📋 复制结果</button>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../../js/libs/pinyin-pro.min.js"></script>
<script src="../../js/pinyin.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
