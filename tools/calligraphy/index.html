<!doctype html>
<html lang="zh-CN">
<head>
<script>window.IS_WASM_TOOL = false;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书法字帖生成器 · 工具站</title>
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/calligraphy.css">
</head>
<body>

<div class="tool-page-header theme-header" data-hdr-styled="1" style="position:static!important;display:block!important;padding:8px 16px!important;margin:0 0 8px 0!important;min-height:0!important;text-align:left!important;box-sizing:border-box!important;">
<!-- __THEME_INJECT_BEGIN__ -->
<link rel="stylesheet" href="../../css/theme.css">
<div class="theme-actions" data-act-styled="1" style="position:static!important;top:auto!important;left:auto!important;right:auto!important;z-index:auto!important;width:100%!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 16px!important;margin:0!important;min-height:32px!important;box-sizing:border-box!important;">
    <a class="cs-icon-btn" id="btn-back-home" href="../../index.html" title="返回首页" aria-label="返回首页" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:15px!important;">&#8617;&#65039;</a>
    <button class="cs-icon-btn" id="btn-theme" type="button" title="切换主题" style="display:inline-flex!important;align-items:center!important;justify-content:center!important;height:30px!important;line-height:1!important;padding:0 10px!important;box-sizing:border-box!important;text-decoration:none!important;vertical-align:middle!important;white-space:nowrap!important;margin: -30px;flex:0 0 auto!important;font-size:0!important;"></button>
  </div>
<script src="../../js/theme.js"></script>
<!-- __THEME_INJECT_END__ -->
</div>

<main class="cg-layout">
  <div class="cg-container">
    <!-- 左侧设置栏 -->
    <aside class="cg-sidebar">
      
      <!-- 1. 字体设置 -->
      <div class="cg-section">
        <h3>1. 字体设置</h3>
        <div class="cg-row">
          <label>内置字体</label>
          <select id="cg-font-family" class="cg-select">
            <option value="'LXGW WenKai', 'KaiTi', 'STKaiti', serif">霞鹜文楷 / 楷体 (推荐)</option>
            <option value="'SimSun', 'Songti SC', serif">宋体</option>
            <option value="'Microsoft YaHei', 'PingFang SC', sans-serif">黑体</option>
            <option value="'STXingkai', 'Xingkai SC', cursive">行楷</option>
          </select>
        </div>
        <div class="cg-row" style="margin-top: 10px;">
          <label class="cg-upload-btn">
            📁 上传自定义字体
            <input id="cg-font-input" type="file" accept=".ttf,.otf,.woff,.woff2" hidden>
          </label>
          <span id="cg-font-name" class="cg-file-name">未上传自定义字体</span>
        </div>
      </div>

      <!-- 2. 字帖内容 -->
      <div class="cg-section">
        <h3>2. 字帖内容 <span id="cg-word-count" style="color:#8a5a2b;font-size:.8rem;">0/2000字</span></h3>
        <textarea id="cg-text" class="cg-textarea" rows="5" maxlength="2000" placeholder="在此输入要练习的文字（最多2000字）..."></textarea>
      </div>

      <!-- 3. 排版与样式 -->
      <div class="cg-section">
        <h3>3. 排版与外观</h3>
        <div class="cg-row">
          <label>格子样式</label>
          <select id="cg-grid-style" class="cg-select">
            <option value="tian">田字格</option>
            <option value="mi">米字格</option>
            <option value="square">空白方格</option>
            <option value="none">无边框</option>
          </select>
        </div>
        <div class="cg-row">
          <label>临摹模式</label>
          <select id="cg-mode" class="cg-select">
            <option value="copy">临摹 (一实一空)</option>
            <option value="trace">全描红 (浅灰色)</option>
            <option value="dashed">全描边 (虚线轮廓)</option>
            <option value="blank">纯空白 (只画格子)</option>
          </select>
        </div>
        <div class="cg-row">
          <label>行列数</label>
          <select id="cg-layout" class="cg-select">
            <option value="10x10">10列 x 10行 (标准大字帖)</option>
            <option value="12x12">12列 x 12行 (小字帖)</option>
            <option value="8x8">8列 x 8行 (特大字)</option>
            <option value="5x10">5列 x 10行 (诗词排版)</option>
          </select>
        </div>
        <div class="cg-row row-half">
          <div>
            <label>纸张背景</label>
            <input type="color" id="cg-bg-color" value="#ffffff" class="cg-color">
          </div>
          <div>
            <label>网格颜色</label>
            <input type="color" id="cg-grid-color" value="#e2e8f0" class="cg-color">
          </div>
        </div>
      </div>

      <!-- 4. 导出 -->
      <div class="cg-section">
        <h3>4. 导出生成</h3>
        <div class="cg-row">
          <select id="cg-export-format" class="cg-select">
            <option value="pdf">合并为 PDF (适合打印)</option>
            <option value="png">PNG 图片打包 (ZIP)</option>
            <option value="jpg">JPG 图片打包 (ZIP)</option>
          </select>
        </div>
        <button id="btn-preview" class="cg-btn">👁️ 生成预览</button>
        <button id="btn-download" class="cg-btn primary" disabled>⬇️ 开始下载</button>
      </div>
    </aside>

    <!-- 右侧预览区 -->
    <div class="cg-main">
      <div class="cg-preview-wrap">
        <canvas id="cg-canvas"></canvas>
      </div>
      
      <!-- 翻页控制 -->
      <div class="cg-pagination" id="cg-pagination" style="display: none;">
        <button id="btn-prev-page" class="cg-page-btn">⬅️ 上一页</button>
        <span id="cg-page-info">第 1 页 / 共 1 页</span>
        <button id="btn-next-page" class="cg-page-btn">下一页 ➡️</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<!-- 引入依赖 -->
<script src="../../js/libs/jspdf.umd.min.js"></script>
<script src="../../js/libs/jszip.min.js"></script>
<script src="../../js/calligraphy.js" defer></script>
<script src="../../js/traffic-guard.js"></script>
</body>
</html>
